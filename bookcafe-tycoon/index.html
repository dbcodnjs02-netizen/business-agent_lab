  ctx.fillText(text, x, y - hh / 2);
  ctx.restore();
}

/** 진행 막대 알약 (아이콘 + 막대) */
function drawProgress(ctx, x, y, T, icon, ratio) {
  const w = T * 0.95, hh = T * 0.3, lw = Math.max(1.2, T / 36);
  ctx.save();
  rr(ctx, x - w / 2, y - hh, w, hh, hh / 2); fillStroke(ctx, '#fffaf3', lw);
  ctx.font = `${T * 0.2}px Jua, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(icon, x - w / 2 + hh * 0.55, y - hh / 2);
  const bx = x - w / 2 + hh * 1.05, bw = w - hh * 1.35, by = y - hh * 0.66, bh = hh * 0.32;
  rr(ctx, bx, by, bw, bh, bh / 2); ctx.fillStyle = '#efe6dc'; ctx.fill();
  rr(ctx, bx, by, Math.max(bh, bw * clamp(ratio, 0, 1)), bh, bh / 2); ctx.fillStyle = '#6fb388'; ctx.fill();
  ctx.restore();
}
/** 도장처럼 기울어진 배지 (SOLD · DONE · 완성!) */
function drawStamp(ctx, x, y, T, text, bg, rot = -0.08) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.font = `900 ${Math.max(9, T * 0.19)}px Jua, sans-serif`;
  const w = ctx.measureText(text).width + T * 0.26, hh = T * 0.3;
  rr(ctx, -w / 2, -hh, w, hh, T * 0.08); fillStroke(ctx, bg, Math.max(1.4, T / 30));
  ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1; ctx.setLineDash([3, 2]); rr(ctx, -w / 2 + 3, -hh + 3, w - 6, hh - 6, T * 0.05); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = OUT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 0, -hh / 2 + 0.5);
  ctx.restore();
}
/** 꼬리 달린 대사 말풍선 */
function drawSpeech(ctx, x, y, T, text) {
  ctx.save();
  const fs = Math.max(10, T * 0.2);
  ctx.font = `800 ${fs}px Jua, sans-serif`;
  const w = Math.min(ctx.measureText(text).width, T * 3.2) + fs * 1.1, hh = fs * 1.75, lw = Math.max(1.4, T / 34);
  const bx = Math.round(x - w / 2), by = y - hh;
  ctx.shadowColor = 'rgba(90,61,43,.18)'; ctx.shadowOffsetY = 2;
  rr(ctx, bx, by, w, hh, hh / 2); ctx.fillStyle = '#fff'; ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.strokeStyle = OUT; ctx.lineWidth = lw; ctx.stroke();
  // 꼬리
  ctx.beginPath(); ctx.moveTo(x - fs * 0.35, by + hh - lw); ctx.lineTo(x - fs * 0.1, by + hh + fs * 0.55); ctx.lineTo(x + fs * 0.3, by + hh - lw); ctx.closePath();
  ctx.fillStyle = '#fff'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(x - fs * 0.35, by + hh); ctx.lineTo(x - fs * 0.1, by + hh + fs * 0.55); ctx.lineTo(x + fs * 0.3, by + hh); ctx.stroke();
  ctx.fillStyle = OUT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, x, by + hh / 2 + 0.5, T * 3.2);
  ctx.restore();
}

/** 다른 사람의 카페(친구 방문·아지트)를 작은 캔버스에 그린다 */
/** 화면 크기에 맞는 아이소메트릭 배치 (o.garden = 왼쪽 정원 칸 수, o.top/o.left = HUD가 가리는 여백) */
function isoFit(cols, rows, cw, ch, padBottom = 0, o = {}) {
  const lp = o.garden || 0, top = o.top || 0, left = o.left || 0;
  const aw = cw - left, ah = ch - padBottom - top;
  const span = cols + rows;
  const iw = Math.max(16, Math.min((aw - 20) / ((span + lp) / 2 + 1.0), (ah - 10) / (span / 4 + WALL_K + 1.0)));
  const total = (span * iw) / 4 + (WALL_K + 0.45) * iw + 0.55 * iw;
  const ox = left + aw / 2 - ((cols - rows - lp) * iw) / 4;
  const oy = top + (ah - total) / 2 + (WALL_K + 0.45) * iw;
  return { iw, ih: iw / 2, ox, oy, T: iw * 0.62, cols, rows };
}

/** 다른 사람의 카페(친구 방문·아지트·투표 미리보기)를 작은 캔버스에 */
function renderStaticCafe(canvas, layout, cols, rows, opts = {}) {
  const ctx = canvas.getContext('2d');
  if (!ctx) return;
  const cw = canvas.width, ch = canvas.height;
  const v = { ctx, ...isoFit(cols, rows, cw, ch) };
  const g = ctx.createLinearGradient(0, 0, 0, ch); g.addColorStop(0, opts.bg || '#d6ecf7'); g.addColorStop(1, '#eaf5e0');
  ctx.fillStyle = g; ctx.fillRect(0, 0, cw, ch);
  const layerItems = (layer) => layout.filter((p) => layerOf(FURN[p.id]) === layer);
  drawRoom(v, { sign: opts.sign, t: 0, door: opts.door, wall: opts.wall, floor: opts.floor, windows: !layerItems('wall').length, outside: opts.outside });
  for (const p of layerItems('wall')) drawWallItem(v, p, 0);
  for (const p of layerItems('floor')) drawFurniture(v, p, { t: 0 });
  for (const p of layerItems('ceiling')) drawPendant(v, p, 0, true);
  const items = layerItems('ground').map((p) => { const r = rectOf(p); return { key: r.x + r.w / 2 + r.y + r.h / 2, draw: () => drawFurniture(v, p, { back: FURN[p.id].kind === 'chair' ? chairBack(layout, p) : undefined, t: 0 }) }; });
  for (const a of opts.people || []) {
    items.push({ key: a.x + a.y + 1.01, draw: () => { const [fx, fy] = isoP(v, a.x + 0.5, a.y + 0.5); drawChar(ctx, fx, fy, (v.T / 52) * (a.s || 1), a.look, { t: 0.4, crown: a.crown, expr: a.expr || 'happy' }); } });
  }
  items.sort((a, b) => a.key - b.key).forEach((it) => it.draw());
  for (const p of layerItems('ceiling')) drawPendant(v, p, 0);
  if (opts.outside !== false) drawOutsideFront(v, 0, { terrace: opts.door !== false });
}

/** 상점·보관함 아이콘용 가구 미리보기 (아이소메트릭) */
function furniturePreview(id, w = 108, hh = 88) {
  const c = h('canvas', { width: w, height: hh });
  const ctx = c.getContext('2d');
  if (!ctx) return c;
  const d = FURN[id];
  if (d.surface) {
    // 벽지 · 바닥재 견본: 작은 방 모서리 (다른 쪽은 지금 쓰는 것)
    const n = 3;
    const iw = Math.min((w - 6) / n, (hh - 6) / (n / 2 + 0.75));
    const WH = iw * 0.75;
    const v = { ctx, iw, ih: iw / 2, ox: w / 2, oy: (hh - (n / 2) * iw - WH) / 2 + WH, cols: n, rows: n };
    const wallSt = d.surface === 'wall' ? d.style : surfaceStyle('wall');
    const floorSt = d.surface === 'floor' ? d.style : surfaceStyle('floor');
    paintFloorIso(v, floorSt, false);
    for (const side of ['left', 'right']) onWall(v, side, (G) => { paintWall(ctx, 0, -WH, n * G, WH, wallSt, G); ctx.strokeStyle = OUT; ctx.lineWidth = 1.2; ctx.strokeRect(0, -WH, n * G, WH); });
    isoPath(ctx, v, [[0, 0], [n, 0], [n, n], [0, n]]); ctx.strokeStyle = OUT; ctx.lineWidth = 1.2; ctx.stroke();
    return c;
  }
  const layer = layerOf(d);
  const fw = d.w, fd = layer === 'wall' ? 0.3 : d.h;
  const Hk = layer === 'wall' ? WALL_K : layer === 'ceiling' ? 1.8 : heightOf(d, 1);
  const iw = Math.min((w - 8) / ((fw + fd) / 2), (hh - 8) / ((fw + fd) / 4 + Hk));
  const v = { ctx, iw, ih: iw / 2, ox: w / 2 - ((fw - fd) * iw) / 4, oy: hh - 4 - ((fw + fd) * iw) / 4, T: iw * 0.62, cols: fw, rows: 1 };
  if (layer === 'wall') {
    onWall(v, 'right', (G) => { paintWall(ctx, 0, -iw * WALL_K, fw * G, iw * WALL_K, null, G); });
    drawWallItem(v, { id, x: 0, y: 0 }, 0);
  } else if (layer === 'ceiling') {
    drawPendant(v, { id, x: 0, y: 0 }, 0);
  } else {
    drawFurniture(v, { uid: 'pv' + id, id, x: 0, y: 0, rot: 0 }, { back: 'n', t: 0 });
  }
  return c;
}

/* =========================================================
 * 5. 메인 화면 — 렌더링 · 클릭/드래그 · 인테리어 편집 · HUD
 * ========================================================= */

const canvas = $('#game');
const ctx = canvas.getContext('2d');
const V = { ctx, T: 48, iw: 64, ih: 32, ox: 0, oy: 0, cols: 8, rows: 8, cw: 0, ch: 0, dpr: 1 };
const UI = {
  edit: false,
  placing: null, // 보관함에서 고른 가구 id
  placingRot: 0,
  selected: null, // 편집 중 고른 배치 가구 uid
  drag: null, // { uid, dx, dy, moved }
  hover: null, // 마우스가 있는 칸
  hits: [], // 캔버스 위 버튼 (대화하기)
  anim: 0,
};
const avatarLook = () => ({ ...S.avatar });

function resize() {
  const r = canvas.getBoundingClientRect();
  V.dpr = window.devicePixelRatio || 1;
  V.cw = r.width;
  V.ch = r.height;
  canvas.width = Math.round(r.width * V.dpr);
  canvas.height = Math.round(r.height * V.dpr);
}
function fitView() {
  const { cols, rows } = S.grid;
  // 위 HUD · 왼쪽 주문 열 · 왼쪽 정원 자리를 비우고 매장은 가운데~오른쪽에
  const narrow = V.cw < 720;
  Object.assign(V, isoFit(cols, rows, V.cw - (UI.edit || narrow ? 0 : 70), V.ch, UI.edit ? 118 : narrow ? 80 : 30, { top: narrow ? 110 : 56, left: UI.edit || narrow ? 0 : 118, garden: narrow ? 1.5 : 3 }));
}
/** 화면 좌표 → 바닥 칸 */
const tileAt = (px, py) => { const g = screenToIso(V, px, py); return { x: Math.floor(g.x), y: Math.floor(g.y) }; };
/** 사람의 발 위치 (화면) — 앉은 손님은 의자 높이 */
function feetOf(a) {
  const sitting = a.kind === 'customer' && (a.state === 'wait' || a.state === 'eat' || a.state === 'read');
  const [x, y] = isoP(V, a.x, a.y, sitting ? V.iw * 0.2 : 0);
  return { x, y };
}
/** 상태 → 표정 */
function exprFor(a) {
  if (a.kind === 'customer') {
    if (a.state === 'wait') {
      const r = a.patience / a.patienceMax;
      return a.candidate && !a.talked ? 'wave' : r > 0.72 ? 'order' : r < 0.3 ? 'worried' : 'idle';
    }
    if (a.state === 'eat') return 'eat';
    if (a.state === 'browse' || a.state === 'read') return a.reading ? 'focus' : 'idle';
    if (a.mood === 'angry') return 'angry';
    if (a.mood === 'happy') return 'happy';
    return 'idle';
  }
  if (a.busy > 0) return 'focus';
  if (a.kind === 'rep') return 'wave';
  return a.carry.length ? 'happy' : 'idle';
}

const BG = { key: '', base: null, front: null };
function backgroundCache() {
  const key = [V.cw, V.ch, V.dpr, V.iw.toFixed(2), V.cols, V.rows, JSON.stringify(surfaceStyle('floor')), UI.edit, sceneSeason(), S.floor].join('|');
  if (BG.key === key) return BG;
  const make = (draw) => {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(V.cw * V.dpr));
    c.height = Math.max(1, Math.round(V.ch * V.dpr));
    const cx = c.getContext('2d');
    if (cx) { cx.setTransform(V.dpr, 0, 0, V.dpr, 0, 0); draw({ ...V, ctx: cx }); }
    return c;
  };
  BG.base = make((v) => {
    const sky = v.ctx.createLinearGradient(0, 0, 0, V.ch);
    sky.addColorStop(0, '#d6ecf7'); sky.addColorStop(1, onFloor2() ? '#f3f8fc' : '#eaf5e0');
    v.ctx.fillStyle = sky; v.ctx.fillRect(0, 0, V.cw, V.ch);
    if (onFloor2()) drawUpstairsView(v);
    drawRoom(v, { part: 'base', editing: UI.edit, floor: surfaceStyle('floor'), t: 0, outside: !onFloor2() });
  });
  BG.front = make((v) => { if (!onFloor2()) drawOutsideFront(v, 0, { part: 'static' }); });
  BG.key = key;
  return BG;
}

function render() {
  fitView();
  const { T } = V;
  ctx.setTransform(V.dpr, 0, 0, V.dpr, 0, 0);
  const onLayer = (layer) => S.layout.filter((p) => layerOf(FURN[p.id]) === layer);
  const fade = (p, draw) => { const dragging = UI.drag && UI.drag.uid === p.uid && UI.drag.moved; if (dragging) ctx.globalAlpha = 0.35; draw(); ctx.globalAlpha = 1; };
  // 움직이지 않는 바깥 풍경·바닥은 한 번 그려 두고 재사용 (매 프레임 다시 그리지 않음)
  const bg = backgroundCache();
  ctx.drawImage(bg.base, 0, 0, V.cw, V.ch);
  drawRoom(V, { part: 'walls', snow: sceneSeason() === 'winter', stairs: onFloor2(), editing: UI.edit, sign: onFloor2() ? '📚 2F 독서 라운지' : `${S.nickname || '점장'}의 북카페`, t: UI.anim, wall: surfaceStyle('wall'), floor: surfaceStyle('floor'), windows: !onLayer('wall').length });
  // 벽에 건 것 → 러그 → 펜던트 빛
  for (const p of onLayer('wall')) fade(p, () => drawWallItem(V, p, UI.anim));
  for (const p of onLayer('floor')) fade(p, () => drawFurniture(V, p, { t: UI.anim }));
  for (const p of onLayer('ceiling')) drawPendant(V, p, UI.anim, true);

  // 문 위치 표시 (편집 중)
  if (UI.edit) {
    const d = door();
    isoPath(ctx, V, [[d.x, d.y], [d.x + 1, d.y], [d.x + 1, d.y + 1], [d.x, d.y + 1]]);
    ctx.fillStyle = 'rgba(224,96,122,.25)'; ctx.fill();
  }

  // 빈 접시: 의자 쪽 방향을 책상에 표시
  const dirtyByDesk = {};
  for (const uid of Object.keys(W.dirty)) {
    const seat = W.seats.find((s2) => s2.uid === uid);
    if (!seat) continue;
    const deskUid = W.occ[seat.table.y][seat.table.x];
    const side = seat.y < seat.table.y ? 'n' : seat.y > seat.table.y ? 's' : seat.x < seat.table.x ? 'w' : 'e';
    (dirtyByDesk[deskUid] ||= []).push(side);
  }

  // 깊이 순서(x + y)대로 가구 + 사람 — 아이소메트릭 Z-Index
  const items = [];
  for (const p of S.layout) {
    if (layerOf(FURN[p.id]) !== 'ground') continue;
    const r = rectOf(p);
    items.push({ key: r.x + r.w / 2 + r.y + r.h / 2, draw: () => fade(p, () =>
      drawFurniture(V, p, { back: FURN[p.id].kind === 'chair' ? chairBack(S.layout, p) : undefined, dirty: dirtyByDesk[p.uid], station: W.stations[p.uid], t: UI.anim })) });
  }
  const s = T / 52;
  const people = [W.player, ...W.staff, ...W.customers, W.rep].filter(Boolean);
  if (!UI.edit) {
    for (const a of people) {
      const sitting = a.kind === 'customer' && (a.state === 'wait' || a.state === 'eat' || a.state === 'read');
      items.push({ key: a.x + a.y + (sitting ? 0.02 : 0.01), draw: () => {
        const f = feetOf(a);
        drawChar(ctx, f.x, f.y, s, a.look, {
          t: UI.anim + a.id, walking: a.walking, sit: sitting, mood: a.mood, expr: exprFor(a), crown: a.kind === 'rep',
          carry: a.reading ? ['📖'] : a.carry.map((it) => MENU_BY_ID[it.menu].icon),
        });
        if (a.busy > 0) {
          ctx.font = `${T * 0.3}px Jua, sans-serif`; ctx.textAlign = 'center';
          ctx.fillText('🧽', f.x + T * 0.3, f.y - T * 0.9 - Math.sin(UI.anim * 10) * 3);
          ctx.textAlign = 'left';
        }
      } });
    }
  }
  items.sort((a, b) => a.key - b.key);
  for (const it of items) it.draw();
  // 천장 펜던트등 · 바깥 앞쪽(보도·가로등·테라스)
  for (const p of onLayer('ceiling')) fade(p, () => drawPendant(V, p, UI.anim));
  ctx.drawImage(bg.front, 0, 0, V.cw, V.ch);
  if (!onFloor2()) drawOutsideFront(V, UI.anim, { part: 'dynamic' });
  if (!UI.edit) drawWeather(ctx, V.cw, V.ch, UI.anim);

  // 머리 위: 이름표·주문 말풍선·제조 상태
  UI.hits = [];
  if (!UI.edit) {
    for (const p of S.layout) {
      const st = W.stations[p.uid];
      const ro = W.roast[p.uid];
      if (!st && !ro) continue;
      const b = furnitureBox(V, p);
      const cx = b.x + b.w / 2;
      if (ro) {
        // 로스터: 진행 막대 → 완료 배지
        if (ro.left > 0) drawProgress(ctx, cx, b.y - T * 0.08, T, '🫘', 1 - ro.left / ro.total);
        else drawStamp(ctx, cx, b.y - T * 0.12 - Math.abs(Math.sin(UI.anim * 4)) * T * 0.08, T, 'DONE ✓', '#9fd8b0');
        continue;
      }
      let y0 = b.y - T * 0.08;
      if (st.state === 'busy') { drawProgress(ctx, cx, y0, T, MENU_BY_ID[st.item].icon, 1 - st.left / st.total); y0 -= T * 0.36; }
      // 재고: 메뉴별 남은 잔 수
      const stock = Object.entries(st.stock || {});
      stock.forEach(([id, n], i) => drawStamp(ctx, cx, y0 - i * T * 0.34 - Math.abs(Math.sin(UI.anim * 3 + i)) * T * 0.04, T, `${MENU_BY_ID[id].icon} ×${n}`, '#fcefb4', 0));
      if (!stock.length && st.sold > 0) { ctx.globalAlpha = Math.min(1, st.sold * 2); drawStamp(ctx, cx, y0 - (1.6 - st.sold) * T * 0.25, T, 'SOLD', '#f3a9bb'); ctx.globalAlpha = 1; }
    }
    for (const a of people) {
      const f = feetOf(a);
      const top = f.y - T * 1.35;
      if (a.kind === 'player') drawTag(ctx, f.x, top - T * 0.28, T, `${myBadge()?.icon || '⭐'} ${S.nickname || '점장'}`, '#fcefb4');
      if (a.kind === 'staff') drawTag(ctx, f.x, top + T * 0.05, T, `알바 ${a.name}`, '#d3efd6');
      if (a.kind === 'rep') drawTag(ctx, f.x, top + T * 0.05, T, `👑 ${a.name}`, '#e3daf5');
      if (a.kind !== 'customer') continue;
      if (a.regularId) {
        const reg = REGULAR_BY_ID[a.regularId];
        const hits = a.candidate ? Math.min(COURT_NEED, (S.courtship[reg.id] || { hits: 0 }).hits) : 0;
        drawTag(ctx, f.x, f.y + T * 0.32, T, a.candidate ? `✨ ${reg.name} ${'♥'.repeat(hits)}${'♡'.repeat(COURT_NEED - hits)}` : `♥ ${reg.name}`, a.candidate ? '#fcefb4' : '#f9d3dc');
      }
      if (a.state === 'wait') {
        const m = MENU_BY_ID[a.order];
        drawBubble(ctx, f.x, top + T * 0.1 + Math.sin(UI.anim * 3 + a.id) * T * 0.06, T, m.icon, a.patience / a.patienceMax, m.name);
        // 단골 후보: 대화하기 버튼
        if (a.candidate && !a.talked) {
          const bw = T * 1.2, bh = T * 0.36;
          const bx = f.x - bw / 2, by = top - T * 1.0 + Math.sin(UI.anim * 3 + a.id + 1) * T * 0.05;
          const pulse = 1 + Math.sin(UI.anim * 5) * 0.04;
          ctx.save();
          ctx.translate(f.x, by + bh / 2); ctx.scale(pulse, pulse); ctx.translate(-f.x, -(by + bh / 2));
          rr(ctx, bx, by, bw, bh, bh / 2); fillStroke(ctx, '#e3daf5', Math.max(1.4, T / 30));
          ctx.fillStyle = OUT; ctx.font = `900 ${Math.max(9, T * 0.18)}px Jua, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText('💬 대화하기', f.x, by + bh / 2);
          ctx.restore();
          UI.hits.push({ x: bx, y: by, w: bw, h: bh, fn: () => openTalk(a) });
        }
      } else if (a.state === 'eat') {
        ctx.font = `${T * 0.26}px Jua, sans-serif`; ctx.textAlign = 'center';
        ctx.fillText(a.regularId && !a.candidate ? '💕' : '😋', f.x, top + T * 0.05);
        ctx.textAlign = 'left';
      }
    }
    // 말풍선 (대사)
    for (const a of people) {
      if (!a.say) continue;
      const f = feetOf(a);
      const above = a.kind === 'customer' && a.state === 'wait' ? T * 2.0 : a.kind === 'customer' ? T * 1.4 : a.kind === 'player' ? T * 2.0 : T * 1.6;
      const k = a.say.max - a.say.t;
      ctx.globalAlpha = Math.min(1, k * 5, a.say.t * 3);
      drawSpeech(ctx, f.x, f.y - above - Math.min(1, k * 6) * T * 0.04, T, a.say.text);
      ctx.globalAlpha = 1;
    }
    // 픽셀 하트·별 파티클
    for (const q of W.particles) {
      const [px0, py0] = isoP(V, q.gx, q.gy, T * q.z);
      ctx.globalAlpha = Math.min(1, 2 * (1 - q.t / q.life));
      drawPixelSprite(ctx, px0 + q.x, py0 + q.y, q.kind, q.color, Math.max(1.5, T * 0.035 * q.size));
      ctx.globalAlpha = 1;
    }
    // 떠오르는 글자 (코인 등)
    for (const p of W.popups) {
      ctx.globalAlpha = 1 - p.t / 1.6;
      ctx.font = `900 ${Math.max(11, T * 0.22)}px Jua, sans-serif`; ctx.textAlign = 'center';
      ctx.lineWidth = 3; ctx.strokeStyle = '#fffaf3';
      const [px, py0] = isoP(V, p.x, p.y, T * (1.5 + (p.dz || 0)));
      const py = py0 - p.t * T * 0.5;
      ctx.strokeText(p.text, px, py); ctx.fillStyle = p.color; ctx.fillText(p.text, px, py);
      ctx.globalAlpha = 1; ctx.textAlign = 'left';
    }
  }

  // 편집: 선택 표시 · 놓을 자리 미리보기 (초록 = 가능, 빨강 = 불가)
  if (UI.edit) {
    if (UI.selected && !(UI.drag && UI.drag.moved)) {
      const p = S.layout.find((q) => q.uid === UI.selected);
      ctx.setLineDash([6, 4]); ctx.lineWidth = 3; ctx.strokeStyle = '#6fa8dc';
      if (p && (layerOf(FURN[p.id]) === 'wall' || layerOf(FURN[p.id]) === 'ceiling')) {
        const b = furnitureBox(V, p);
        ctx.strokeRect(b.x, b.y, b.w, b.h);
      } else if (p) {
        const r = rectOf(p);
        isoPath(ctx, V, [[r.x, r.y], [r.x + r.w, r.y], [r.x + r.w, r.y + r.h], [r.x, r.y + r.h]]); ctx.stroke();
      }
      ctx.setLineDash([]);
    }
    const ghost = ghostPlacement();
    if (ghost) {
      const d = FURN[ghost.id];
      const gp = { uid: 'ghost', id: ghost.id, x: ghost.x, y: ghost.y, rot: ghost.rot };
      ctx.fillStyle = ghost.ok ? 'rgba(111,179,136,.45)' : 'rgba(224,96,122,.45)';
      if (layerOf(d) === 'wall') {
        onWall(V, 'right', (G) => ctx.fillRect(ghost.x * G, -V.iw * WALL_K, d.w * G, V.iw * WALL_K));
        ctx.globalAlpha = 0.75; drawWallItem(V, gp, UI.anim);
      } else {
        const w = ghost.rot ? d.h : d.w, hh = ghost.rot ? d.w : d.h;
        isoPath(ctx, V, [[ghost.x, ghost.y], [ghost.x + w, ghost.y], [ghost.x + w, ghost.y + hh], [ghost.x, ghost.y + hh]]); ctx.fill();
        ctx.globalAlpha = 0.72;
        if (layerOf(d) === 'ceiling') drawPendant(V, gp, UI.anim); else drawFurniture(V, gp, { back: 'n', t: UI.anim });
      }
      ctx.globalAlpha = 1;
    }
  }
}

/* ── 편집 모드 ── */
function ghostPlacement() {
  if (!UI.hover) return null;
  if (UI.placing) {
    const y = layerOf(FURN[UI.placing]) === 'wall' ? 0 : UI.hover.y;
    return { id: UI.placing, x: UI.hover.x, y, rot: UI.placingRot, ok: !canPlace(UI.placing, UI.hover.x, y, UI.placingRot) };
  }
  if (UI.drag && UI.drag.moved) {
    const p = S.layout.find((q) => q.uid === UI.drag.uid);
    if (!p) return null;
    const wall = layerOf(FURN[p.id]) === 'wall';
    const x = UI.hover.x - UI.drag.dx, y = wall ? 0 : UI.hover.y - UI.drag.dy;
    return { id: p.id, x, y, rot: p.rot, ok: !canPlace(p.id, x, y, p.rot, p.uid) };
  }
  return null;
}

/** 벽지·바닥재 바르기 (원래 것은 보관함으로) */
function applySurface(id) {
  const kind = FURN[id].surface;
  const prev = S.surface[kind];
  S.surface[kind] = id;
  if (S.surfaceColor) S.surfaceColor[kind] = null; // 새 무늬는 원래 색으로
  S.inventory[id] -= 1;
  if (S.inventory[id] <= 0) delete S.inventory[id];
  if (prev) S.inventory[prev] = (S.inventory[prev] || 0) + 1;
  toast(`🧱 ${josa(FURN[id].name, '을', '를')} 발랐어요`);
  renderInventory();
  saveState();
}
const refundOf = (def) => (def.gold ? { gold: Math.max(1, Math.floor(def.gold / 2)) } : { coin: Math.floor((def.coin || 0) / 2) });
/** 판매: 보관함에서 고른 것 또는 배치한 가구 — 산 값의 절반 환급 */
function sellSelected() {
  const placed = S.layout.find((q) => q.uid === UI.selected);
  const id = UI.placing || placed?.id;
  if (!id) return toast('판매할 가구를 먼저 고르세요');
  const def = FURN[id];
  if (def.guild) return toast('클럽 보상 가구는 팔 수 없어요');
  const refund = refundOf(def);
  if (!confirm(`${josa(def.name, '을', '를')} 팔까요? ${costText(refund)} 환급`)) return;
  if (placed && !UI.placing) {
    S.layout = S.layout.filter((q) => q !== placed);
    delete W.stations[placed.uid];
    UI.selected = null;
    rebuildWorld();
  } else {
    S.inventory[id] -= 1;
    if (S.inventory[id] <= 0) { delete S.inventory[id]; UI.placing = null; }
  }
  S.coins += refund.coin || 0;
  S.gold += refund.gold || 0;
  toast(`💰 ${def.name} 판매 (+${costText(refund)})`);
  renderInventory();
  saveState();
}

function placeFromInventory(x, y) {
  const id = UI.placing;
  if (layerOf(FURN[id]) === 'wall') y = 0;
  const err = canPlace(id, x, y, UI.placingRot);
  if (err) return toast(err);
  S.layout.push({ uid: 'u' + S.nextUid++, id, x, y, rot: layerOf(FURN[id]) === 'wall' ? 0 : UI.placingRot });
  S.inventory[id] -= 1;
  if (S.inventory[id] <= 0) { delete S.inventory[id]; UI.placing = null; }
  rebuildWorld();
  renderInventory();
  saveState();
}
function rotateSelected() {
  if (UI.placing) { UI.placingRot = UI.placingRot ? 0 : 1; return; }
  const p = S.layout.find((q) => q.uid === UI.selected);
  if (!p) return toast('회전할 가구를 먼저 고르세요');
  if (layerOf(FURN[p.id]) === 'wall') return toast('벽에 건 가구는 돌릴 수 없어요');
  const err = canPlace(p.id, p.x, p.y, p.rot ? 0 : 1, p.uid);
  if (err) return toast(err);
  p.rot = p.rot ? 0 : 1;
  rebuildWorld();
  saveState();
}
function storeSelected() {
  const i = S.layout.findIndex((q) => q.uid === UI.selected);
  if (i < 0) return toast('보관할 가구를 먼저 고르세요');
  const [p] = S.layout.splice(i, 1);
  S.inventory[p.id] = (S.inventory[p.id] || 0) + 1;
  UI.selected = null;
  delete W.stations[p.uid];
  rebuildWorld();
  renderInventory();
  saveState();
}
// 배치·이동·회전할 때마다 점수 줄도 갱신
setInterval(() => UI.edit && renderDecoLine(), 500);

/* ── 포인터 ── */
function pointerPos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function furnitureAtPoint(px, py) {
  // 앞쪽(아래쪽)에 있는 가구부터
  // 천장 → 바닥 가구(앞쪽부터) → 벽 순서로 (그려진 순서의 반대)
  const order = { ceiling: 2, ground: 1, wall: 0 };
  const list = S.layout.filter((p) => !FURN[p.id].floor)
    .sort((a, b) => order[layerOf(FURN[b.id])] - order[layerOf(FURN[a.id])] || rectOf(b).y + rectOf(b).h - (rectOf(a).y + rectOf(a).h));
  const hit = list.find((p) => {
    const b = furnitureBox(V, p);
    return px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h;
  });
  if (hit) return hit;
  const t = tileAt(px, py);
  return S.layout.find((p) => { const r = rectOf(p); return t.x >= r.x && t.x < r.x + r.w && t.y >= r.y && t.y < r.y + r.h; });
}
function customerAtPoint(px, py) {
  const T = V.T;
  return [...W.customers].reverse().find((c) => {
    if (c.state === 'out') return false;
    const f = feetOf(c);
    return px >= f.x - T * 0.4 && px <= f.x + T * 0.4 && py >= f.y - T * 1.3 && py <= f.y + T * 0.1;
  });
}

canvas.addEventListener('pointerdown', (e) => {
  if (!S.onboarded) return;
  const { x, y } = pointerPos(e);
  if (UI.edit) {
    const t = tileAt(x, y);
    if (UI.placing) return placeFromInventory(t.x, t.y);
    const p = furnitureAtPoint(x, y) || S.layout.find((q) => { const r = rectOf(q); return t.x >= r.x && t.x < r.x + r.w && t.y >= r.y && t.y < r.y + r.h; });
    UI.selected = p ? p.uid : null;
    if (p) UI.drag = { uid: p.uid, dx: t.x - p.x, dy: t.y - p.y, moved: false, sx: x, sy: y };
    canvas.setPointerCapture?.(e.pointerId);
    return;
  }
  // 영업 중
  const btn = UI.hits.find((b) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h);
  if (btn) return btn.fn();
  handlePlayClick(x, y);
});
canvas.addEventListener('pointermove', (e) => {
  const { x, y } = pointerPos(e);
  UI.hover = tileAt(x, y);
  if (UI.drag && !UI.drag.moved && Math.hypot(x - UI.drag.sx, y - UI.drag.sy) > 6) UI.drag.moved = true;
});
canvas.addEventListener('pointerup', () => {
  if (UI.drag && UI.drag.moved) {
    const g = ghostPlacement();
    const p = S.layout.find((q) => q.uid === UI.drag.uid);
    if (g && p) {
      if (g.ok) { p.x = g.x; p.y = g.y; rebuildWorld(); saveState(); }
      else toast(canPlace(p.id, g.x, g.y, p.rot, p.uid));
    }
  }
  UI.drag = null;
});
canvas.addEventListener('pointerleave', () => { if (!UI.drag) UI.hover = null; });

function handlePlayClick(px, py) {
  const pl = W.player;
  // 1) 손님
  const c = customerAtPoint(px, py);
  if (c) {
    if (c.state === 'wait') {
      if (pl.carry.some((it) => it.menu === c.order)) {
        if (!assign(pl, { type: 'serve', cid: c.id })) toast('그 손님에게 갈 수 없어요');
      } else {
        toast(`${MENU_BY_ID[c.order].icon} ${MENU_BY_ID[c.order].name} 주문 — ${STATION_NAME[MENU_BY_ID[c.order].station]}에서 만들어요`);
      }
    } else if (c.state === 'eat') toast('맛있게 먹는 중이에요 😋');
    else if (c.state === 'browse' || c.state === 'read') toast('📖 책 읽는 중인 손님이에요');
    return;
  }
  // 2) 가구
  const p = furnitureAtPoint(px, py);
  if (p) {
    const kind = FURN[p.id].kind;
    if (STATION_NAME[kind]) {
      const st = W.stations[p.uid];
      // 비어 있고 만들 주문도 없으면 → 미리 만들 메뉴 고르기
      if (st && st.state === 'idle' && !uncoveredFor(kind).length && !stockOf(st)) return openPremake(p);
      if (!assign(pl, { type: 'station', uid: p.uid })) toast('거기까지 갈 수 없어요');
      return;
    }
    if (kind === 'roaster') {
      const r = W.roast[p.uid];
      if (r && r.left > 0) toast(`🫘 원두 로스팅 중… ${Math.ceil(r.left)}초 남음`);
      else if (!assign(pl, { type: 'roast', uid: p.uid })) toast('거기까지 갈 수 없어요');
      return;
    }
    // 빈 접시: 의자 또는 그 책상
    let dirtyUid = W.dirty[p.uid] ? p.uid : null;
    if (!dirtyUid && kind === 'desk') {
      const r = rectOf(p);
      dirtyUid = Object.keys(W.dirty).find((uid) => {
        const s = W.seats.find((q) => q.uid === uid);
        return s && s.table.x >= r.x && s.table.x < r.x + r.w && s.table.y >= r.y && s.table.y < r.y + r.h;
      });
    }
    if (dirtyUid) {
      if (!assign(pl, { type: 'clean', uid: dirtyUid })) toast('거기까지 갈 수 없어요');
      return;
    }
  }
  // 3) 바닥으로 걷기
  const t = tileAt(px, py);
  if (walkable(t.x, t.y)) {
    pl.task = null;
    setPath(pl, findPath({ x: pl.x, y: pl.y }, (x, y) => x === t.x && y === t.y) || []);
  }
}

window.addEventListener('keydown', (e) => {
  if (e.target instanceof HTMLInputElement || e.target instanceof HTMLTextAreaElement) return;
  if (e.key === 'Escape') {
    if (modals.length) closeTopModal();
    else if (UI.edit) { UI.placing = null; UI.selected = null; renderInventory(); }
  }
  if (!UI.edit) return;
  if (e.key === 'r' || e.key === 'R') rotateSelected();
  if (e.key === 'Delete' || e.key === 'Backspace') storeSelected();
});

/* ── 왼쪽 세로 열: 손님 주문·알림 배지 (동물 얼굴 + 작은 말풍선) ── */
const questEls = new Map();
function questEl(key, face, onClick) {
  let el = questEls.get(key);
  if (!el) {
    const pic = typeof face === 'string' ? h('div', { class: 'emo' }, face) : h('canvas', { width: 116, height: 116 });
    if (typeof face !== 'string') drawPortrait(pic, face);
    el = h('div', { class: 'quest' }, h('div', { class: 'ring' }, pic), h('div', { class: 'mini' }));
    questEls.set(key, el);
  }
  el.onclick = onClick || null;
  el.classList.toggle('clickable', Boolean(onClick));
  return el;
}
function renderQuests() {
  const box = $('#orders');
  if (UI.edit || !S.onboarded) { if (box.childElementCount) box.replaceChildren(); questEls.clear(); return; }
  ensureQuests();
  const Q = S.quests;
  const list = [];
  // 머리: 오늘 진행도 (누르면 전체 목록)
  const done = Q.list.filter((q) => q.claimed).length;
  const head = questEl('head', '📜', openQuests);
  head.className = 'quest note clickable qhead';
  head.title = '퀘스트 목록';
  if (!head.querySelector('.qlabel')) head.append(h('span', { class: 'qlabel' }), h('i', { class: 'newb' }, 'NEW'));
  head.querySelector('.qlabel').textContent = `퀘스트 ${done}/${Q.list.length}`;
  head.querySelector('.newb').hidden = !Q.list.some((q) => !q.claimed && q.prog >= q.target) && !(Q.list.every((q) => q.claimed) && !Q.bonus);
  list.push(head);
  // 받을 수 있는 것 먼저, 그다음 진행 중인 것 — 3개까지
  const open = Q.list.filter((q) => !q.claimed).sort((a, b) => (b.prog >= b.target) - (a.prog >= a.target));
  for (const q of open.slice(0, QUEST_SLOTS)) {
    const ready = q.prog >= q.target;
    const el = questEl('q' + q.id, lookFromSeed(q.giver), ready ? () => claimQuest(q) : openQuests);
    el.className = `quest clickable ${ready ? 'qready' : ''}`;
    el.style.setProperty('--p', (q.prog / q.target).toFixed(3));
    el.title = `${questText(q)} (${q.prog}/${q.target}) · EXP +${q.xp}${ready ? ' — 눌러서 보상 받기!' : ''}`;
    const mini = ready ? `${questIcon(q)}<b class="get">EXP +${q.xp}</b>` : `${questIcon(q)}<small>${q.prog}/${q.target}</small>`;
    if (el.lastChild.innerHTML !== mini) el.lastChild.innerHTML = mini;
    list.push(el);
  }
  if (!open.length && !Q.bonus) {
    const el = questEl('bonus', '🎁', claimQuestBonus);
    el.className = 'quest note clickable qready';
    el.title = `올클리어 보너스: EXP +${Q.bonusXp} · 금 +2`;
    const mini = `<b class="get">EXP +${Q.bonusXp}</b>`;
    if (el.lastChild.innerHTML !== mini) el.lastChild.innerHTML = mini;
    list.push(el);
  }
  const keep = new Set(list);
  for (const [k, el] of questEls) if (!keep.has(el)) { el.remove(); questEls.delete(k); }
  list.forEach((el, i) => { if (box.children[i] !== el) box.insertBefore(el, box.children[i] || null); });
}

let hudAvatarKey = '';
function refreshHud() {
  const mb = myBadge();
  const nameKey = `${S.nickname}|${mb ? mb.id : ''}`;
  if ($('#hudName').dataset.key !== nameKey) {
    $('#hudName').dataset.key = nameKey;

  }

  // 이벤트 타이머: 주간 인기투표 마감까지
  const left = Math.max(0, weekEnd() - Date.now());
  const dd = Math.floor(left / 864e5), hh = Math.floor((left % 864e5) / 36e5), mm = Math.floor((left % 36e5) / 6e4), ss = Math.floor((left % 6e4) / 1e3);
  const leftText = dd ? `${dd}일 남음` : hh ? `${hh}시간 남음` : `${mm}분 ${pad2(ss)}초`;
  $('#hudTimer').textContent = leftText;
  $('#evVoteT').textContent = leftText;
  // ⑨ 일일 퀘스트: 자정까지
  const mid = new Date(); mid.setHours(24, 0, 0, 0);
  const ql = mid - Date.now();
  $('#evQuestT').textContent = ql > 36e5 ? `${Math.floor(ql / 36e5)}시간 남음` : `${Math.floor(ql / 6e4)}분 남음`;
  const claimable = S.quests && S.quests.list ? S.quests.list.filter((q) => !q.claimed && q.prog >= q.target).length : 0;
  $('#evQuest').classList.toggle('glow', claimable > 0);
  $('#evGuild').hidden = !S.guild;
  $('#evGuildT').textContent = leftText;
  const nx = EXPANSIONS[S.expansions];

  renderQuests();
  // 메뉴 알림 점
  const dot = (act, n) => {
    const b = document.querySelector(`#menu button[data-act="${act}"]`);

  dot('vote', S.vote.used < VOTES_PER_WEEK ? VOTES_PER_WEEK - S.vote.used : 0);
  dot('friends', S.friends.filter((f) => f.status === 'received').length);
  const nextExp = EXPANSIONS[S.expansions];
  dot('edit', nextExp && S.level >= nextExp.level ? '!' : 0);
  dot('people', STAFF_SLOTS.filter((s, i) => S.level >= s.level && !S.staff.some((x) => x.slot === i)).length);
  dot('dex', unlearnedMenus().length + S.badgeNew.length);
  // 층 이동 버튼 (Lv.50부터)
  const fb = $('#btnFloor');
  const f2 = fb.querySelector('.f2'), f1 = fb.querySelector('.f1');
  const locked = S.level < FLOOR2_LEVEL;
  f2.textContent = locked ? `🔒Lv.${FLOOR2_LEVEL}` : '2F';
  f2.className = 'f2' + (onFloor2() ? ' on' : '') + (locked ? ' lock' : '');
  f1.className = 'f1' + (onFloor2() ? '' : ' on');
  growFloor2();
  const otherWait = hasFloor(otherFloor()) ? withFloor(otherFloor(), () => W.customers.filter((c) => c.state === 'wait' || c.state === 'read').length) : 0;
  fb.title = `${onFloor2() ? '1층' : '2층'}으로 이동 — 그 층 손님 ${otherWait}명`;
  dot('floor', otherWait);

  $('.menu-big .new').hidden = !$('#menuSheet .dot');

    $('#hint').textContent = onFloor2() ? '🪜 2층 라운지: 의자·테이블·책장을 놓으면 손님이 앉아 책을 읽고 이용료를 내요 (1층도 동시에 영업 중 — 알바가 있으면 든든해요)'
      : !unlearnedMenus().length || availableMenu().length
      ? '손님 주문 → 커피머신/음료 바/쇼케이스 클릭 → 완성품 클릭해서 들기 → 손님 클릭해서 제공 → 빈 접시 치우기'
      : '📚 아직 배운 레시피가 없어요 — 📖 도감·메뉴판에서 레시피를 배워 주세요';
  }

/* =========================================================
 * 6. 모달 UI — 온보딩·상점·확장·아바타·알바·도감·대화·친구·클럽·투표·메뉴판
 * ========================================================= */

const modals = [];
function openModal({ title, body, foot, wide, closable = true, onClose }) {
  const overlay = h('div', { class: 'overlay' });
  const bodyEl = h('div', { class: 'body' }, body);
  const footEl = foot ? h('div', { class: 'foot' }, foot) : null;
  const m = h('div', { class: 'modal' + (wide ? ' wide' : '') },
    h('header', null, h('h2', null, title), closable ? h('button', { class: 'x', onclick: () => closeModal(entry), 'aria-label': '닫기' }, '✕') : null),
    bodyEl, footEl);
  overlay.append(m);
  const entry = { overlay, onClose, closable };
  if (closable) overlay.addEventListener('pointerdown', (e) => { if (e.target === overlay) closeModal(entry); });
  $('#modalRoot').append(overlay);
  modals.push(entry);
  return {
    body: bodyEl,
    set(node) { bodyEl.innerHTML = ''; bodyEl.append(node); },
    setFoot(nodes) { if (footEl) { footEl.innerHTML = ''; footEl.append(...nodes); } },
    close: () => closeModal(entry),
  };
}
function closeModal(entry) {
  const i = modals.indexOf(entry);
  if (i < 0) return;
  modals.splice(i, 1);
  entry.overlay.remove();
  entry.onClose && entry.onClose();
  saveState();
  refreshHud();
}
function closeTopModal() {
  const e = modals[modals.length - 1];
  if (e && e.closable) closeModal(e);
}
/** draw() 가 돌려주는 내용을 다시 그릴 수 있는 모달 */
function openPanel(title, draw, opts = {}) {
  const md = openModal({ title, body: h('div'), ...opts });
  const redraw = () => { const top = md.body.scrollTop; md.set(draw(redraw, md)); md.body.scrollTop = top; refreshHud(); };
  redraw();
  return md;
}
const tabs = (list, cur, onPick) =>
  h('div', { class: 'tabs' }, list.map(([id, label]) => h('button', { class: id === cur ? 'on' : '', onclick: () => onPick(id) }, label)));

/* ── 아바타 꾸미기 (온보딩 2단계 · 아바타 수정 공용) ── */
const AVATAR_TABS = [['face', '😊 얼굴'], ['hair', '💇 헤어'], ['outfit', '👕 의상'], ['hat', '🎩 모자']];
function avatarEditor(av) {
  Object.assign(av, migrateAvatar(av));
  const preview = h('canvas', { width: 220, height: 260, style: 'width:150px;height:177px;background:#e3daf5;border:3px solid #5a3d2b;border-radius:14px' });
  const panel = h('div', { class: 'stack', style: 'flex:1;min-width:240px' });
  let tab = 'face';
  /** 선택지 미리보기 칸: 얼굴만 크게 / 전신 */
  const thumb = (patch, mode, label, on, pick) => {
    const c = h('canvas', { width: 104, height: 104 });
    const ctx = c.getContext('2d');
    if (ctx) {
      const look = { ...av, ...patch };
      if (mode === 'face') { ctx.save(); ctx.translate(52, 58); ctx.scale(1.9, 1.9); ctx.translate(0, 50); drawChar(ctx, 0, 0, 1, look, { t: 0 }); ctx.restore(); }
      else if (mode === 'hat') { ctx.save(); ctx.translate(52, 64); ctx.scale(1.45, 1.45); ctx.translate(0, 50); drawChar(ctx, 0, 0, 1, look, { t: 0 }); ctx.restore(); }
      else drawChar(ctx, 52, 101, 1.22, look, { t: 0 });
    }
    return h('button', { class: 'opt thumb' + (on ? ' on' : ''), title: label, onclick: pick }, c, h('span', null, label));
  };
  const row = (title, ...kids) => h('div', null, h('div', { style: 'font-weight:900;font-size:13px;margin-bottom:4px' }, title), ...kids);
  const set = (k, v) => () => { av[k] = v; draw(); };
  const draw = () => {
    panel.innerHTML = '';
    panel.append(tabs(AVATAR_TABS, tab, (id) => { tab = id; draw(); }));
    if (tab === 'face') {
      panel.append(
        row('성별', h('div', { class: 'opts' }, [['m', '남자'], ['f', '여자']].map(([v, l]) => h('button', { class: 'opt' + (av.gender === v ? ' on' : ''), onclick: () => { av.gender = v; Object.assign(av, migrateAvatar(av)); draw(); } }, l)))),
        row('피부색', h('div', { class: 'swatches' }, SKIN_TONES.map(([v, l]) => h('button', { class: 'swatch' + (av.skin === v ? ' on' : ''), title: l, style: `background:${v}`, onclick: set('skin', v) })))),
        row('눈', h('div', { class: 'thumbs' }, EYE_TYPES.map(([v, l]) => thumb({ eyes: v, hat: 'none' }, 'face', l, av.eyes === v, set('eyes', v))))),
        row('입', h('div', { class: 'thumbs' }, MOUTH_TYPES.map(([v, l]) => thumb({ mouth: v, hat: 'none' }, 'face', l, av.mouth === v, set('mouth', v))))));
    } else if (tab === 'hair') {
      panel.append(
        row('머리색', h('div', { class: 'swatches' }, HAIR_COLORS.map(([v, l]) => h('button', { class: 'swatch' + (av.hairColor === v ? ' on' : ''), title: l, style: `background:${v}`, onclick: set('hairColor', v) })))),
        row(av.gender === 'm' ? '남자 헤어' : '여자 헤어', h('div', { class: 'thumbs' }, HAIRSTYLES[av.gender].map(([v, l]) => thumb({ hairStyle: v, hat: 'none' }, 'face', l, av.hairStyle === v, set('hairStyle', v))))));
    } else if (tab === 'outfit') {
      panel.append(row('의상', h('div', { class: 'thumbs' }, OUTFITS.map((of) => thumb({ outfit: of.id, hat: 'none' }, 'body', of.name, av.outfit === of.id, set('outfit', of.id))))));
    } else {
      panel.append(row('모자', h('div', { class: 'thumbs' }, HATS.map(([v, l]) => thumb({ hat: v }, 'hat', l, av.hat === v, set('hat', v))))));
    }
  };
  draw();
  // 미리보기는 살짝 움직인다 (모달이 닫히면 멈춤)
  let t = 0;
  const loop = () => {
    if (!preview.isConnected && t > 0.5) return;
    t += 1 / 60;
    const c2 = preview.getContext('2d');
    if (c2) {
      c2.clearRect(0, 0, 220, 260);
      c2.fillStyle = '#f9d3dc'; c2.fillRect(0, 210, 220, 50);
      drawChar(c2, 110, 236, 2.05, { ...av }, { t, walking: Math.floor(t / 3) % 2 === 1, expr: Math.floor(t / 3) % 4 === 2 ? 'wave' : undefined });
    }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
  return h('div', { class: 'row', style: 'align-items:flex-start;gap:14px;flex-wrap:wrap' }, h('div', { class: 'center' }, preview, h('div', { class: 'muted' }, '미리보기')), panel);
}

function startOnboarding() {
  const draft = { nickname: S.nickname || '', avatar: { ...S.avatar } };

      title: '☕ 북카페 오픈 준비 (1/2)',
      closable: false,
      body: h('div', { class: 'stack' },

        input),
      foot: [h('button', { class: 'btn mint', onclick: () => next() }, '다음 ▶')],

      title: '👤 내 아바타 만들기 (2/2)',

        h('button', { class: 'btn mint', onclick: () => { md.close(); finish(); } }, '오픈하기 🎉'),
      ],
    });
  };
  const finish = () => {
    S.nickname = draft.nickname;
    S.avatar = draft.avatar;
    W.player.look = avatarLook();
    const md = openModal({
      title: '🎁 신규 점장 오픈 축하 선물',
      closable: false,
      body: h('div', { class: 'stack center' },
        h('div', null, h('span', { class: 'gift' }, '🎁')),
        h('p', { style: 'margin:0;font-size:16px;font-weight:800' }, `${S.nickname} 점장님, 오픈을 축하해요!`),
        h('div', { class: 'row', style: 'justify-content:center;font-size:18px;font-weight:900' },
          h('span', { class: 'cur' }, h('i', { class: 'ico gold' }), '금 50개'),
          h('span', { class: 'cur' }, h('i', { class: 'ico coin' }), '3,000 코인')),
        h('p', { class: 'muted', style: 'margin:0' }, '코인은 기본 가구·알바·확장에, 금은 고급·특별 가구에 써요.')),
      foot: [h('button', { class: 'btn pink', onclick: () => {
        S.gold += 50;
        S.coins += 3000;
        S.onboarded = true;
        md.close();
        toast('금 50개 + 3,000 코인을 받았어요!', true);
        saveState();
        // 첫 메뉴 두 가지는 선배에게 배우고 시작
        startTraining(MENU.filter((x) => x.level === 1 && !x.season).map((x) => x.id));
      } }, '선물 받기')],
    });
  };
  step1();
}

function openSurfaceColors(kind = 'wall') {

/* ── 단골손님 대화 (책 추천 미니게임) ──
 * 손님이 읽고 싶은 책의 줄거리나 느낀 점을 말하면, 점장이 맞는 책을 골라 준다.
 * 서로 다른 책으로 3번 맞히면 단골 등록. 틀려도 진행도는 그대로.
 */
function openTalk(c) {
  const reg = REGULAR_BY_ID[c.regularId];
  const ct = courtOf(reg.id);
  if (!c.options) {
    // 이번 방문에 찾는 책: 처음엔 대표 책, 그다음은 같은 장르에서 아직 안 맞힌 책
    const left = BOOKS_BY_GENRE[reg.pref].filter((t) => !ct.books.includes(t));
    c.want = !ct.books.includes(reg.answer) ? reg.answer : pick(left.length ? left : BOOKS_BY_GENRE[reg.pref]);
    c.clue = ct.hits % 2 === 0 ? 'plot' : 'feel'; // 줄거리 ↔ 느낀 점 번갈아
    const same = shuffle(BOOKS_BY_GENRE[reg.pref].filter((t) => t !== c.want)).slice(0, 1);
    const others = shuffle(BOOKS.filter((bk) => bk.genre !== reg.pref)).slice(0, 2).map((bk) => bk.title);
    c.options = shuffle([c.want, ...same, ...others]);
    c.removed = [];
    c.guildHint = null;
  }
  const [plot, feel] = BOOK_TALK[c.want];
  const clueLine = c.clue === 'plot'
    ? `요즘 읽고 싶은 책이 있는데 제목이 생각이 안 나요… ${plot}`
    : `예전에 읽고 정말 좋았던 책이 있어요. ${feel} 그 책을 다시 읽고 싶어요!`;
  let result = null;
  const hearts = () => h('div', { class: 'row', style: 'gap:4px;justify-content:center' },
    Array.from({ length: COURT_NEED }, (_, i) => h('span', { style: `font-size:22px;${i < ct.hits ? '' : 'filter:grayscale(1);opacity:.35'}` }, '💗')),
    h('span', { class: 'muted', style: 'margin-left:6px' }, S.regulars[reg.id] ? '단골 등록 완료!' : `단골까지 ${Math.max(0, COURT_NEED - ct.hits)}번`));
  openPanel(`💬 ${reg.name}님과 대화하기`, (redraw) => {
    ensureDaily();
    const line = result === 'ok'
      ? (S.regulars[reg.id] ? `「${c.want}」! 이 책 추천이 딱 제 취향이에요. 점장님 추천이라면 믿고 읽을래요. 앞으로 자주 올게요! 💕` : `맞아요, 바로 「${c.want}」! 이 책 추천이 딱 제 취향이에요. 다음에 또 추천받으러 올게요 ☺`)
      : result === 'fail' ? `음… 「${c.picked}」는 제가 찾던 책이 아니에요. 다음에 또 올게요.` : clueLine;
    return h('div', { class: 'stack' },
      h('div', { class: 'row', style: 'align-items:flex-start;flex-wrap:nowrap' },
        h('div', { class: 'center' }, portraitEl(regularLook(reg), 72, '#fcefb4'), h('div', { style: 'font-weight:900' }, reg.name), h('div', { class: 'muted' }, `${SPECIES[reg.species].icon} ${SPECIES[reg.species].name}`), h('div', { class: 'muted' }, reg.job)),
        h('div', { class: 'stack', style: 'flex:1' },
          h('div', { class: 'speech' }, line),
          result ? null : h('div', { class: 'muted' }, `${c.clue === 'plot' ? '📖 줄거리' : '💭 느낀 점'}을 듣고 맞는 책을 골라 주세요`))),
      hearts(),
      c.guildHint ? h('div', { class: 'item', style: 'background:#e3daf5' }, `📣 ${c.guildHint}`) : null,
      result ? null : h('div', null,

function cafeLayoutFor(c) {
  const r = rng(hashStr('layout' + c.id));
  let n = 0;
  const L = [];
  const add = (id, x, y) => { if (!overlapsAny(L, id, x, y)) L.push({ uid: c.id + 'f' + n++, id, x, y, rot: 0 }); };
  add(pick(['shelf_big', 'shelf_pastel', 'shelf_antique'], r), 0, 0);
  add(pick(['coffee_basic', 'coffee_espresso', 'coffee_gold'], r), 3, 0);
  add(pick(['bar_tea', 'bar_wood', 'bar_premium'], r), 4, 0);
  if (c.level > 6) add(pick(['cake_case', 'cake_gold'], r), 5, 0);
  add(pick(['shelf_small', 'deco_clock'], r), 7, 0);
  const chair = pick(['chair_wood', 'chair_cushion', 'chair_mint', 'chair_velvet'], r);
  for (const [dx, dy] of [[1, 3], [5, 3], [2, 5]]) {
    add(pick(['desk_round', 'desk_white'], r), dx, dy);
    add(chair, dx - 1, dy);
    add(chair, dx + 1, dy);
  }
  add('deco_rug', 4, 5);
  for (const id of ['deco_plant', 'deco_monstera', 'deco_lamp', 'deco_cat', 'deco_fishtank', 'deco_globe']) {
    if (r() < 0.6) add(id, Math.floor(r() * 8), 1 + Math.floor(r() * 6));
  }
  return L;
}
function overlapsAny(L, id, x, y) {
  const d = FURN[id];
  if (x < 0 || y < 0 || x + d.w > 8 || y + d.h > 8 || (x === 0 && y === 7)) return true;
  return L.some((p) => {
    if (!!FURN[p.id].floor !== !!d.floor) return false;
    const q = rectOf(p);
    return x < q.x + q.w && x + d.w > q.x && y < q.y + q.h && y + d.h > q.y;
  });
}

/* ── 주간 인기투표 ── */
function myVoteBase() {
  const friends = S.friends.filter((f) => f.status === 'friend').length;
  return 25 + S.level * 3 + ambience() * 0.8 + Object.keys(S.regulars).length * 5 + S.vote.pop * 0.6 + friends * 4;
}
function standings(week, progress) {
  const k = 0.1 + 0.9 * progress;
  const list = CAFE_POOL.map((c) => {
    const r = rng(hashStr(week + c.id));
    return { id: c.id, name: c.cafe, owner: c.owner, votes: Math.round((40 + r() * 160 + c.level * 1.2) * k) + (S.vote.week === week ? S.vote.given[c.id] || 0 : 0) };
  });
  list.push({ id: 'me', name: `${S.nickname}의 북카페`, owner: S.nickname, votes: Math.round(myVoteBase() * k), me: true });
  return list.sort((a, b) => b.votes - a.votes);
}
/** 주가 바뀌면 지난주 순위대로 상금을 주고 새 투표를 시작한다 */
function ensureWeek() {
  const now = weekKey();
  if (S.vote.week === now) return;
  if (S.vote.week) {
    const final = standings(S.vote.week, 1);
    const rank = final.findIndex((e) => e.me) + 1;
    const reward = RANK_REWARD[rank - 1] || 0;
    S.coins += reward;
    S.vote.last = { week: S.vote.week, rank, reward };
    S.stats.bestRank = S.stats.bestRank ? Math.min(S.stats.bestRank, rank) : rank;
    setTimeout(() => openModal({
      title: '🏆 주간 인기투표 결과',
      body: h('div', { class: 'stack center' },
        h('div', { style: 'font-size:56px' }, rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : '🎗️'),
        h('p', { style: 'margin:0;font-size:16px;font-weight:900' }, `지난주 우리 카페는 ${rank}위!`),
        h('p', { style: 'margin:0' }, reward ? `순위 상금 ${fmt(reward)} 코인을 받았어요!` : '3위 안에 들면 상금을 받아요. 이번 주도 화이팅!')),
      foot: [h('button', { class: 'btn mint', onclick: closeTopModal }, '확인')],
    }), 300);
  }
  S.vote = { week: now, used: 0, given: {}, rewarded: false, pop: 0, last: S.vote.last || null };
  ensureGuildWeek();
  saveState();
}

/** 아바타에 마우스를 3초 올려 두면 그 카페 인테리어와 점장 아바타를 함께 보여 준다 */
const PEEK_MS = 3000;
function withCafePeek(el, entry) {
  let timer = null;
  let pop = null;
  let watch = null;
  el.style.cursor = 'zoom-in';
  el.title = '3초 동안 올려 두면 카페 미리보기';
  const hide = () => {
    clearTimeout(timer);
    clearInterval(watch);
    el.classList.remove('peeking');
    if (pop) pop.remove();
    pop = null;
  };
  const show = () => {
    const mine = entry.me;
    const c = mine ? null : cafeById(entry.id);
    const cols = mine ? S.grid.cols : 8;
    const rows = mine ? S.grid.rows : 8;
    const canvas = h('canvas', { width: 560, height: 440, style: 'width:280px;height:220px;display:block;border-radius:10px' });
    renderStaticCafe(canvas, mine ? S.layout : cafeLayoutFor(c), cols, rows, {
      wall: mine ? surfaceStyle('wall') : null,
      floor: mine ? surfaceStyle('floor') : null,
      sign: entry.name,
      people: [{ x: Math.floor(cols / 2) - 0.5, y: rows - 1.3, look: mine ? avatarLook() : ownerLook(c), s: 1.7 }],
    });
    pop = h('div', { class: 'peek' }, canvas,
      h('div', { class: 'peek-cap', style: 'display:flex;align-items:center;gap:4px;flex-wrap:wrap' }, (() => { const b = entry.me ? myBadge() : npcBadge(entry.id); return b ? [medalEl(b, false, 'sm'), h('span', { class: 'muted' }, b.name)] : null; })(), h('b', null, `${entry.owner} 점장`), ` · ${entry.name}`, h('span', { class: 'muted' }, ` · ${fmt(entry.votes)}표`)));
    document.body.append(pop);
    const r = el.getBoundingClientRect();
    const pw = 296, ph = 262;
    const left = r.right + 12 + pw > window.innerWidth ? r.left - pw - 12 : r.right + 12;
    pop.style.left = `${clamp(left, 8, window.innerWidth - pw - 8)}px`;
    pop.style.top = `${clamp(r.top + r.height / 2 - ph / 2, 8, window.innerHeight - ph - 8)}px`;
    // 목록이 다시 그려져 아바타가 사라지면 미리보기도 닫는다
    watch = setInterval(() => { if (!el.isConnected) hide(); }, 300);
  };
  el.addEventListener('pointerenter', () => {
    hide();
    el.classList.add('peeking');
    timer = setTimeout(show, PEEK_MS);
  });
  el.addEventListener('pointerleave', hide);
  return el;
}

/* ── 레시피 배우기 (커피 알바 실습) ── */
const COACH = { name: '소이 선배', look: { species: 'squirrel', gender: 'f', eyes: 'sparkle', mouth: 'three', outfit: 'apron', skin: '#c48a52', color: '#9fd8b0' } };

/** 배울 메뉴를 하나씩 이어서 실습 (중간에 닫으면 나머지는 메뉴판에서) */
function startTraining(ids, done) {
  const queue = ids.filter((id) => !S.learned.includes(id));
  if (!queue.length) { done && done(); return; }
  const [id, ...rest] = queue;
  runTraining(id, () => startTraining(rest, done));
}

/** 숙련도는 더 좋은 판정으로만 바뀐다 */
function setMastery(m, grade) {
  if (!grade || GRADES.indexOf(grade) <= GRADES.indexOf(S.mastery[m.id] || 'FAIL')) return false;
  S.mastery[m.id] = grade;
  if (grade === 'PERFECT') toast(`✨ ${m.name} 숙련도 PERFECT! 앞으로 판매가 +20% · 팁 보너스`, true);
  saveState();
  return true;
}

function learnMenu(m) {
  if (S.learned.includes(m.id)) return;
  S.learned.push(m.id);
  toast(`🎓 ${m.icon} ${m.name} 정식 등록! 이제 손님이 주문해요`, true);
  saveState();
}

  }, { wide: true, onClose: () => {
    if (!finished) return;
    // 음료는 직접 내리기 튜토리얼까지 마쳐야 메뉴판에 정식 등록
    if (needsPractice) openBrewGame(m, { tutorial: true }, (grade) => { if (grade) { setMastery(m, grade); learnMenu(m); } next && next(); });
    else next && next();
  } });

  function pickTool(t, redraw) {
    if (finished) return;
    if (t === steps[i]) {
      fx = { icon: TOOLS[t][0], n: i };
      i += 1;
      misses = 0;
      say = i < steps.length ? `좋아요! ${i + 1}단계: ${TOOLS[steps[i]][2]}` : null;
      if (i >= steps.length) {
        finished = true;
        if (!review && !needsPractice) learnMenu(m);
      }
    } else {
      misses += 1;
      wrongTool = t;
      fx = null;
      say = misses >= 2
        ? `힌트! 반짝이는 ${TOOLS[steps[i]][0]} ${josa(TOOLS[steps[i]][1], '을', '를')} 눌러 봐요. ${TOOLS[steps[i]][2]}`
        : `앗, ${josa(TOOLS[t][1], '은', '는')} 아직이에요! 순서가 중요해요. (${i + 1}단계: ${TOOLS[steps[i]][2]})`;
    }
    redraw();
  }
}

/* ── 커피 직접 내리기 미니게임 (단계별 인터랙션) ── */
const GRADES = ['FAIL', 'GOOD', 'GREAT', 'PERFECT'];
const GRADE_COLOR = { PERFECT: '#f3a9bb', GREAT: '#9fd8b0', GOOD: '#8fc6ec', FAIL: '#c8bfb6' };
const STAGE_INFO = {
  grind: { name: '원두 그라인딩', icon: '⚙️', help: '바늘이 분홍(PERFECT)·초록 구간에 왔을 때 STOP! 적정 원두량을 맞춰요.' },
  tamp: { name: '탬핑', icon: '🪨', help: '탬퍼를 아래로 끌어내려 목표 압력(15kg)에서 손을 떼요.' },
  shot: { name: '에스프레소 추출', icon: '🟤', help: '추출을 시작하고, 25초 지점에서 추출 종료!' },
  steam: { name: '스팀 밀크', icon: '☁️', help: '스팀 버튼을 누르고 있다가 60~65℃에서 떼요. 너무 뜨거우면 우유가 타요!' },
  pour: { name: '비율 맞추기', icon: '🫗', help: '재료병을 컵 위로 끌어다 대면 부어져요. 점선에 맞으면 놓아요.' },
};
const POUR_SKIP = ['shot', 'steam', 'cream', 'icecream'];
const pourItems = (m) => [...new Set(m.recipe.filter((t) => LIQUID[t] && !POUR_SKIP.includes(t)))].slice(0, 2);
/** 이 음료를 만들 때 거치는 단계 (디저트는 미니게임 없음) */
function brewStages(m) {
  if (m.kind !== 'drink') return [];
  const st = ['grind', 'tamp', 'shot'].filter((t) => m.recipe.includes(t));
  if (m.recipe.includes('steam')) st.push('steam');
  else if (pourItems(m).length) st.push('pour');
  return st;
}
const gradeBy = (d, perfect, great, good) => (d <= perfect ? 'PERFECT' : d <= great ? 'GREAT' : d <= good ? 'GOOD' : 'FAIL');
function overallGrade(list) {
  const fails = list.filter((g) => g === 'FAIL').length;
  const avg = list.reduce((sum, g) => sum + GRADES.indexOf(g), 0) / list.length;
  if (fails >= 2 || avg < 1) return 'FAIL';
  const g = avg >= 2.75 ? 'PERFECT' : avg >= 2 ? 'GREAT' : 'GOOD';
  return fails ? 'GOOD' : g;
}

/**
 * 메뉴를 배울 때 음료를 직접 내려 본다 — 판정이 그 메뉴의 숙련도가 된다. done(grade) — 닫거나 그만두면 null.
 * opts.tutorial: 처음 배우는 숙련 튜토리얼 (선배 안내, 실패하면 그 단계만 다시)
 * 아니면 메뉴판의 숙련도 연습 (실패하면 처음부터)
 * 평소 영업 중 제조는 사장님·알바 모두 자동이다.
 */
function openBrewGame(m, opts, done) {
  const tut = Boolean(opts.tutorial);
  const stages = brewStages(m);
  const results = [];
  const r = rng(hashStr(m.id + ':' + Math.random()));
  const ease = tut ? 1.6 : 1; // 튜토리얼은 판정 구간이 넓다
  let idx = 0;
  let token = 0;
  let finished = false;
  const md = openModal({
    title: `${tut ? '🎓 숙련 튜토리얼' : '☕ 숙련도 연습'} — ${m.icon} ${m.name}`,
    wide: true,
    body: h('div'),
    onClose: () => { token += 1; if (!finished) done && done(null); },
  });
  const body = md.body;
  const stepsBar = () => h('div', { class: 'brew-steps' }, stages.map((st, i) =>
    h('span', { class: i === idx && results.length === idx ? 'now' : '', style: results[i] ? `background:${GRADE_COLOR[results[i]]}` : '' },
      `${i + 1}. ${STAGE_INFO[st].icon} ${STAGE_INFO[st].name}${results[i] ? ` · ${results[i]}` : ''}`)));
  const helpBox = (st) => h('div', { class: 'brew-help' }, tut ? h('b', null, '소이 선배: ') : null, STAGE_INFO[st].help);

  function judge(g, note) {
    token += 1; // 이 단계의 애니메이션·입력 멈춤
    const stageEl = body.querySelector('.brew-stage');
    if (stageEl) stageEl.append(h('div', { class: 'judge', style: `color:${GRADE_COLOR[g]}` }, g), note ? h('div', { class: 'muted' }, note) : null);
    setTimeout(() => {
      if (!modals.some((x) => x.overlay.contains(body))) return;
      if (tut && g === 'FAIL') { toast('괜찮아요, 이 단계만 다시 해 봐요!'); return runStage(); }
      results[idx] = g;
      idx += 1;
      if (idx < stages.length) runStage();
      else summary();
    }, 950);
  }
  function runStage() {
    const t = ++token;
    const alive = () => t === token;
    const st = stages[idx];
    body.replaceChildren(stepsBar(), helpBox(st), h('div', { class: 'brew-stage' }, STAGES[st](alive)));
  }
  /** requestAnimationFrame 루프 (단계가 끝나면 멈춤) */
  function animate(alive, fn) {
    let last = performance.now();
    const loop = (now) => {
      if (!alive()) return;
      fn(Math.min(0.05, Math.max(0, (now - last) / 1000)));
      last = now;
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }

  const STAGES = {
    // 1) 게이지가 움직일 때 STOP — 초록 구간 = 적정 원두량
    grind(alive) {
      const w = 14 * ease;
      const z0 = 15 + r() * (70 - w);
      const center = z0 + w / 2;
      let pos = 0;
      let dir = 1;
      const speed = (tut ? 50 : 70) + Math.min(40, m.level * 0.4);
      const needle = h('div', { class: 'needle' });
      const grams = h('div', { class: 'readout' }, '0.0g');
      animate(alive, (dt) => {
        pos += dir * speed * dt;
        if (pos >= 100) { pos = 100; dir = -1; }
        if (pos <= 0) { pos = 0; dir = 1; }
        needle.style.left = pos + '%';
        grams.textContent = `${(8 + pos * 0.16).toFixed(1)}g`;
      });
      const stop = () => alive() && judge(gradeBy(Math.abs(pos - center), w * 0.16, w / 2, w));
      return h('div', { class: 'stack center', style: 'width:100%;align-items:center' },
        h('div', { class: 'big-icon' }, '⚙️🫘'), grams,
        h('div', { class: 'gauge' }, h('div', { class: 'zone', style: `left:${z0}%;width:${w}%` }), h('div', { class: 'zone pz', style: `left:${center - w * 0.16}%;width:${w * 0.32}%` }), needle),
        h('button', { class: 'btn pink big', onclick: stop }, 'STOP'));
    },
    // 2) 탬퍼를 아래로 끌어 목표 압력에 맞추기
    tamp(alive) {
      const H = 230, TOP = 8, MAXY = 150;
      const kgAt = (y) => (y / MAXY) * 30;
      const yAt = (kg) => (kg / 30) * MAXY;
      const target = 15;
      let y = 0;
      let drag = null;
      const handle = h('div', { class: 'tamp-handle', style: `top:${TOP}px` }, '탬퍼');
      const kg = h('div', { class: 'readout' }, '0.0kg');
      const meter = h('div', { class: 'fill', style: 'width:0' });
      const band = (lo, hi, cls) => h('div', { class: cls, style: `top:${TOP + 46 + yAt(lo)}px;height:${yAt(hi) - yAt(lo)}px` });
      const set = (ny) => {
        y = clamp(ny, 0, MAXY);
        handle.style.top = `${TOP + y}px`;
        kg.textContent = `${kgAt(y).toFixed(1)}kg`;
        meter.style.width = `${(y / MAXY) * 100}%`;
      };
      handle.addEventListener('pointerdown', (e) => {
        if (!alive()) return;
        drag = { sy: e.clientY, y0: y };
        handle.setPointerCapture?.(e.pointerId);
      });
      handle.addEventListener('pointermove', (e) => { if (drag && alive()) set(drag.y0 + (e.clientY - drag.sy)); });
      handle.addEventListener('pointerup', () => {
        if (!drag || !alive()) return;
        drag = null;
        if (y < 3) return; // 살짝 누르기만 했으면 다시
        judge(gradeBy(Math.abs(kgAt(y) - target), 0.8 * ease, 2 * ease, 4 * ease));
      });
      const track = h('div', { class: 'tamp-track', style: `height:${H}px` },
        band(target - 2 * ease, target + 2 * ease, 'band'),
        h('div', { class: 'pline', style: `top:${TOP + 46 + yAt(target)}px` }),
        handle, h('div', { class: 'basket' }));
      return h('div', { class: 'tamp-wrap' }, track,
        h('div', { class: 'stack', style: 'justify-content:center;min-width:180px' },
          h('div', { class: 'muted' }, '압력'), kg,
          h('div', { class: 'gauge', style: 'height:16px' }, meter),
          h('div', { class: 'muted' }, `목표 ${target}kg (분홍 선)`),
          h('div', { class: 'muted' }, '⬇ 탬퍼를 아래로 끌어요')));
    },
    // 3) 25초에 추출 종료
    shot(alive) {
      const MAX = 40;
      const target = 25;
      let t = 0;
      let running = false;
      const rate = tut ? 6 : 8; // 게임 속 초 / 실제 초
      const needle = h('div', { class: 'needle', style: 'left:0' });
      const fill = h('div', { class: 'fill', style: 'width:0' });
      const secs = h('div', { class: 'readout' }, '0.0초');
      const crema = h('div', { style: 'position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#c98a4a,#5a321a)' });
      const cup = h('div', { style: 'position:relative;width:90px;height:80px;border:3px solid #5a3d2b;border-top:none;border-radius:0 0 20px 20px;overflow:hidden;background:#fff' }, crema);
      const pct = (v) => (v / MAX) * 100;
      const btn = h('button', { class: 'btn pink big', onclick: () => {
        if (!alive()) return;
        if (!running) { running = true; btn.textContent = '■ 추출 종료'; return; }
        judge(gradeBy(Math.abs(t - target), 1 * ease, 3 * ease, 5 * ease));
      } }, '▶ 추출 시작');
      animate(alive, (dt) => {
        if (!running) return;
        t += dt * rate;
        needle.style.left = pct(t) + '%';
        fill.style.width = pct(t) + '%';
        secs.textContent = `${t.toFixed(1)}초`;
        crema.style.height = `${Math.min(100, (t / MAX) * 120)}%`;
        if (t >= MAX) judge('FAIL', '과다 추출! 쓴맛이 나요');
      });
      return h('div', { class: 'stack center', style: 'width:100%;align-items:center' },
        h('div', { class: 'big-icon' }, '☕'), cup, secs,
        h('div', { class: 'gauge' }, fill,
          h('div', { class: 'zone', style: `left:${pct(target - 3 * ease)}%;width:${pct(6 * ease)}%` }),
          h('div', { class: 'zone pz', style: `left:${pct(target - 1 * ease)}%;width:${pct(2 * ease)}%` }),
          [10, 20, 25, 30].map((v) => h('span', { class: 'tick', style: `left:${pct(v)}%` }, `${v}s`)), needle),
        btn);
    },
    // 4-a) 라떼·카푸치노: 스팀 밀크 온도
    steam(alive) {
      const LO = 20, HI = 80, target = 63;
      let temp = LO;
      let holding = false;
      let heated = false;
      const rate = tut ? 9 : 13;
      const pct = (v) => ((v - LO) / (HI - LO)) * 100;
      const merc = h('div', { class: 'merc', style: 'height:0' });
      const readout = h('div', { class: 'readout' }, `${LO}℃`);
      const bubbles = h('div', { class: 'big-icon' }, '🥛');
      animate(alive, (dt) => {
        if (!holding) return;
        temp += dt * rate * (1 + (temp - LO) / 80);
        heated = true;
        merc.style.height = `calc(${pct(temp)}% - 12px)`;
        readout.textContent = `${temp.toFixed(1)}℃`;
        bubbles.textContent = temp > 50 ? '☁️🥛☁️' : '🥛💨';
        if (temp >= HI) judge('FAIL', '우유가 탔어요!');
      });
      const release = () => {
        if (!holding || !alive()) return;
        holding = false;
        if (heated && temp > LO + 5) judge(gradeBy(Math.abs(temp - target), 1.5 * ease, 4 * ease, 7 * ease));
      };
      const btn = h('button', { class: 'btn sky big', style: 'touch-action:none' }, '♨️ 누르고 있기');
      btn.addEventListener('pointerdown', (e) => { if (alive()) { holding = true; btn.setPointerCapture?.(e.pointerId); } });
      btn.addEventListener('pointerup', release);
      btn.addEventListener('pointercancel', release);
      return h('div', { class: 'row', style: 'gap:28px;align-items:center;justify-content:center' },
        h('div', { class: 'thermo' },
          h('div', { class: 'zone', style: `bottom:${pct(target - 4 * ease)}%;height:${pct(LO + 8 * ease)}%` }),
          h('div', { class: 'zone pz', style: `bottom:${pct(target - 1.5 * ease)}%;height:${pct(LO + 3 * ease)}%` }),
          merc),
        h('div', { class: 'stack center', style: 'align-items:center' }, bubbles, readout, h('div', { class: 'muted' }, `목표 ${target - 3}~${target + 2}℃`), btn));
    },
    // 4-b) 아메리카노·에이드·티: 재료병을 끌어다 붓기 (드래그 앤 드롭)
    pour(alive) {
      const items = pourItems(m);
      const base = m.recipe.includes('shot') ? 22 : 0;
      const targets = items.length === 1 ? [86] : [Math.round(base + 28 + r() * 14), 88];
      const layers = base ? [{ t: 'shot', from: 0, to: base }] : [];
      let level = base;
      let pouring = null;
      const cup = h('div', { class: 'pour-cup' });
      const drawCup = () => {
        cup.replaceChildren(
          ...layers.map((l) => h('div', { class: 'lay', style: `bottom:${l.from}%;height:${l.to - l.from}%;background:${LIQUID[l.t]}` })),
          ...targets.map((v, i) => h('div', { class: 'line', style: `bottom:${v}%` }, h('i', null, `${i + 1} ${TOOLS[items[i]][1]}`))));
      };
      drawCup();
      const rate = tut ? 18 : 26; // %/초
      animate(alive, (dt) => {
        if (!pouring) return;
        const last = layers[layers.length - 1];
        if (last && last.t === pouring) last.to += dt * rate;
        else layers.push({ t: pouring, from: level, to: level + dt * rate });
        level = layers[layers.length - 1].to;
        drawCup();
        if (level >= 100) { pouring = null; judge('FAIL', '넘쳤어요!'); }
      });
      let ghost = null;
      const overCup = (x, y) => {
        const b = cup.getBoundingClientRect();
        return x >= b.left - 20 && x <= b.right + 20 && y >= b.top - 140 && y <= b.bottom;
      };
      const bottles = items.map((t) => {
        const el = h('div', { class: 'bottle' }, h('span', null, TOOLS[t][0]), TOOLS[t][1]);
        el.addEventListener('pointerdown', (e) => {
          if (!alive()) return;
          el.setPointerCapture?.(e.pointerId);
          ghost = h('div', { class: 'bottle-ghost', style: `left:${e.clientX}px;top:${e.clientY}px` }, TOOLS[t][0]);
          document.body.append(ghost);
        });
        el.addEventListener('pointermove', (e) => {
          if (!ghost) return;
          ghost.style.left = e.clientX + 'px';
          ghost.style.top = e.clientY + 'px';
          pouring = alive() && overCup(e.clientX, e.clientY) ? t : null;
          ghost.classList.toggle('pouring', Boolean(pouring));
        });
        const drop = () => { pouring = null; if (ghost) ghost.remove(); ghost = null; };
        el.addEventListener('pointerup', drop);
        el.addEventListener('pointercancel', drop);
        return el;
      });
      const finish = () => {
        if (!alive()) return;
        const grades = items.map((t, i) => {
          const tops = layers.filter((l) => l.t === t).map((l) => l.to);
          return tops.length ? gradeBy(Math.abs(Math.max(...tops) - targets[i]), 2 * ease, 5 * ease, 9 * ease) : 'FAIL';
        });
        judge(overallGrade(grades));
      };
      return h('div', { class: 'stack', style: 'align-items:center' },
        h('div', { class: 'pour-wrap' }, cup, h('div', { class: 'bottles' }, h('div', { class: 'muted' }, '재료병을 컵 위로 끌어다 대세요'), bottles)),
        h('div', { class: 'row' },
          h('button', { class: 'btn white', onclick: () => { if (!alive()) return; layers.splice(base ? 1 : 0); level = base; drawCup(); } }, '↺ 비우기'),
          h('button', { class: 'btn pink', onclick: finish }, '완성!')));
    },
  };

  function summary() {
    const overall = overallGrade(results);
    const prev = S.mastery[m.id];
    const effect = {
      PERFECT: '✨ 숙련도 PERFECT — 이 메뉴는 앞으로 판매가 +20% · 팁 보너스!',
      GREAT: '훌륭해요! 메뉴판에서 다시 연습하면 PERFECT에 도전할 수 있어요.',
      GOOD: '무난한 한 잔이에요. 메뉴판에서 연습해 숙련도를 올려 봐요!',
      FAIL: '조금만 더 연습해 봐요!',
    }[overall];
    const again = () => { results.length = 0; idx = 0; runStage(); };
    body.replaceChildren(stepsBar(), h('div', { class: 'stack center', style: 'align-items:center' },
      h('div', { style: `font-size:48px;font-weight:900;color:${GRADE_COLOR[overall]};-webkit-text-stroke:2px #5a3d2b` }, overall),
      h('div', { style: 'font-size:15px;font-weight:800' }, effect),
      h('div', { class: 'stack', style: 'width:min(360px,100%)' }, stages.map((st, i) =>
        h('div', { class: 'result-row' }, h('span', null, `${STAGE_INFO[st].icon} ${STAGE_INFO[st].name}`), h('span', { style: `color:${GRADE_COLOR[results[i]]};-webkit-text-stroke:.6px #5a3d2b` }, results[i])))),
      !tut && prev ? h('div', { class: 'muted' }, `지금 숙련도: ${prev}${GRADES.indexOf(overall) > GRADES.indexOf(prev) ? ` → ${overall} 으로 올라가요!` : ' (더 좋은 판정일 때만 바뀌어요)'}`) : null,
      overall === 'FAIL'
        ? h('div', { class: 'row' }, h('button', { class: 'btn white', onclick: () => md.close() }, '그만두기'), h('button', { class: 'btn pink', onclick: again }, '다시 연습'))
        : h('button', { class: 'btn mint big', onclick: () => { finished = true; md.close(); done && done(overall); } }, tut ? '🎓 숙련 완료! 메뉴 등록' : '확인')));
  }

  runStage();
  return md;
}

/* ── 설정 ── */
function openSettings() {
  openModal({
    title: '⚙️ 설정',
    body: h('div', { class: 'stack' },
      h('div', { class: 'item' }, h('div', { class: 'grow' }, h('b', null, '🌳 카페 밖 계절 풍경'), h('div', { class: 'muted' }, '자동이면 실제 날짜의 계절을 따라가요 (봄 벚꽃 · 여름 초록 · 가을 단풍·은행 · 겨울 눈). 계절 한정 메뉴는 그대로예요.'),
        h('div', { class: 'opts', style: 'margin-top:6px' }, [['auto', '자동'], ...Object.entries(SEASONS).map(([k2, v2]) => [k2, `${v2.icon} ${v2.name}`])].map(([k2, label]) =>
          h('button', { class: 'opt' + ((S.sceneSeason || 'auto') === k2 ? ' on' : ''), onclick: (e) => { S.sceneSeason = k2 === 'auto' ? null : k2; saveState(); [...e.target.parentNode.children].forEach((b2) => b2.classList.toggle('on', b2 === e.target)); } }, label))))),
      h('div', { class: 'item' }, h('div', { class: 'grow' }, h('b', null, '자동 저장'), h('div', { class: 'muted' }, '닉네임·아바타·레벨·재화·가구 배치·단골 도감·클럽 정보가 이 브라우저에 자동 저장돼요.')),
        h('button', { class: 'btn sm mint', onclick: () => { saveState(); toast('저장했어요 💾'); } }, '지금 저장')),
      h('div', { class: 'item' }, h('div', { class: 'grow' }, h('b', null, '처음부터 다시'), h('div', { class: 'muted' }, '모든 진행 상황이 지워져요.')),
        h('button', { class: 'btn sm pink', onclick: () => {
          if (!confirm('정말 처음부터 다시 시작할까요? 저장된 진행 상황이 모두 지워져요.')) return;
          localStorage.removeItem(SAVE_KEY);
          location.reload();
        } }, '초기화'))),
  });
}

/* ── 소셜 시뮬레이션 (서버 대신) ── */
let socialT = 0;
/** 조건을 채운 뱃지를 지급한다 */
function evaluateBadges() {
  const got = [];
  for (const b of BADGES) {
    if (S.badges[b.id]) continue;
    const [cur, goal] = b.progress();
    if (cur < goal) continue;
    S.badges[b.id] = dayKey();
    S.badgeNew.push(b.id);
    const reward = TIERS[b.tier].reward;
    S.coins += reward.coin || 0;
    S.gold += reward.gold || 0;
    if (!S.badge) S.badge = b.id;
    got.push(b);
  }
  // 한꺼번에 여러 개를 받으면(예전 세이브) 알림은 하나로
  if (got.length > 2) toast(`🏅 뱃지 ${got.length}개 획득! 📖 도감 → 뱃지에서 확인하세요`, true);
  else for (const b of got) toast(`🏅 ${TIERS[b.tier].name} 뱃지 획득! ${b.icon} ${b.name} (+${costText(TIERS[b.tier].reward)})`, true);
}
const myBadge = () => (S.badge && S.badges[S.badge] ? BADGE_BY_ID[S.badge] : null);
const medalEl = (b, locked, size = '') =>
  h('span', { class: `medal ${size} ${b.tier === 'rainbow' ? 'rainbow' : ''} ${locked ? 'locked' : ''}`, style: `--tier:${TIERS[b.tier].color}`, title: `${b.name} — ${b.desc}` }, b.icon);

function socialTick(dt) {
  socialT += dt;
  if (socialT < 1) return;
  socialT = 0;
  ensureDaily();
  ensureWeek();
  ensureGuildWeek();
  const now = Date.now();
  for (const f of S.friends) {
    if (f.status === 'sent' && f.at <= now) {
      f.status = 'friend';
      toast(`💌 ${cafeById(f.id).owner}님이 친구 신청을 수락했어요!`);
    }
  }
  if (!S.onboarded) return;
  evaluateBadges();
  // 가끔 친구 신청이 오고, 친구가 방명록을 남긴다
  if (S.friends.length < 3 && Math.random() < 1 / 90) {
    const c = pick(CAFE_POOL.filter((x) => !friendStatus(x.id)));
    if (c) { S.friends.push({ id: c.id, status: 'received', at: now }); toast(`💌 ${c.owner}님이 친구 신청을 보냈어요`); }
  }
  const friends = S.friends.filter((f) => f.status === 'friend');
  if (friends.length && Math.random() < 1 / 150) {
    const c = cafeById(pick(friends).id);
    S.myGuestbook.unshift({ from: c.owner, text: pick(GUESTBOOK_LINES), date: dayKey() });
    S.myGuestbook = S.myGuestbook.slice(0, 50);
    toast(`📝 ${c.owner}님이 방명록을 남겼어요`);
  }
}

/* =========================================================
 * 7. 시작
 * ========================================================= */
function boot() {
  loadState();
  LOADED = S.floor || 1;
  ensureDaily();
  W.player = makeActor('player', avatarLook(), { x: 3, y: 1 });
  W.player.speed = 3.4;
  rebuildWorld();
  if (!walkable(3, 1)) placeNearDoor(W.player);
  spawnStaff();
  resize();
  window.addEventListener('resize', resize);
  $('#btnRotate').addEventListener('click', rotateSelected);
  $('#btnStore').addEventListener('click', storeSelected);
  $('#btnSell').addEventListener('click', sellSelected);
  $('#btnColors').addEventListener('click', () => openSurfaceColors());
  $('#hudDeco').addEventListener('click', () => S.onboarded && openDecoInfo());
  $('#btnEditDone').addEventListener('click', () => setEdit(false));
  $('#btnSettings').addEventListener('click', openSettings);
  $('#hudEvent').addEventListener('click', () => S.onboarded && openVote());
  $('.hud-me').addEventListener('click', () => S.onboarded && !modals.length && openBadges());
  $('.hud-me').title = '내 뱃지 보기';
  $('#btnExpand').addEventListener('click', openExpand);
  const ACTIONS = { shop: () => openShop(), edit: () => setEdit(!UI.edit), people: () => openPeople(), dex: () => openCollection(), friends: () => openFriends(), friends2: () => openFriends(), guild: openGuild, vote: openVote,
    menu: () => { $('#menuSheet').hidden = !$('#menuSheet').hidden; }, floor: () => switchFloor(onFloor2() ? 1 : 2) };
  document.querySelectorAll('#menu button').forEach((b) => b.addEventListener('click', () => {
    if (!S.onboarded) return;
    if (b.dataset.act !== 'edit' && UI.edit) setEdit(false);
    if (b.dataset.act !== 'menu') $('#menuSheet').hidden = true;
    ACTIONS[b.dataset.act]();
  }));
  // HUD "+" 버튼
  const PLUS = {
    coin: () => openShop(),
    gold: () => toast('🥇 금은 레벨 업 · 인기투표 순위 · 독서 클럽 목표 · 뱃지로 모아요'),
    friend: () => openFriends(),
  };
  document.querySelectorAll('#hud .plus').forEach((b) => b.addEventListener('click', (e) => { e.stopPropagation(); if (S.onboarded) PLUS[b.dataset.plus](); }));
  $('#btnBigPlus').addEventListener('click', () => S.onboarded && openExpand());
  $('#hudParty').addEventListener('click', () => S.onboarded && openVote());
  $('#evQuest').addEventListener('click', () => S.onboarded && openQuests());
  $('#evGuild').addEventListener('click', () => S.onboarded && openGuild());
  canvas.addEventListener('pointerdown', () => { $('#menuSheet').hidden = true; });
  // 둥근 웹폰트가 늦게 오면 캔버스 배경(간판 글씨 등)을 다시 그린다
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { BG.key = ''; });
  ensureWeek();
  if (!S.onboarded) startOnboarding();
  refreshHud();
  setInterval(saveState, 5000);
  window.addEventListener('beforeunload', saveState);
  document.addEventListener('visibilitychange', () => document.hidden && saveState());

  let last = performance.now();
  let hudT = 0;
  const frame = (now) => {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    UI.anim += dt;
    if (S.onboarded && !modals.length && !UI.edit) {
      updateSim(dt);
      // 안 보고 있는 층도 동시에 영업
      if (hasFloor(otherFloor())) withFloor(otherFloor(), () => updateSim(dt));
    }
    socialTick(dt);
    render();
    hudT += dt;
    if (hudT > 0.2) { hudT = 0; refreshHud(); }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
boot();
</script>
