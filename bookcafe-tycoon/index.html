/* ── 알림 ── */
function toast(text, big = false) {
  const box = $('#toasts');
  const t = h('div', { class: 'toast' + (big ? ' big' : '') }, text);
  box.append(t);
  while (box.children.length > 4) box.firstChild.remove();
  setTimeout(() => t.remove(), big ? 3200 : 2000);
}

/* ── 재화 ── */
function canPay(cost) { return S.coins >= (cost.coin || 0) && S.gold >= (cost.gold || 0); }
function pay(cost) {
  if (!canPay(cost)) return false;
  S.coins -= cost.coin || 0;
  S.gold -= cost.gold || 0;
  return true;
}
function costText(cost) {
  const parts = [];
  if (cost.coin) parts.push(`코인 ${fmt(cost.coin)}`);
  if (cost.gold) parts.push(`금 ${fmt(cost.gold)}`);
  return parts.join(' + ') || '무료';
}
function costEl(cost) {
  return h('span', { class: 'price' },
    cost.coin ? [h('i', { class: 'ico coin' }), fmt(cost.coin)] : null,
    cost.coin && cost.gold ? ' + ' : null,
    cost.gold ? [h('i', { class: 'ico gold' }), fmt(cost.gold)] : null,
    !cost.coin && !cost.gold ? '무료' : null);
}
const furnCost = (def) => (def.gold ? { gold: def.gold } : { coin: def.coin || 0 });

/** 경험치 — 레벨이 오르면 해금 내용을 알려 준다 */
function addXp(n) {
  if (S.level >= MAX_LEVEL) return;
  S.xp += n;
  const gained = [];
  while (S.level < MAX_LEVEL && S.xp >= xpToNext(S.level)) {
    S.xp -= xpToNext(S.level);
    S.level += 1;
    S.gold += 2;
    gained.push(S.level);
  }
  if (S.level >= MAX_LEVEL) S.xp = 0;
  if (gained.length) onLevelUp(gained);
}

function unlocksAt(lv) {
  const out = [];
  for (const m of MENU) if (m.level === lv && !m.season) out.push(`${m.icon} 새 메뉴: ${m.name}`);
  if (lv === SEASONAL_LEVEL) {
    const now = MENU.filter((m) => m.season === currentSeason()).map((m) => m.name).join(' · ');
    out.push(`${SEASONS[currentSeason()].icon} 계절 한정 메뉴: ${now} (코인 1.5배)`);
  }
  for (const e of EXPANSIONS) if (e.level === lv) out.push(`📐 카페 확장 권한 (${e.size}×${e.size})`);
  STAFF_SLOTS.forEach((s, i) => { if (s.level === lv) out.push(`🧑‍🍳 알바 ${i + 1}번째 자리 고용 권한`); });
  if (lv === 2) out.push('🍰 케이크 진열대를 사서 놓으면 디저트를 팔 수 있어요');
  if (lv === REGULAR_LEVEL) out.push('📖 단골손님 & 책 추천 대화 해금');
  if (lv === FLOOR2_LEVEL) out.push('🪜 2층 독서 라운지 오픈! (6×6 — 오른쪽 아래 🪜 버튼)');
  else if (lv > FLOOR2_LEVEL && (lv - FLOOR2_LEVEL) % 10 === 0 && lv <= FLOOR2_LEVEL + 50) out.push(`🪜 2층 라운지 확장 (${6 + (lv - FLOOR2_LEVEL) / 10}×${6 + (lv - FLOOR2_LEVEL) / 10})`);
  return out;
}

function onLevelUp(levels) {
  const lines = levels.flatMap(unlocksAt);
  toast(`🎉 레벨 업! Lv.${S.level}  (금 +${levels.length * 2})`, true);
  if (W.player) burst(W.player.x, W.player.y, ['star'], 16, 1.3);
  const newMenus = MENU.filter((m) => levels.includes(m.level) && isMenuOpen(m) && !S.learned.includes(m.id)).map((m) => m.id);
  if (lines.length) {
    openModal({
      title: `🎉 Lv.${S.level} 달성!`,
      body: h('div', { class: 'stack' },
        h('p', { class: 'center', style: 'font-size:15px;margin:0' }, '새로 열린 것들'),
        h('div', { class: 'list' }, lines.map((l) => h('div', { class: 'item' }, l))),
        newMenus.length ? h('p', { class: 'center', style: 'margin:0;font-weight:800' }, '📚 새 메뉴는 선배에게 레시피를 배워야 손님이 주문해요!') : null,
        h('p', { class: 'muted center' }, '레벨 업마다 금 2개를 받아요.')),
      foot: newMenus.length
        ? [h('button', { class: 'btn white', onclick: closeTopModal }, '나중에'), h('button', { class: 'btn mint', onclick: () => { closeTopModal(); startTraining(newMenus); } }, '📚 레시피 배우기')]
        : [h('button', { class: 'btn mint', onclick: closeTopModal }, '좋아요!')],
    });
  }
  refreshHud();
}

/* =========================================================
 * 3. 카페 시뮬레이션 — 그리드·길찾기·손님·제조·알바
 * ========================================================= */

/** 저장하지 않는 실행 중 상태 */
const W = {
  time: 0,
  customers: [],
  staff: [],
  player: null,
  rep: null, // 독서 클럽 대표 방문
  repNext: 120,
  stations: {}, // uid → { state: 'idle'|'busy', item, left, total, forC, stock: { 메뉴 id: 남은 잔 수 }, sold }
  roast: {}, // 로스터 uid → { left, total }
  chatIn: 3, // 다음 수다까지
  browseIn: 4, // 다음 책 구경 손님까지
  dirty: {}, // 의자 uid → true (빈 접시)
  popups: [],
  particles: [], // 픽셀 하트·별 이펙트
  spawnIn: 2,
  nextId: 1,
  occ: [],
  seats: [],
};

const defOf = (p) => FURN[p.id];
function rectOf(p) {
  const d = FURN[p.id];
  return p.rot ? { x: p.x, y: p.y, w: d.h, h: d.w } : { x: p.x, y: p.y, w: d.w, h: d.h };
}
const door = () => ({ x: 0, y: S.grid.rows - 1 });
const inBounds = (x, y) => x >= 0 && y >= 0 && x < S.grid.cols && y < S.grid.rows;
const walkable = (x, y) => inBounds(x, y) && !W.occ[y][x];
const center = (t) => ({ x: t.x + 0.5, y: t.y + 0.5 });

/** 가구 칸 점유표(러그 제외), 좌석 목록, 제조대 상태를 다시 만든다 */
function rebuildWorld() {
  const { cols, rows } = S.grid;
  W.occ = Array.from({ length: rows }, () => Array(cols).fill(null));
  for (const p of S.layout) {
    if (layerOf(defOf(p)) !== 'ground') continue; // 러그·벽·천장 가구는 지나갈 수 있다
    const r = rectOf(p);
    for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++) if (inBounds(x, y)) W.occ[y][x] = p.uid;
  }
  const deskAt = (x, y) => {
    const uid = inBounds(x, y) && W.occ[y][x];
    const p = uid && S.layout.find((q) => q.uid === uid);
    return p && defOf(p).kind === 'desk' ? { x, y } : null;
  };
  W.seats = S.layout
    .filter((p) => defOf(p).kind === 'chair')
    .flatMap((p) => {
      const table = deskAt(p.x, p.y - 1) || deskAt(p.x, p.y + 1) || deskAt(p.x - 1, p.y) || deskAt(p.x + 1, p.y);
      return table ? [{ uid: p.uid, x: p.x, y: p.y, table }] : [];
    });
  const stations = {};
  for (const p of S.layout) {
    if (['coffee', 'bar', 'cake'].includes(defOf(p).kind)) stations[p.uid] = W.stations[p.uid] || { state: 'idle' };
  }
  W.stations = stations;
  const roast = {};
  for (const p of S.layout) if (defOf(p).kind === 'roaster') roast[p.uid] = W.roast[p.uid] || { left: ROAST_TIME, total: ROAST_TIME };
  W.roast = roast;
  for (const uid of Object.keys(W.dirty)) if (!W.seats.some((s) => s.uid === uid)) delete W.dirty[uid];
  // 앉을 자리가 사라진 손님은 돌아간다
  for (const c of W.customers) {
    if (c.seatUid && !W.seats.some((s) => s.uid === c.seatUid) && c.state !== 'out') leaveCafe(c, false);
  }
  // 가구에 끼인 사람은 문 옆으로
  for (const a of [W.player, ...W.staff, W.rep].filter(Boolean)) {
    if (!walkable(Math.floor(a.x), Math.floor(a.y))) placeNearDoor(a);
    a.path = [];
    if (a.kind !== 'rep') a.task = null;
  }
}

function canPlace(id, x, y, rot, ignoreUid) {
  const d = FURN[id];
  if (d.surface) return '벽지·바닥재는 보관함에서 눌러 바로 발라요';
  const layer = layerOf(d);
  if (layer === 'wall') { y = 0; rot = 0; } // 벽 가구는 뒷벽에만
  const w = rot ? d.h : d.w;
  const hh = layer === 'wall' ? 1 : rot ? d.w : d.h;
  const dr = door();
  for (let yy = y; yy < y + hh; yy++) {
    for (let xx = x; xx < x + w; xx++) {
      if (!inBounds(xx, yy)) return '카페 밖으로 나가요';
      if (layer === 'ground' && xx === dr.x && yy === dr.y) return '출입문 앞은 비워 두세요';
      for (const p of S.layout) {
        if (p.uid === ignoreUid || layerOf(defOf(p)) !== layer) continue;
        const r = rectOf(p);
        if (xx >= r.x && xx < r.x + r.w && yy >= r.y && yy < r.y + r.h) return '다른 가구와 겹쳐요';
      }
    }
  }
  return null;
}

/** 4방향 BFS. goal 칸은 막혀 있어도(의자) 들어갈 수 있다 */
function findPath(from, isGoal, enterGoal = false) {
  const { cols, rows } = S.grid;
  const key = (x, y) => y * cols + x;
  const start = { x: clamp(Math.floor(from.x), 0, cols - 1), y: clamp(Math.floor(from.y), 0, rows - 1) };
  if (isGoal(start.x, start.y)) return [];
  const prev = new Map([[key(start.x, start.y), null]]);
  const q = [start];
  while (q.length) {
    const cur = q.shift();
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = cur.x + dx;
      const ny = cur.y + dy;
      if (!inBounds(nx, ny) || prev.has(key(nx, ny))) continue;
      const goal = isGoal(nx, ny);
      if (!walkable(nx, ny) && !(enterGoal && goal)) continue;
      prev.set(key(nx, ny), cur);
      if (goal) {
        const path = [];
        for (let t = { x: nx, y: ny }; t && key(t.x, t.y) !== key(start.x, start.y); t = prev.get(key(t.x, t.y))) path.unshift(t);
        return path;
      }
      q.push({ x: nx, y: ny });
    }
  }
  return null;
}
const touches = (x, y, r) =>
  (x >= r.x && x < r.x + r.w && (y === r.y - 1 || y === r.y + r.h)) || (y >= r.y && y < r.y + r.h && (x === r.x - 1 || x === r.x + r.w));
/** 사각형 옆(상하좌우로 맞닿은 빈칸)까지 가는 길 */
const pathNextTo = (from, r) => findPath(from, (x, y) => walkable(x, y) && touches(x, y, r));

/** 문에서 가까운 빈칸에 세운다 (skip 번째로 가까운 칸 — 여러 명이 겹치지 않게) */
function placeNearDoor(a, skip = 0) {
  const d = door();
  const seen = [];
  findPath(d, (x, y) => {
    if (walkable(x, y) && !seen.some((t) => t.x === x && t.y === y)) seen.push({ x, y });
    return seen.length > skip + 1;
  });
  const t = (walkable(d.x, d.y) ? [d, ...seen] : seen)[skip] || seen[seen.length - 1] || d;
  a.x = t.x + 0.5;
  a.y = t.y + 0.5;
}

/* ── 사람(사장님·알바·손님 공통) ── */
function makeActor(kind, look, at) {
  return { id: W.nextId++, kind, look, x: at.x + 0.5, y: at.y + 0.5, path: [], speed: 2.6, facing: 1, walking: false, carry: [], task: null, busy: 0 };
}
function setPath(a, path) {
  a.path = (path || []).map(center);
}
function moveActor(a, dt) {
  if (!a.path.length) { a.walking = false; return true; }
  const t = a.path[0];
  const dx = t.x - a.x;
  const dy = t.y - a.y;
  const dist = Math.hypot(dx, dy);
  const step = a.speed * dt;
  if (Math.abs(dx) > 0.01) a.facing = dx > 0 ? 1 : -1;
  a.walking = true;
  if (dist <= step) {
    a.x = t.x; a.y = t.y; a.path.shift();
    if (!a.path.length) { a.walking = false; return true; }
  } else {
    a.x += (dx / dist) * step;
    a.y += (dy / dist) * step;
  }
  return false;
}

/* ── 메뉴·좌석 ── */
const stationKinds = () => new Set(S.layout.map((p) => defOf(p).kind).filter((k) => STATION_NAME[k]));
const availableMenu = () => {
  const kinds = stationKinds();
  return MENU.filter((m) => isMenuOpen(m) && kinds.has(m.station) && S.learned.includes(m.id));
};
/** 꾸미기 점수: 배치한 가구 + 벽지·바닥재 + 같은 테마를 모은 보너스 */
const DECO_FULL = 600;
function decoBreakdown() {
  const furniture = S.layout.reduce((sum, p) => sum + (defOf(p).amb || 0), 0);
  const surfaces = ['wall', 'floor'].reduce((sum, k) => sum + (S.surface[k] ? FURN[S.surface[k]].amb : 0), 0);
  const counts = {};
  for (const p of S.layout) { const t = defOf(p).theme; if (t && !defOf(p).legacy) counts[t] = (counts[t] || 0) + 1; }
  for (const k of ['wall', 'floor']) if (S.surface[k]) { const t = FURN[S.surface[k]].theme; counts[t] = (counts[t] || 0) + 1; }
  const themeBonus = Object.values(counts).reduce((sum, n) => sum + (n >= 10 ? 40 : n >= 5 ? 15 : 0), 0);
  return { furniture, surfaces, themeBonus, counts, total: furniture + surfaces + themeBonus };
}
const ambience = () => decoBreakdown().total;
/** 점수에 따른 효과 — DECO_FULL 에서 최대 */
function decoBuffs(score = ambience()) {
  const k = clamp(score / DECO_FULL, 0, 1);
  return { visit: 0.5 * k, patience: 0.3 * k, regular: 0.15 * k };
}
/** 기본 벽지 · 바닥 (아무것도 안 발랐을 때) */
const DEFAULT_SURFACE = {
  wall: { base: '#fdf0f2', accent: '#f9dbe3', pattern: 'stripe' },
  floor: { base: '#f9e1e7', accent: '#fdf6ea', pattern: 'checker' },
};
/** 지금 벽지·바닥 모양 = 바른 것(또는 기본) + 직접 고른 색 */
function surfaceStyle(kind) {
  const st = S.surface[kind] && FURN[S.surface[kind]] ? FURN[S.surface[kind]].style : DEFAULT_SURFACE[kind];
  const c = S.surfaceColor && S.surfaceColor[kind];
  return c ? { ...st, ...c } : st;
}
/** 독서 클럽 대표는 1층에만 온다 — 2층을 보고 있어도 버프는 1층 기준 */
const guildBuffOn = () => { const r = LOADED === 1 ? W.rep : FLOOR_RT[1] && FLOOR_RT[1].rep; return Boolean(r && r.state !== 'out'); };

function freeSeats() {
  const taken = new Set(W.customers.map((c) => c.seatUid));
  return W.seats.filter((s) => !taken.has(s.uid) && !W.dirty[s.uid]);
}

/* ── 말풍선 대사 ── */
const ORDER_LINES = ['{m} 부탁해요~', '{m} 한 잔이요!', '여기 {m} 주세요 ☺', '{m} 되나요?'];
const EAT_LINES = ['음~ 향이 너무 좋아요!', '여기 분위기 최고예요 ♪', '책이랑 커피, 완벽해요', '다음에 또 올게요!', '이 자리 명당이네요'];
const REGULAR_LINES = ['이 책 추천이 딱 제 취향이에요!', '점장님 추천은 늘 믿고 봐요', '오늘도 단골 자리 ♥'];
const BROWSE_LINES = ['신간 나왔네?', '이 책 재밌어 보여!', '베스트셀러 코너 최고~', '어떤 책 읽을까…', '표지가 너무 예뻐요'];
const STAFF_LINES = ['주문 들어갑니다!', '테이블 정리할게요~', '어서 오세요!', '라떼 나왔습니다~', '오늘 손님 많네요!'];
const ANGRY_LINES = ['너무 오래 걸려요… 💢', '다음에 올게요…'];
/** 머리 위 말풍선 (text, 몇 초) */
function say(a, text, dur = 3.2) {
  if (!a) return;
  a.say = { text, t: dur, max: dur };
}
function chatter() {
  const talking = [W.player, ...W.staff, ...W.customers].filter((a) => a && a.say).length;
  if (talking >= 3) return;
  const pool = [];
  for (const c of W.customers) {
    if (c.say || c.state === 'out' || c.state === 'in') continue;
    if (c.state === 'eat') pool.push([c, c.regularId && !c.candidate ? pick(REGULAR_LINES) : pick(EAT_LINES)]);
    if ((c.state === 'browse' || c.state === 'read') && c.reading) pool.push([c, pick(BROWSE_LINES)]);
  }
  for (const s2 of W.staff) if (!s2.say) pool.push([s2, Math.random() < 0.4 && s2.line ? s2.line : pick(STAFF_LINES)]);
  if (pool.length) { const [a, text] = pick(pool); say(a, text); }
}

/* ── 책 구경 손님: 책장 앞에 서서 읽다가 가끔 책을 사 간다 ── */
const browseCap = () => Math.min(4, 1 + Math.floor(S.level / 6));
function spawnBrowser() {
  const shelves = S.layout.filter((p) => ['shelf', 'stand'].includes(defOf(p).kind));
  if (!shelves.length) return;
  const d = door();
  const taken = new Set(W.customers.filter((c) => c.browse && c.spot).map((c) => c.spot.x + ',' + c.spot.y));
  for (const p of shuffle(shelves)) {
    const r = rectOf(p);
    const path = findPath(d, (x, y) => walkable(x, y) && touches(x, y, r) && !taken.has(x + ',' + y) && !(x === d.x && y === d.y));
    if (!path || !path.length) continue;
    const c = makeActor('customer', lookFromSeed(Math.random() * 1e9), d);
    c.speed = 1.8;
    c.state = 'browse';
    c.browse = true;
    c.read = 9 + Math.random() * 9;
    c.spot = path[path.length - 1];
    c.shelfRect = r;
    setPath(c, path);
    W.customers.push(c);
    return;
  }
}
function updateBrowser(c, dt) {
  if (!c.reading) {
    if (moveActor(c, dt)) {
      c.reading = true;
      const r = c.shelfRect;
      c.facing = r.x + r.w / 2 >= c.x ? 1 : -1;
    }
    return;
  }
  c.read -= dt;
  if (c.read > 0) return;
  c.reading = false;
  if (Math.random() < 0.4) {
    const coins = 12 + S.level;
    S.coins += coins;
    S.stats.earned += coins;
    questEvent('book');
    questEvent('coins', coins);
    addPopup(c.x, c.y, `📚 +${coins}`, '#b8860b');
    say(c, '이 책 살게요!', 2.2);
  }
  leaveCafe(c, false);
}

/* ── 원두 로스터: 시간이 지나면 볶은 원두가 완성 → 눌러서 거두기 ── */
const ROAST_TIME = 45;
function collectRoast(a, uid) {
  const r = W.roast[uid];
  if (!r) return null;
  if (r.left > 0) return `🫘 원두 로스팅 중… ${Math.ceil(r.left)}초 남음`;
  const coins = 30 + S.level * 3;
  S.coins += coins;
  S.stats.earned += coins;
  questEvent('roast');
  questEvent('coins', coins);
  const p = S.layout.find((q) => q.uid === uid);
  const c0 = p ? center(p) : { x: a.x, y: a.y };
  addPopup(c0.x, c0.y, `🫘 원두 완성! +${coins}`, '#8a5d3b');
  burst(c0.x, c0.y, ['star'], 8, 1.0);
  say(a, '갓 볶은 원두 향 최고!', 2.4);
  r.left = r.total = ROAST_TIME;
  return null;
}

/* ── 손님 ── */
const SKINS = ['#fde3cf', '#f6d0b1', '#eabf9b', '#d9a77f', '#c48c63'];
const HAIRS = ['#3b2a22', '#2f2a35', '#8a5a3b', '#c9a25e', '#5a3d2b', '#a8454f', '#4f5d8a', '#e0d3c0'];
const CLOTHES = ['#f3a9bb', '#8fc6ec', '#b49be0', '#9fd8b0', '#f6c177', '#e9e4ef', '#f08f7a', '#6e8bc7'];
/** 동물 주민 외모 (손님·단골·알바·이웃 점장) — 사람은 점장뿐 */
function lookFromSeed(seed, species) {
  const r = rng(seed);
  const sp = species || pick(SPECIES_IDS, r);
  return {
    species: sp,
    gender: r() < 0.5 ? 'm' : 'f',
    eyes: pick(['round', 'sparkle', 'droopy', 'playful', 'round'], r),
    mouth: pick(sp === 'rabbit' || sp === 'cat' || sp === 'hamster' ? ['ㅅ', 'three', 'ㅅ', 'blush'] : ['three', 'smile', 'blush', 'tongue', 'ㅅ'], r),
    outfit: pick(['hoodie', 'dress', 'vest', 'apron', 'shirt', 'overalls', 'beret'], r),
    skin: pick(SPECIES[sp].fur, r),
    color: pick(CLOTHES, r),
    cloth: pick(['plain', 'plain', 'stripe', 'check', 'dot'], r),
    pattern: pick(['none', 'none', 'spots', 'stripes', 'patch'], r),
    freckles: r() < 0.3,
    acc: pick([null, null, 'ribbon', 'flower', 'glasses', 'bandana', 'belt'], r),
    accColor: pick(['#f3a9bb', '#fcefb4', '#b49be0', '#8fc6ec', '#e0607a'], r),
    hat: pick([null, null, null, 'cowboy', 'beanie', 'chef'], r),
    hatColor: pick(['#8a5d3b', '#6b4a33', '#e0607a', '#6e8bc7', '#9fd8b0', '#3a3a42'], r),
  };
}

function spawnCustomer() {
  const menu = availableMenu();
  const seats = freeSeats();
  if (!menu.length || !seats.length) return;
  const d = door();
  // 문에서 갈 수 있는 빈 좌석
  for (const seat of shuffle(seats)) {
    const path = findPath(d, (x, y) => x === seat.x && y === seat.y, true);
    if (!path) continue;
    const c = makeActor('customer', lookFromSeed(Math.random() * 1e9), d);
    c.speed = 2.2;
    c.state = 'in';
    c.seatUid = seat.uid;
    setPath(c, path);
    // 5레벨부터 단골(후보)이 섞여 온다
    if (S.level >= REGULAR_LEVEL && Math.random() < 0.28 + decoBuffs().regular) {
      const present = new Set(W.customers.map((x) => x.regularId));
      const pool = REGULARS.filter((r) => !present.has(r.id));
      const unmet = pool.filter((r) => !S.regulars[r.id]);
      const known = pool.filter((r) => S.regulars[r.id]);
      const wooing = unmet.filter((r) => S.courtship[r.id] && S.courtship[r.id].hits > 0); // 이미 1~2번 맞힌 후보는 더 자주 온다
      const reg = known.length && Math.random() < 0.45 ? pick(known) : wooing.length && Math.random() < 0.6 ? pick(wooing) : unmet.length ? pick(unmet) : null;
      if (reg) {
        c.regularId = reg.id;
        c.look = regularLook(reg);
        c.candidate = !S.regulars[reg.id];
      }
    }
    W.customers.push(c);
    return;
  }
}
const regularLook = (r) => lookFromSeed(hashStr('regular' + r.id), r.species);

function seatOf(c) { return W.seats.find((s) => s.uid === c.seatUid); }

function sitDown(c) {
  const menu = availableMenu();
  const seat = seatOf(c);
  if (!seat || !menu.length) return leaveCafe(c, false);
  // 최근 해금된 메뉴가 조금 더 자주 나온다
  // 최근 해금된 메뉴와 계절 한정이 조금 더 자주 나온다
  const weighted = menu.flatMap((m) => Array(m.season ? 4 : 1 + Math.floor(m.level / 15)).fill(m));
  c.order = pick(weighted).id;
  c.state = 'wait';
  say(c, pick(ORDER_LINES).replace('{m}', MENU_BY_ID[c.order].name), 3.4);
  const comfort = FURN[S.layout.find((p) => p.uid === seat.uid).id].comfort || 0;
  c.patienceMax = clamp((38 + comfort) * (1 + decoBuffs().patience), 38, 100);
  c.patience = c.patienceMax;
  c.x = seat.x + 0.5;
  c.y = seat.y + 0.5;
  c.facing = seat.table.x >= seat.x ? 1 : -1;
}

function leaveCafe(c, ate) {
  if (ate && c.seatUid) W.dirty[c.seatUid] = true;
  const seat = seatOf(c);
  c.state = 'out';
  const from = seat || { x: Math.floor(c.x), y: Math.floor(c.y) };
  const d = door();
  // 의자 칸에서 나와 문으로
  const path = findPath(from, (x, y) => x === d.x && y === d.y, true);
  setPath(c, path || []);
  c.leaving = true;
}

/** 기쁠 때 픽셀 하트·별이 퐁퐁 (그리드 좌표 기준) */
function burst(gx, gy, kinds = ['heart', 'star'], n = 8, z = 1.15) {
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.2;
    const sp = 40 + Math.random() * 50;
    W.particles.push({ gx, gy, z, x: 0, y: 0, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, t: 0, life: 0.9 + Math.random() * 0.5,
      kind: pick(kinds), color: pick(['#f08fa5', '#e0607a', '#ffd166', '#f3a9bb', '#9fd8b0']), size: 0.8 + Math.random() * 0.6 });
  }
}
function addPopup(x, y, text, color = '#7a5136', dz = 0) {
  W.popups.push({ x, y, text, color, t: 0 });
}

/** 손님에게 메뉴 제공 → 코인·팁 (경험치는 일일 퀘스트로만) */
function serveCustomer(c, item) {
  const m = MENU_BY_ID[item.menu];
  let price = m.price;
  if (m.season) price *= SEASON_BUFF;
  if (guildBuffOn() && m.station !== 'cake') price *= 1.1;
  const regular = c.regularId && S.regulars[c.regularId];
  if (regular) price *= 1.3;
  const perfect = S.mastery[m.id] === 'PERFECT'; // 배울 때 PERFECT 받은 메뉴
  if (perfect) price *= 1.2; // PERFECT: 판매가 +20%
  const tip = Math.round(price * 0.3 * clamp(c.patience / c.patienceMax, 0, 1)) + (perfect ? Math.round(price * 0.15) : 0);
  const total = Math.round(price) + tip;
  if (perfect) addPopup(c.x, c.y, 'PERFECT ✨', '#e58fa5', 0.45);
  burst(c.x, c.y, perfect ? ['star', 'heart'] : ['heart'], perfect ? 12 : 7);
  S.coins += total;
  // 손님 대접은 코인만 — 경험치는 일일 퀘스트에서
  questEvent('serve');
  questEvent('menu', 1, m.id);
  questEvent('coins', total);
  if (c.patience / c.patienceMax >= 0.5) questEvent('fast');
  S.stats.sales += 1;
  S.stats.earned += total;
  S.stats.streak += 1;
  S.stats.bestStreak = Math.max(S.stats.bestStreak, S.stats.streak);
  if (m.season) S.stats.season[m.season] = (S.stats.season[m.season] || 0) + 1;
  S.vote.pop += 1;
  if (S.guild && S.guild.week === weekKey()) S.guild.weekSales += 1;
  if (regular) regular.visits = (regular.visits || 0) + 1;
  addPopup(c.x, c.y, `+${total}${tip ? ' (팁 ' + tip + ')' : ''}`, '#b8860b');
  c.state = 'eat';
  c.eat = 5;
  c.mood = 'happy';
  say(c, regular ? pick(REGULAR_LINES) : perfect ? '와, 완벽한 한 잔이에요!' : pick(['고마워요~', '맛있겠다!', '잘 마실게요 ♪']), 2.6);
}

/* ── 제조대 ── */
/** 누군가 만들고 있거나 들고 있는 주문의 손님들 */
function coveredCustomers() {
  const set = new Set();
  const pool = {}; // 메뉴별로 이미 있거나 곧 나올 잔 수 (재고 + 만드는 중인 묶음 + 손에 든 것)
  const addPool = (id, n) => { pool[id] = (pool[id] || 0) + n; };
  for (const st of Object.values(W.stations)) {
    if (st.state === 'busy') { if (st.forC) set.add(st.forC); addPool(st.item, BREW_BATCH - (st.forC ? 1 : 0)); }
    for (const [id, n] of Object.entries(st.stock || {})) addPool(id, n);
  }
  for (const a of [W.player, ...W.staff].filter(Boolean)) {
    for (const it of a.carry) { if (it.forC) set.add(it.forC); else addPool(it.menu, 1); }
    if (a.task && a.task.type === 'station' && a.task.forC) set.add(a.task.forC);
  }
  for (const c of waitingCustomers()) if (!set.has(c.id) && pool[c.order] > 0) { pool[c.order] -= 1; set.add(c.id); }
  return set;
}
function waitingCustomers() {
  return W.customers.filter((c) => c.state === 'wait').sort((a, b) => a.patience - b.patience);
}
function uncoveredFor(kind) {
  const covered = coveredCustomers();
  return waitingCustomers().filter((c) => !covered.has(c.id) && MENU_BY_ID[c.order].station === kind);
}
/** 제조 시간 배율 (메뉴 기본 시간 × 이 값 ÷ 기계 속도) */
const BREW_TIME_K = 0.55;
/** 한 번 만들면 몇 잔이 나오나 — 제조대에 재고로 쌓이고 한 잔씩 집어 간다 */
const BREW_BATCH = 5;
const stockOf = (st) => Object.values(st.stock || {}).reduce((n, k) => n + k, 0);
/** 제조 시작 — 손님(c) 주문이거나, 주문 없이 미리 만들 메뉴(menuId) */
function startBrew(uid, c, menuId) {
  const p = S.layout.find((q) => q.uid === uid);
  const m = MENU_BY_ID[menuId || c.order];
  const t = (m.time * BREW_TIME_K) / (defOf(p).speed || 1);
  const prev = W.stations[uid] || {};
  W.stations[uid] = { ...prev, state: 'busy', item: m.id, left: t, total: t, forC: c ? c.id : null, stock: prev.stock || {} };
}
/** 주문이 없을 때: 이 제조대에서 미리 만들 메뉴 고르기 */
function openPremake(p) {
  const kind = defOf(p).kind;
  const list = availableMenu().filter((m) => m.station === kind);
  if (!list.length) return toast(`${STATION_NAME[kind]}로 만들 수 있는 배운 메뉴가 없어요 — 📖 메뉴판에서 배워 주세요`);
  openModal({
    title: `☕ ${STATION_NAME[kind]} — 미리 만들어 둘까요?`,
    body: h('div', { class: 'stack' },
      h('div', { class: 'muted' }, `지금 들어온 주문은 없어요. 한 번 만들면 ${BREW_BATCH}잔이 제조대에 쌓여서, 같은 메뉴를 시킨 손님에게 바로 낼 수 있어요 (알바도 가져다줘요).`),
      h('div', { class: 'opts', style: 'grid-template-columns:repeat(auto-fill,minmax(110px,1fr))' }, list.map((m) =>
        h('button', { class: 'opt', onclick: () => { closeTopModal(); if (!assign(W.player, { type: 'station', uid: p.uid, menu: m.id })) toast('거기까지 갈 수 없어요'); } },
          h('div', { style: 'font-size:22px' }, m.icon), m.name, h('div', { class: 'muted' }, `${((m.time * BREW_TIME_K) / (defOf(p).speed || 1)).toFixed(1)}초 · ${BREW_BATCH}잔`))))),
  });
}

/* ── 사장님·알바 행동 ── */
/** 목표 칸 옆에 도착했을 때 실제로 하는 일. 결과 메시지를 돌려준다(사장님만 표시) */
function doTask(a, task) {
  if (task.type === 'station') {
    const st = W.stations[task.uid];
    const p = S.layout.find((q) => q.uid === task.uid);
    if (!st || !p) return null;
    st.stock ||= {};
    // 재고에서 한 잔 집기
    const take = (id) => {
      if (a.carry.length >= 2) return '손이 꽉 찼어요!';
      a.carry.push({ menu: id, forC: null });
      st.stock[id] -= 1;
      if (st.stock[id] <= 0) { delete st.stock[id]; if (!stockOf(st)) st.sold = 1.6; }
      return null;
    };
    if (task.take) return st.stock[task.take] ? take(task.take) : null;
    const wanted = new Set(waitingCustomers().map((c) => c.order));
    const useful = Object.keys(st.stock).find((id) => wanted.has(id));
    if (!task.menu && !task.forC && useful) return take(useful); // 주문한 손님이 있는 메뉴부터
    if (st.state === 'busy') return stockOf(st) && !task.forC && !task.menu ? take(Object.keys(st.stock)[0]) : `${MENU_BY_ID[st.item].name} 만드는 중…`;
    const want = task.forC ? waitingCustomers().find((c) => c.id === task.forC) : null;
    const target = want && !coveredExcept(task, want) ? want : uncoveredFor(defOf(p).kind)[0];
    if (task.menu && (!target || !task.forC)) { startBrew(task.uid, null, task.menu); return null; } // 주문 없이 미리 만들기
    if (target) { startBrew(task.uid, target); return null; }
    if (stockOf(st)) return take(Object.keys(st.stock)[0]);
    return `${STATION_NAME[defOf(p).kind]}로 만들 주문이 없어요`;
  }
  if (task.type === 'serve') {
    const c = W.customers.find((x) => x.id === task.cid);
    if (!c || c.state !== 'wait') return '이미 떠났거나 받은 손님이에요';
    const i = a.carry.findIndex((it) => it.menu === c.order);
    if (i < 0) return `${MENU_BY_ID[c.order].icon} ${josa(MENU_BY_ID[c.order].name, '을', '를')} 기다려요`;
    const [item] = a.carry.splice(i, 1);
    serveCustomer(c, item);
    return null;
  }
  if (task.type === 'roast') return collectRoast(a, task.uid);
  if (task.type === 'clean') {
    if (!W.dirty[task.uid]) return null;
    a.busy = 1.0;
    a.cleaning = task.uid;
    return null;
  }
  return null;
}
/** 이 손님이 (지금 이 일 말고) 이미 다른 누군가에게 챙겨지고 있는지 */
function coveredExcept(task, c) {
  for (const st of Object.values(W.stations)) if (st.state !== 'idle' && st.forC === c.id) return true;
  for (const a of [W.player, ...W.staff].filter(Boolean)) {
    if (a.carry.some((it) => it.forC === c.id)) return true;
    if (a.task && a.task !== task && a.task.type === 'station' && a.task.forC === c.id) return true;
  }
  return false;
}

function targetRect(task) {
  if (task.type === 'station' || task.type === 'clean' || task.type === 'roast') {
    const p = S.layout.find((q) => q.uid === task.uid);
    return p ? rectOf(p) : null;
  }
  if (task.type === 'serve') {
    const c = W.customers.find((x) => x.id === task.cid);
    return c ? { x: Math.floor(c.x), y: Math.floor(c.y), w: 1, h: 1 } : null;
  }
  return null;
}
/** 일을 맡기고 그쪽으로 걸어가게 한다. 갈 수 없으면 false */
function assign(a, task) {
  const r = targetRect(task);
  if (!r) return false;
  const path = pathNextTo({ x: a.x, y: a.y }, r);
  if (!path) return false;
  a.task = task;
  setPath(a, path);
  return true;
}

function updateWorker(a, dt, isPlayer) {
  if (a.busy > 0) {
    a.busy -= dt;
    if (a.busy <= 0 && a.cleaning) {
      if (W.dirty[a.cleaning]) {
        delete W.dirty[a.cleaning];
        S.stats.cleaned += 1;
        questEvent('clean');
        const seat = W.seats.find((s) => s.uid === a.cleaning);
        if (seat) { addPopup(seat.table.x + 0.5, seat.table.y + 0.5, '✨ 깨끗!', '#4f9a6a', -0.4); burst(seat.table.x + 0.5, seat.table.y + 0.5, ['star'], 4, 0.6); }
      }
      a.cleaning = null;
    }
    return;
  }
  const arrived = moveActor(a, dt);
  if (arrived && a.task) {
    const task = a.task;
    a.task = null;
    const msg = doTask(a, task);
    if (msg && isPlayer) toast(msg);
    if (!isPlayer) a.rest = 0.3 / (a.workSpeed || 1);
  }
}

/** 알바가 다음에 할 일을 고른다 — 다른 사람이 맡은 일은 건너뛴다 */
function staffThink(s) {
  const others = [W.player, ...W.staff].filter((o) => o && o !== s && o.task);
  const claimed = (pred) => others.some((o) => pred(o.task));
  const waiting = waitingCustomers();

  // 1) 들고 있는 것 건네기
  while (s.carry.length) {
    const it = s.carry[0];
    const c =
      waiting.find((x) => x.id === it.forC && x.order === it.menu) ||
      waiting.find((x) => x.order === it.menu && !claimed((t) => t.type === 'serve' && t.cid === x.id));
    if (c && assign(s, { type: 'serve', cid: c.id })) return;
    s.carry.shift(); // 받을 손님이 없으면 정리
  }
  // 2) 다 만든 것 가져오기
  const carriedFor = (id) => [W.player, ...W.staff].filter(Boolean).reduce((n, o) => n + o.carry.filter((it) => it.menu === id).length + (o.task && o.task.take === id ? 1 : 0), 0);
  for (const [uid, st] of Object.entries(W.stations)) {
    for (const id of Object.keys(st.stock || {})) {
      const need = waiting.filter((c) => c.order === id).length - carriedFor(id);
      if (need > 0 && assign(s, { type: 'station', uid, take: id })) return;
    }
  }
  // 3) 아직 아무도 안 만드는 주문 만들기
  const covered = coveredCustomers();
  for (const c of waiting) {
    if (covered.has(c.id)) continue;
    const kind = MENU_BY_ID[c.order].station;
    const free = S.layout.filter((p) => defOf(p).kind === kind && W.stations[p.uid]?.state === 'idle' && !claimed((t) => t.type === 'station' && t.uid === p.uid));
    for (const p of free) if (assign(s, { type: 'station', uid: p.uid, forC: c.id })) return;
  }
  // 4) 빈 접시 치우기
  for (const uid of Object.keys(W.dirty)) {
    if (claimed((t) => t.type === 'clean' && t.uid === uid)) continue;
    if (assign(s, { type: 'clean', uid })) return;
  }
  // 5) 할 일이 없으면 가끔 어슬렁
  if (Math.random() < 0.02) {
    const { cols, rows } = S.grid;
    const tx = Math.floor(Math.random() * cols);
    const ty = Math.floor(Math.random() * rows);
    if (walkable(tx, ty)) setPath(s, findPath({ x: s.x, y: s.y }, (x, y) => x === tx && y === ty) || []);
  }
}

/** 알바는 1층에서 일한다 (2층을 보고 있어도) */
function spawnStaff() { return withFloor(1, spawnStaffHere); }
function spawnStaffHere() {
  const keep = new Map(W.staff.map((s) => [s.poolId, s]));
  W.staff = S.staff.map((h0, i) => {
    if (keep.has(h0.poolId)) return keep.get(h0.poolId);
    const def = STAFF_POOL.find((p) => p.id === h0.poolId);
    const a = makeActor('staff', def.look, door());
    placeNearDoor(a, i + 1);
    a.poolId = def.id;
    a.name = def.name;
    a.speed = 2.4 * def.speed;
    a.workSpeed = def.speed;
    a.rest = 0.5;
    return a;
  });
}

/* ── 독서 클럽 대표 방문 (판매가 +10% 버프) ── */
function updateRep(dt) {
  if (!S.guild || onFloor2()) { W.rep = null; return; }
  if (!W.rep) {
    W.repNext -= dt;
    if (W.repNext > 0) return;
    const r = makeActor('rep', { ...lookFromSeed(hashStr(S.guild.name)), outfit: 'vest', color: '#7c62b8' }, door());
    r.name = `${S.guild.leader} (클럽 대표)`;
    r.speed = 1.6;
    r.state = 'visit';
    r.stay = 45;
    const { cols, rows } = S.grid;
    const spots = [];
    for (let y = 1; y < rows - 1; y++) for (let x = 1; x < cols - 1; x++) if (walkable(x, y)) spots.push({ x, y });
    const t = spots.length ? pick(spots) : door();
    setPath(r, findPath(door(), (x, y) => x === t.x && y === t.y) || []);
    W.rep = r;
    toast(`🏰 ${S.guild.name} 대표 ${S.guild.leader}님 방문! 음료 판매가 +10%`, true);
    return;
  }
  const r = W.rep;
  moveActor(r, dt);
  if (r.state === 'visit' && !r.path.length) {
    r.stay -= dt;
    if (r.stay <= 0) {
      r.state = 'out';
      const d = door();
      setPath(r, findPath({ x: r.x, y: r.y }, (x, y) => x === d.x && y === d.y) || []);
    }
  } else if (r.state === 'out' && !r.path.length) {
    W.rep = null;
    W.repNext = 150 + Math.random() * 90;
  }
}

/* ── 한 프레임 ── */
function updateSim(dt) {
  W.time += dt;

  // 손님 입장
  W.spawnIn -= dt;
  if (W.spawnIn <= 0) {
    const maxC = W.seats.length;
    if (onFloor2()) { if (W.customers.filter((c) => c.state !== 'out' && !c.browse).length < maxC) spawnLoungeGuest(); }
    else if (W.customers.filter((c) => c.state !== 'out' && !c.browse).length < maxC) spawnCustomer();
    W.spawnIn = (clamp(9 - S.level * 0.03, 3, 9) / (1 + decoBuffs().visit)) * (0.7 + Math.random() * 0.6);
  }

  // 책 구경 손님
  W.browseIn -= dt;
  if (W.browseIn <= 0) {
    if (W.customers.filter((c) => c.browse && c.state !== 'out').length < browseCap()) spawnBrowser();
    W.browseIn = 6 + Math.random() * 7;
  }

  // 제조대 · 로스터
  for (const st of Object.values(W.stations)) {
    if (st.state === 'busy') {
      st.left -= dt;
      if (st.left <= 0) { st.stock ||= {}; st.stock[st.item] = (st.stock[st.item] || 0) + BREW_BATCH; st.state = 'idle'; st.forC = null; }
    }
    if (st.sold > 0) st.sold -= dt;
  }
  for (const r of Object.values(W.roast)) if (r.left > 0) r.left = Math.max(0, r.left - dt);

  // 말풍선
  for (const a of [W.player, ...W.staff, ...W.customers, W.rep]) if (a && a.say && (a.say.t -= dt) <= 0) a.say = null;
  W.chatIn -= dt;
  if (W.chatIn <= 0) { chatter(); W.chatIn = 2.5 + Math.random() * 2.5; }

  // 손님
  for (const c of W.customers) {
    if (c.state === 'in') {
      if (moveActor(c, dt)) sitDown(c);
    } else if (c.state === 'wait') {
      c.patience -= dt;
      if (c.patience <= 0) {
        c.mood = 'angry';
        S.stats.angry += 1;
        S.stats.streak = 0;
        S.vote.pop = Math.max(0, S.vote.pop - 1);
        addPopup(c.x, c.y, '💢', '#c0392b');
        say(c, pick(ANGRY_LINES), 2.6);
        leaveCafe(c, false);
      }
    } else if (c.state === 'eat') {
      c.eat -= dt;
      if (c.eat <= 0) leaveCafe(c, true);
    } else if (c.state === 'browse') {
      updateBrowser(c, dt);
    } else if (c.state === 'lounge' || c.state === 'read') {
      updateLoungeGuest(c, dt);
    } else if (c.state === 'out') {
      moveActor(c, dt);
    }
  }
  W.customers = W.customers.filter((c) => !(c.state === 'out' && !c.path.length));

  // 사장님
  if (W.player) updateWorker(W.player, dt, true);

  // 알바
  for (const s of W.staff) {
    if (!s.task && !s.path.length && s.busy <= 0) {
      s.rest = (s.rest || 0) - dt;
      if (s.rest <= 0) staffThink(s);
    }
    updateWorker(s, dt, false);
  }

  updateRep(dt);

  for (const p of W.popups) p.t += dt;
  for (const q of W.particles) { q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 55 * dt; q.vx *= 0.98; }
  W.particles = W.particles.filter((q) => q.t < q.life);
  W.popups = W.popups.filter((p) => p.t < 1.6);
}

/* =========================================================

/** 가구 종류별 높이 (타일 비율) — 그리기·클릭 판정에 같이 쓴다 */

/** 의자 등받이 방향: 붙은 책상 반대쪽 */
function chairBack(layout, p) {
  const isDesk = (x, y) => layout.some((q) => {
    if (FURN[q.id].kind !== 'desk') return false;

const BOOK_COLORS = ['#e57373', '#81c784', '#64b5f6', '#ffd54f', '#ba68c8', '#f3a9bb', '#8fc6ec', '#f6c177', '#9fd8b0', '#fffaf3', '#6e8bc7', '#c99a6b'];

/** 벽 위 좌표계: 오른쪽 벽(y=0)은 x칸 → 오른쪽 아래로, 왼쪽 벽(x=0)은 앞(rows)에서 뒤로 */
function onWall(v, side, fn) {
  const { ctx } = v;
  ctx.save();
  if (side === 'right') { const [sx, sy] = isoP(v, 0, 0, 0); ctx.translate(sx, sy); ctx.transform(1, 0.5, 0, 1, 0, 0); }
  else { const [sx, sy] = isoP(v, 0, v.rows, 0); ctx.translate(sx, sy); ctx.transform(1, -0.5, 0, 1, 0, 0); }
  fn(v.iw / 2);
  ctx.restore();
}

/** 벽지 무늬 (벽 좌표계 안에서: x→, y↓, T = 한 칸) */
function paintWall(ctx, x, y, w, hh, st, T) {

      ctx.fillStyle = shade(st.base, -0.05);

/** 벽지 컬렉션 무늬 */
function paintWallExtra(ctx, x, y, w, hh, st, T, r) {

  ctx.moveTo(m0[0], m0[1]);

    const q = mid(p, pts[(i + 1) % n]);
    ctx.quadraticCurveTo(p[0], p[1], q[0], q[1]);
  }

/* ── 동물 주민: 말랑한 인형 체형 (머리와 몸이 하나로 이어진 콩 모양) ──

/** 보송보송한 털 결 — 실루엣 가장자리를 따라 짧은 털을 바깥으로 */

    switch (sp) {
      case 'rabbit': {
        ctx.translate(sx * 6 * kx, top + 5); ctx.rotate(sx * (0.08 + wig));
        draw(blob([[-4.6, 2], [-5.6, -10], [-4.2, -21], [0, -25.5], [4.2, -21], [5.6, -10], [4.6, 2]]), furFill(-5, -25, 5, 2));
        ctx.fillStyle = softFill(ctx, inner, 0, -22, 0, 0, 0.2, -0.05); ctx.fill(blob([[-2.1, 0], [-2.7, -10], [-1.6, -19], [1.6, -19], [2.7, -10], [2.1, 0]]));
        break;
      }
      case 'cat':
      case 'fox':
      case 'squirrel': {
        const big = sp === 'fox' ? 1.25 : sp === 'squirrel' ? 1.05 : 1;
        ctx.translate(sx * 9.5 * kx, top + 7); ctx.rotate(sx * (0.12 + wig * 0.6));
        draw(blob([[-6 * big, 3], [0, -12 * big], [6 * big, 3]].map(([x, y]) => [x * sx, y])), furFill(-6, -12, 6, 3));
        ctx.fillStyle = sp === 'fox' ? '#fffaf3' : inner; ctx.fill(blob([[-3.4 * big, 1.5], [0, -8 * big], [3.4 * big, 1.5]].map(([x, y]) => [x * sx, y])));
        if (sp === 'fox') { ctx.fillStyle = '#4a3428'; ctx.fill(blob([[-2.2, -8.6], [0, -15], [2.2, -8.6]].map(([x, y]) => [x * sx, y]))); }
        if (sp === 'squirrel') { ctx.strokeStyle = shade(fur, -0.35); ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(sx * 1.5, -16); ctx.moveTo(0, -12); ctx.lineTo(-sx * 1, -15.5); ctx.stroke(); }
        break;
      }
      case 'bear':
      case 'hamster': {
        const rad = sp === 'bear' ? 5.6 : 4.2;
        ctx.translate(sx * 10.5 * kx, top + 6.5);
        const p = HAS_P2D ? new Path2D() : null;
        if (p) { p.ellipse(0, 0, rad, rad, 0, 0, Math.PI * 2); draw(p, furFill(-rad, -rad, rad, rad)); }
        else { ell(ctx, 0, 0, rad, rad); ink(ctx, fur, 1.5); }
        ctx.fillStyle = sp === 'bear' ? shade(fur, -0.25) : inner; ell(ctx, 0, 0.5, rad * 0.5, rad * 0.5); ctx.fill();
        break;
      }
      case 'deer': {
        // 짧고 뭉툭한 뿔 + 옆으로 뻗은 귀
        ctx.translate(sx * 5.5, top + 3);
        ctx.strokeStyle = '#7a5136'; ctx.lineWidth = 4.2;
        ctx.beginPath(); ctx.moveTo(0, 1); ctx.quadraticCurveTo(sx * 1.5, -6, sx * 4, -10); ctx.moveTo(sx * 1.2, -4); ctx.quadraticCurveTo(sx * 5, -5, sx * 7, -7.5); ctx.stroke();
        ctx.strokeStyle = '#c99a6b'; ctx.lineWidth = 2.4; ctx.stroke();
        ctx.translate(sx * 8.5, 9); ctx.rotate(sx * (0.45 + wig));
        draw(blob([[0, -3], [sx * 9, -1.2], [sx * 10.5, 1], [0, 3.4]]), furFill(0, -3, 10, 3));
        ctx.fillStyle = inner; ctx.fill(blob([[sx * 1.5, -1.2], [sx * 7, -0.4], [sx * 7, 0.8], [sx * 1.5, 1.6]]));
        break;
      }
      case 'dog': {
        // 쫑긋 선 큰 귀 (코기풍)
        ctx.translate(sx * 9 * kx, top + 8); ctx.rotate(sx * (0.28 + wig));
        draw(blob([[-5, 3], [-4, -8], [0, -14], [4, -8], [5, 3]].map(([x, y]) => [x * sx, y])), furFill(-5, -14, 5, 3));
        ctx.fillStyle = inner; ctx.fill(blob([[-2.4, 1.5], [-2, -6], [0, -10], [2, -6], [2.4, 1.5]].map(([x, y]) => [x * sx, y])));
        break;
      }
      case 'sheep':
        ctx.translate(sx * 15 * kx, top + 17);
        ctx.strokeStyle = '#7a5136'; ctx.lineWidth = 4.4; ctx.beginPath(); ctx.arc(0, 0, 4, -Math.PI * 0.4, Math.PI * 1.3); ctx.stroke();
        ctx.strokeStyle = '#d9b48a'; ctx.lineWidth = 2.6; ctx.stroke();
        break;
    }
    ctx.restore();
  }
}

function plushTail(ctx, sp, fur, t, kx) {
  ctx.save();
  ctx.translate(13 * kx, -12);
  const sway = Math.sin(t * (sp === 'dog' ? 9 : 3)) * (sp === 'dog' ? 0.3 : 0.14);
  ctx.rotate(sway);
  const soft = 'rgba(70,45,30,.5)';
  const draw = (pts, fill) => { const p = blob(pts); if (!HAS_P2D) { blobPath(ctx, pts); ink(ctx, fill, 1.5); return; } ctx.fillStyle = fill; ctx.fill(p); ctx.lineWidth = 1.5; ctx.strokeStyle = soft; ctx.stroke(p); };
  switch (sp) {
    case 'fox': draw([[0, 3], [7, -4], [14, -14], [18, -24], [15, -10], [10, 0], [3, 6]], softFill(ctx, fur, 0, -24, 18, 6)); draw([[14, -15], [18, -24], [16.6, -13]], '#fffaf3'); break;
    case 'squirrel': draw([[0, 4], [9, -2], [12, -16], [8, -30], [-2, -36], [-7, -28], [-2, -23], [4, -25], [5, -14], [-1, -3]], softFill(ctx, fur, -6, -36, 12, 4)); break;
    case 'cat': {
      const tip = Math.sin(t * 3 + 1) * 3;
      const path = () => { ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(11, -2, 11 + tip * 0.3, -12); ctx.quadraticCurveTo(11 + tip, -18, 6 + tip, -18); };
      ctx.strokeStyle = soft; ctx.lineWidth = 6.4; path(); ctx.stroke(); ctx.strokeStyle = fur; ctx.lineWidth = 4.4; path(); ctx.stroke();
      break;
    }
    case 'dog': draw([[0, 1], [5, -3], [8, -8], [6, 0], [2, 4]], softFill(ctx, fur, 0, -8, 8, 4)); break;
    case 'rabbit': case 'sheep': case 'hamster': draw([[0, -3], [4, -4], [6, 0], [4, 4], [0, 4], [-2, 0]], '#fffaf3'); break;
    case 'penguin': break;
    default: draw([[0, -3], [4, -3], [5, 1], [2, 4], [-1, 1]], softFill(ctx, fur, 0, -3, 5, 4));
  }
  ctx.restore();
}

/** 작고 반짝이는 구슬 눈 + 눈썹 */
function plushEyes(ctx, look, expr, t, y, gap, fur) {
  let eyes = look.eyes || 'round';
  if (expr === 'happy' || expr === 'eat') eyes = 'smile';
  else if (expr === 'focus') eyes = 'sleepy';
  const blink = Math.sin(t * 1.3 + (look.skin || '').length * 0.7) > 0.985 && eyes !== 'smile';
  // 눈썹 (짙은 털색 · 표정마다 각도)
  ctx.strokeStyle = shade(fur, -0.45); ctx.lineWidth = 1.8; ctx.lineCap = 'round';
  for (const sx of [-1, 1]) {
    const x0 = sx * (gap - 2.2), x1 = sx * (gap + 2.2), by = y - 5;
    ctx.beginPath();
    if (expr === 'angry') { ctx.moveTo(x0, by + 1.8); ctx.lineTo(x1, by - 0.6); }
    else if (expr === 'worried') { ctx.moveTo(x0, by - 1.2); ctx.lineTo(x1, by + 1); }
    else if (expr === 'order' || expr === 'happy' || expr === 'talk' || expr === 'wave') { ctx.moveTo(x0, by); ctx.quadraticCurveTo(sx * gap, by - 2.2, x1, by); }
    else { ctx.moveTo(x0, by + 0.4); ctx.lineTo(x1, by); }
    ctx.stroke();
  }
  for (const sx of [-1, 1]) {
    const ex = sx * gap;
    ctx.strokeStyle = '#2a1d16'; ctx.lineWidth = 1.7;
    if (blink) { ctx.beginPath(); ctx.moveTo(ex - 2.2, y + 0.4); ctx.quadraticCurveTo(ex, y + 1.6, ex + 2.2, y + 0.4); ctx.stroke(); continue; }
    if (eyes === 'playful' && sx > 0) { ctx.beginPath(); ctx.moveTo(ex - 2, y - 1.3); ctx.lineTo(ex + 1.4, y); ctx.lineTo(ex - 2, y + 1.3); ctx.stroke(); continue; }
    if (eyes === 'smile') { ctx.lineWidth = 1.9; ctx.beginPath(); ctx.arc(ex, y + 1.3, 2.3, Math.PI * 1.12, Math.PI * 1.88); ctx.stroke(); continue; }
    if (eyes === 'sleepy') { ctx.beginPath(); ctx.arc(ex, y - 0.4, 2.3, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke(); continue; }
    const rx = eyes === 'sparkle' ? 2.3 : 1.9, ry = eyes === 'sparkle' ? 2.6 : 2.2;
    const g = ctx.createRadialGradient(ex - 0.6, y - 0.8, 0, ex, y, ry);
    g.addColorStop(0, '#4a3428'); g.addColorStop(1, '#120c09');
    ell(ctx, ex, y, rx, ry); ctx.fillStyle = g; ctx.fill();
    ctx.fillStyle = '#fff';
    if (eyes === 'sparkle') {
      ctx.beginPath(); const cx = ex - 0.7, cy = y - 1.1;
      for (let k = 0; k < 8; k++) { const rr2 = k % 2 ? 0.4 : 1.3; const a = (k * Math.PI) / 4; ctx.lineTo(cx + Math.cos(a) * rr2, cy + Math.sin(a) * rr2); }
      ctx.closePath(); ctx.fill();
    } else { ell(ctx, ex - 0.8, y - 1, 0.95, 0.95); ctx.fill(); }
    ell(ctx, ex + 0.9, y + 1.1, 0.45, 0.45); ctx.fill();
    // 쳐진 눈: 털색 눈꺼풀이 위를 살짝 덮는다
    if (eyes === 'droopy') {
      ctx.fillStyle = fur; ctx.beginPath(); ctx.moveTo(ex - rx - 0.6, y - 0.4); ctx.quadraticCurveTo(ex, y - ry - 1.6, ex + rx + 0.6, y - 0.4 + sx * 0.8); ctx.lineTo(ex + rx + 0.6, y - ry - 1); ctx.lineTo(ex - rx - 0.6, y - ry - 1); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = shade(fur, -0.35); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(ex - rx - 0.4, y - 0.5); ctx.quadraticCurveTo(ex, y - 1.6, ex + rx + 0.4, y - 0.3 + sx * 0.8); ctx.stroke();
    }
    if (look.gender === 'f') { ctx.strokeStyle = '#2a1d16'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(ex + sx * 2.2, y - 1.8); ctx.lineTo(ex + sx * 3.6, y - 3); ctx.stroke(); }
  }
}

/** 동물 주민 전체 (꼬리 → 귀 → 다리 → 몸 → 의상 → 팔 → 얼굴 → 모자) */
function drawPlush(ctx, look, o, t, expr, outfit, color) {
  const sp = look.species;
  const fur = look.skin;
  const [kx, ky] = PLUSH_K[sp] || [1, 1];
  const pts = plushShape(sp);
  const top = -51 * ky;
  const faceY = top + 16;
  const seed = hashStr(sp + fur);
  const soft = 'rgba(74,52,40,.85)';
  // 몸 전체가 살짝 좌우로 흔들 (갸웃)
  const tilt = o.walking ? Math.sin(t * 12) * 0.035 : expr === 'order' ? 0.07 : expr === 'talk' ? Math.sin(t * 2.2) * 0.05 : expr === 'worried' ? -0.05 : Math.sin(t * 0.9) * 0.025;
  ctx.save();
  ctx.rotate(tilt);

  plushTail(ctx, sp, fur, t, kx);
  plushEars(ctx, sp, fur, top, kx, t, o);

  // 짧은 다리
  if (!o.sit) {
    const sw = o.walking ? Math.sin(t * 12) * 2.4 : 0;
    for (const sx of [-1, 1]) {
      const lift = sx < 0 ? Math.max(0, sw) : Math.max(0, -sw);
      const legC = sp === 'penguin' ? '#f6b14a' : outfit === 'overalls' ? color : shade(fur, -0.08);
      const p = blob([[sx * 4, -4 - lift], [sx * 11, -4 - lift], [sx * 12, -0.6 - lift], [sx * 7.5, 1.2 - lift], [sx * 3.4, -0.6 - lift]]);
      if (HAS_P2D) { ctx.fillStyle = shade(legC, -0.06); ctx.fill(p); ctx.lineWidth = 1.4; ctx.strokeStyle = soft; ctx.stroke(p); }
    }
  }

  // 몸 (통통한 서양배 모양) — 단색 셀 셰이딩: 바탕 + 아래쪽 그늘 한 겹 + 작은 하이라이트
  const body = blob(pts);
  const BIB = { hamster: '#fffaf3', rabbit: '#fffaf3', dog: '#fffaf3', fox: '#fffaf3', cat: '#fffaf3', squirrel: '#f6e3c8', deer: '#f6e3c8', bear: shade(fur, 0.32), sheep: null, penguin: null }[sp];
  if (HAS_P2D) {
    ctx.fillStyle = fur; ctx.fill(body);
    ctx.save(); ctx.clip(body);
    // 얼룩 무늬 (머리 위를 덮는 큰 색 패치 — 한쪽 귀·눈가까지)
    if (look.pattern === 'patch' || look.pattern === 'spots') {
      ctx.fillStyle = shade(fur, sp === 'rabbit' || sp === 'cat' || sp === 'dog' ? -0.42 : -0.25);
      const side = (seed % 2) ? 1 : -1;
      ctx.fill(blob([[-22, top - 2], [22, top - 2], [22, faceY + 4], [9, faceY + 4], [3, faceY - 3], [-6, faceY - 5], [-22, faceY - 6]].map(([x, y]) => [x * side, y])));
    }
    if (look.pattern === 'stripes' && ['cat', 'squirrel', 'fox', 'bear', 'hamster'].includes(sp)) {
      ctx.fillStyle = shade(fur, -0.2);
      for (const dx of [-5, 0, 5]) ctx.fill(blob([[dx - 1.4, top - 1], [dx + 1.4, top - 1], [dx + 0.8, top + 7], [dx - 0.8, top + 7]]));
    }
    // 흰 턱받이: 볼 아래부터 배까지 하나로 (햄스터·토끼처럼)
    if (BIB) {
      ctx.fillStyle = BIB;
      ctx.fill(blob([[-12 * kx, faceY + 2.5], [-6, faceY + 0.5], [0, faceY + 2], [6, faceY + 0.5], [12 * kx, faceY + 2.5], [15 * kx, faceY + 11], [14 * kx, -11], [8, -3], [-8, -3], [-14 * kx, -11], [-15 * kx, faceY + 11]]));
    }
    if (sp === 'penguin') { ctx.fillStyle = '#fffaf3'; ctx.fill(blob([[-13, faceY - 4], [0, faceY - 1], [13, faceY - 4], [15, -14], [9, -3], [-9, -3], [-15, -14]])); }
    // 셀 그늘 (오른쪽 아래 한 겹)
    ctx.fillStyle = 'rgba(90,55,35,.13)';
    ctx.fill(blob([[24, -30], [22, -4], [6, 2], [-10, 2], [8, -6], [16, -16]]));
    // 작은 하이라이트
    ctx.fillStyle = 'rgba(255,255,255,.4)';
    ctx.fill(blob([[-12 * kx, top + 9], [-8 * kx, top + 4], [-4 * kx, top + 3.6], [-8 * kx, top + 7]]));
    ctx.restore();
    ctx.lineWidth = 1.5; ctx.strokeStyle = soft; ctx.stroke(body);
  } else { blobPath(ctx, pts); ink(ctx, fur, 1.6); }
  if (sp === 'sheep') { furFuzz(ctx, pts, fur, seed, true); for (const [wx, wy, wr] of [[-8, top + 3, 6], [0, top + 1, 6.5], [8, top + 3, 6]]) { ell(ctx, wx, wy, wr, wr * 0.85); ctx.fillStyle = shade(fur, 0.08); ctx.fill(); ctx.strokeStyle = 'rgba(70,45,30,.35)'; ctx.lineWidth = 0.8; ctx.stroke(); } }

  // 의상
  plushOutfit(ctx, look, outfit, color, kx, faceY);

  // 팔: 짧고 통통 — 주문할 땐 번쩍, 대화·반가울 땐 살랑
  const waving = expr === 'order' || expr === 'wave' || (expr === 'talk' && Math.sin(t * 0.8) > 0.3);
  const swing = o.walking ? Math.sin(t * 12) * 0.45 : Math.sin(t * 2) * 0.05;
  for (const sx of [-1, 1]) {
    ctx.save();
    ctx.translate(sx * 15 * kx, -24);
    let ang = sx < 0 ? -0.85 + swing : 0.85 + swing; // 평소엔 앞발을 배 앞에 모은다
    if (sx > 0 && waving) ang = -2.4 + Math.sin(t * 10) * 0.35;
    if (sx > 0 && expr === 'eat') ang = -1.7 + Math.sin(t * 4) * 0.12;
    if (o.sit) ang = sx < 0 ? 0.5 : -0.5;
    ctx.rotate(ang);
    const sleeve = ['apron', 'shirt', 'vest', 'beret', 'dress'].includes(outfit) ? null : outfit === 'hoodie' ? color : null;
    const armC = sleeve || fur;
    const p = blob([[-3.4, -1], [3.4, -1], [3.8, 4.5], [2.6, 8], [-2.6, 8], [-3.8, 4.5]]);
    if (HAS_P2D) { ctx.fillStyle = armC; ctx.fill(p); ctx.lineWidth = 1.4; ctx.strokeStyle = soft; ctx.stroke(p); }
    ctx.fillStyle = '#f6b3c4'; ell(ctx, 0, 6.8, 1.6, 1); ctx.fill();
    ctx.restore();
  }

  // 얼굴
  const muzzle = { bear: 0.9, deer: 0.9, sheep: 0.75 }[sp];
  if (muzzle) {
    const mw = 6.5 * muzzle * kx, mh = 5 * muzzle;
    const mg = ctx.createRadialGradient(0, faceY + 4, 0, 0, faceY + 5, mw * 1.3);
    mg.addColorStop(0, shade(fur, 0.55)); mg.addColorStop(1, shade(fur, 0.32));
    ell(ctx, 0, faceY + 5.5, mw, mh); ctx.fillStyle = sp === 'bear' || sp === 'deer' ? shade(fur, 0.35) : mg; ctx.fill();
  }
  if (sp === 'squirrel') { for (const sx of [-1, 1]) { const cg = ctx.createRadialGradient(sx * 10, faceY + 5, 0, sx * 10, faceY + 5, 6); cg.addColorStop(0, shade(fur, 0.5)); cg.addColorStop(1, shade(fur, 0.25)); ell(ctx, sx * 10.5 * kx, faceY + 5, 6, 4.6); ctx.fillStyle = cg; ctx.fill(); } }
  const strong = look.mouth === 'blush' || expr === 'happy' || expr === 'talk';
  blush(ctx, -10 * kx, faceY + 4.5, strong ? 4.6 : 3.8, strong ? 2.8 : 2.3, strong);
  blush(ctx, 10 * kx, faceY + 4.5, strong ? 4.6 : 3.8, strong ? 2.8 : 2.3, strong);
  if (look.freckles) { ctx.fillStyle = shade(fur, -0.35); for (const sx of [-1, 1]) for (const [fx, fy] of [[8.5, 2.5], [10.8, 3.4], [9.6, 5.2]]) { ell(ctx, sx * fx * kx, faceY + fy, 0.6, 0.6); ctx.fill(); } }
  plushEyes(ctx, look, expr, t, faceY, 7.4 * Math.min(kx, 1.08), fur);
  // 코
  if (sp === 'penguin') {
    inkP(ctx, blob([[-3.6, faceY + 3], [3.6, faceY + 3], [0, faceY + 7.5]]), softFill(ctx, '#f6b14a', 0, faceY + 3, 0, faceY + 8), 1.4);
  } else {
    const noseC = ['rabbit', 'hamster'].includes(sp) || (sp === 'cat' && fur !== '#5a5a64') ? '#e88aa0' : '#2a1d16';
    const nw = sp === 'deer' || sp === 'dog' ? 3.4 : sp === 'bear' ? 3 : 1.9;
    const nh = sp === 'deer' || sp === 'dog' ? 2.4 : sp === 'bear' ? 2.2 : 1.4;
    const ny = faceY + 2.6;
    const ng = ctx.createRadialGradient(-nw * 0.3, ny, 0, 0, ny + nh * 0.6, nw * 1.4); ng.addColorStop(0, shade(noseC, 0.3)); ng.addColorStop(1, noseC);
    ctx.fillStyle = ng; ctx.fill(blob([[-nw, ny], [nw, ny], [nw * 0.6, ny + nh * 1.3], [0, ny + nh * 1.6], [-nw * 0.6, ny + nh * 1.3]]));
    ctx.fillStyle = 'rgba(255,255,255,.75)'; ell(ctx, -nw * 0.35, ny + 0.6, nw * 0.25, nh * 0.2); ctx.fill();
  }
  if (sp === 'cat' || sp === 'rabbit') {
    ctx.strokeStyle = 'rgba(70,45,30,.45)'; ctx.lineWidth = 0.8; ctx.beginPath();
    for (const sx of [-1, 1]) for (const dy of [-0.4, 1.8]) { ctx.moveTo(sx * 6, faceY + 5 + dy); ctx.lineTo(sx * 13, faceY + 4 + dy * 1.5); }
    ctx.stroke();
  }
  ctx.save(); ctx.scale(0.85, 0.85);
  drawMouth(ctx, look, o, t, expr, (faceY + (sp === 'penguin' ? 10.5 : sp === 'deer' || sp === 'bear' || sp === 'dog' ? 8.4 : 7.2)) / 0.85, sp);
  ctx.restore();

  // 모자 · 장식 · 감정 표시 (머리 꼭대기 기준)
  ctx.save();
  ctx.translate(0, faceY + 1);
  drawHeadwear(ctx, look, outfit, color, o, true);
  plushHat(ctx, look, top - faceY - 1);
  drawEmote(ctx, expr, t);
  ctx.restore();
  ctx.restore();
}

/** 인형 옷 (몸통 위에 덧입힘) */
function plushOutfit(ctx, look, outfit, color, kx, faceY) {
  const soft = 'rgba(70,45,30,.55)';
  const fillP = (pts, fill, lw = 1.4) => { if (!HAS_P2D) { blobPath(ctx, pts); ink(ctx, fill, lw); return; } const p = blob(pts); ctx.fillStyle = fill; ctx.fill(p); ctx.lineWidth = lw; ctx.strokeStyle = soft; ctx.stroke(p); };
  const neckY = faceY + 11;
  switch (outfit) {
    case 'apron':
      fillP([[-9 * kx, neckY + 3], [9 * kx, neckY + 3], [11 * kx, -9], [0, -6.5], [-11 * kx, -9]], softFill(ctx, color, -10, neckY, 10, -6));
      ctx.strokeStyle = shade(color, -0.25); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(-7 * kx, neckY + 3); ctx.lineTo(-5, neckY - 2); ctx.moveTo(7 * kx, neckY + 3); ctx.lineTo(5, neckY - 2); ctx.stroke();
      fillP([[-4, -19], [4, -19], [4, -14.5], [-4, -14.5]], shade(color, 0.28), 1);
      break;
    case 'shirt':
      // 큰 흰 칼라 + 리본 타이
      for (const sx of [-1, 1]) fillP([[0, neckY], [sx * 10 * kx, neckY - 1], [sx * 9 * kx, neckY + 5], [sx * 2, neckY + 4.5]], '#fffaf3', 1.2);
      fillP([[0, neckY + 3], [-4, neckY + 1], [-4, neckY + 6], [0, neckY + 4], [4, neckY + 6], [4, neckY + 1]], color, 1.2);
      break;
    case 'overalls':

/** 점장 그리기 (몸 → 뒷머리 → 얼굴 → 앞머리 → 장식 → 모자) */
/** 2.5등신: 몸은 세로로 키우고 머리는 살짝 줄인다 */
const HUMAN_BODY_K = [1.06, 1.32], HUMAN_HEAD_K = 0.92;
function drawHuman(ctx, look, o, t, expr) {
  ctx.save(); ctx.scale(...HUMAN_BODY_K);
  drawHumanBody(ctx, look, o, t, expr);
  ctx.restore();
  const def = HAIR_DEF[look.hairStyle] || HAIR_DEF[look.gender === 'm' ? 'dandy' : 'bob'];
  const hc = look.hairColor || '#7a4a30';
  const tilt = o.walking ? 0 : expr === 'order' ? 0.12 : expr === 'talk' ? Math.sin(t * 2.2) * 0.08 : Math.sin(t * 0.9) * 0.04;
  ctx.save();
  ctx.translate(0, -28 * HUMAN_BODY_K[1]); ctx.rotate(tilt); ctx.translate(0, -14 * HUMAN_HEAD_K); ctx.scale(HUMAN_HEAD_K, HUMAN_HEAD_K);
  const hat = look.hat;
  const bigHat = hat && hat !== 'none';
  if (def.extra === 'ponytail' || def.extra === 'pigtails' || def.extra === 'braids') hairExtra(ctx, def, hc, t * 2);
  hairBack(ctx, def, hc);
  drawHumanFace(ctx, look, o, t, expr);
  hairFront(ctx, def, hc);
  if (def.extra && !['ponytail', 'pigtails', 'braids'].includes(def.extra) && !(bigHat && (def.extra === 'bun' || def.extra === 'apple' || def.extra === 'halfup'))) hairExtra(ctx, def, hc, t * 2);
  drawHat(ctx, hat, t);
  if (o.crown) { inkP(ctx, blob([[-8, -19], [-9, -28], [-4.5, -23.5], [0, -30], [4.5, -23.5], [9, -28], [8, -19]]), softFill(ctx, '#f2c230', 0, -30, 0, -19), 1.4); }
  drawEmote(ctx, expr, t);
  ctx.restore();
}

/* ── 몸 (사람 점장) ── */
function drawLegs(ctx, look, o, t, animal) {
  const outfit = look.outfit;
  const legColor = animal ? look.skin : outfit === 'dress' ? look.skin : outfit === 'overalls' ? (look.color || OUTFIT_COLOR.overalls) : '#6a5a7b';
  const shoe = animal ? shade(look.skin, -0.22) : '#5a3d2b';
  if (o.sit) {
    for (const sx of [-1, 1]) { inkP(ctx, blob([[sx * 2, -12], [sx * 9, -12.5], [sx * 10, -7], [sx * 2, -6.5]]), softFill(ctx, legColor, 0, -12, 0, -6)); }
    return;
  }
  const sw = o.walking ? Math.sin(t * 12) * 2.6 : 0;
  for (const sx of [-1, 1]) {
    const lift = sx < 0 ? Math.max(0, sw) : Math.max(0, -sw);
    ctx.save();
    ctx.translate(sx * 4.4, -lift);
    inkP(ctx, blob([[-3, -12], [3, -12], [3.4, -3], [0, -1.5], [-3.4, -3]]), softFill(ctx, legColor, -3, -12, 3, -2));
    // 앙증맞은 발
    inkP(ctx, blob([[-3.6, -2.6], [3.4 + sx * 0.8, -3], [4.6 + sx * 0.6, -0.4], [0, 0.8], [-4.2, -0.4]]), softFill(ctx, shoe, -4, -3, 4, 1), 1.8);
    ctx.restore();
  }
}

function drawHairBack(ctx, look) {
  const hair = look.hair || '#7a4a30';
  inkP(ctx, blob([[-17, -52], [17, -52], [19, -32], [15, -22], [8, -24], [0, -26], [-8, -24], [-15, -22], [-19, -32]]), softFill(ctx, hair, -18, -52, 18, -22));
}

/** 옷 무늬를 몸통 안에만 그린다 */
function clothPattern(ctx, kind, color, box) {
  const [x0, y0, x1, y1] = box;
  ctx.save();
  ctx.clip();
  if (kind === 'stripe') {
    ctx.fillStyle = shade(color, -0.22);
    for (let yy = y0 + 2; yy < y1; yy += 4) ctx.fillRect(x0, yy, x1 - x0, 1.6);
  } else if (kind === 'check') {
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    for (let xx = x0; xx < x1; xx += 5) ctx.fillRect(xx, y0, 2, y1 - y0);
    for (let yy = y0; yy < y1; yy += 5) ctx.fillRect(x0, yy, x1 - x0, 2);
  } else if (kind === 'dot') {
    ctx.fillStyle = 'rgba(255,255,255,.65)';
    for (let yy = y0 + 2, r = 0; yy < y1; yy += 4.5, r++) for (let xx = x0 + (r % 2) * 2.5; xx < x1; xx += 5) { ell(ctx, xx, yy, 0.9, 0.9); ctx.fill(); }
  }
  ctx.restore();
}

function drawTorso(ctx, look, outfit, color, animal) {
  const dress = outfit === 'dress';
  const pts = dress
    ? [[-7.5, -28.5], [7.5, -28.5], [11, -21], [15.5, -8.5], [0, -7], [-15.5, -8.5], [-11, -21]]
    : [[-7.5, -28.5], [7.5, -28.5], [11.5, -21], [12.5, -11.5], [7, -7.6], [-7, -7.6], [-12.5, -11.5], [-11.5, -21]];
  const base = { apron: '#fffaf3', vest: '#fffaf3', overalls: '#fcefb4', beret: '#fffaf3' }[outfit] || color;
  const cloth = outfit === 'beret' ? 'stripe' : look.cloth || 'plain';
  blobPath(ctx, pts);
  ctx.fillStyle = softFill(ctx, base, -10, -29, 12, -7);
  ctx.fill();
  blobPath(ctx, pts);
  clothPattern(ctx, cloth, outfit === 'beret' ? color : base, [-16, -30, 16, -6]);
  blobPath(ctx, pts);
  ctx.lineWidth = CHAR_LW; ctx.strokeStyle = INK; ctx.stroke();
  // 배 쪽 털 (동물, 옷 밖으로 살짝)
  switch (outfit) {
    case 'apron': {
      blobPath(ctx, [[-7, -24], [7, -24], [8.5, -10.5], [0, -8.4], [-8.5, -10.5]]);
      ink(ctx, softFill(ctx, color, -8, -24, 8, -9), 1.8);
      ctx.strokeStyle = shade(color, -0.25); ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(-6, -24); ctx.lineTo(-6.5, -28.5); ctx.moveTo(6, -24); ctx.lineTo(6.5, -28.5); ctx.stroke();
      inkP(ctx, blob([[-3.4, -18.5], [3.4, -18.5], [3.4, -14.5], [-3.4, -14.5]]), shade(color, 0.3), 1.2);
      break;
    }
    case 'shirt': {
      for (const sx of [-1, 1]) { inkP(ctx, blob([[sx * 1, -27.5], [sx * 7.5, -29], [sx * 5, -23.5]]), '#fffaf3', 1.4); }
      ctx.fillStyle = shade(color, -0.35); for (let i = 0; i < 3; i++) { ell(ctx, 0, -21 + i * 4.2, 0.9, 0.9); ctx.fill(); }
      blobPath(ctx, [[3.5, -22], [8, -22], [8, -18], [3.5, -18]]); ctx.strokeStyle = shade(color, -0.25); ctx.lineWidth = 1; ctx.stroke();
      break;
    }
    case 'overalls': {
      const denim = color;
      blobPath(ctx, [[-8, -21.5], [8, -21.5], [9.5, -10], [0, -7.8], [-9.5, -10]]);
      ink(ctx, softFill(ctx, denim, -8, -22, 9, -8), 1.8);
      ctx.strokeStyle = denim; ctx.lineWidth = 2.8;
      ctx.beginPath(); ctx.moveTo(-6, -21.5); ctx.lineTo(-7.5, -28.4); ctx.moveTo(6, -21.5); ctx.lineTo(7.5, -28.4); ctx.stroke();
      ctx.fillStyle = '#f2c230'; ell(ctx, -6, -20.5, 1.4, 1.4); ctx.fill(); ell(ctx, 6, -20.5, 1.4, 1.4); ctx.fill();
      blobPath(ctx, [[-3.5, -18], [3.5, -18], [3.5, -14], [-3.5, -14]]); ctx.strokeStyle = shade(denim, 0.35); ctx.lineWidth = 1; ctx.setLineDash([1.2, 1]); ctx.stroke(); ctx.setLineDash([]);
      break;
    }
    case 'beret':
      inkP(ctx, blob([[-5.5, -28.6], [5.5, -28.6], [2, -24], [0, -22.5], [-2, -24]]), '#fcefb4', 1.4);
      break;
    case 'hoodie':
      inkP(ctx, blob([[-6, -19], [6, -19], [7, -14], [-7, -14]]), shade(color, -0.12), 1.4);
      ctx.strokeStyle = '#fffaf3'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(-2, -28); ctx.lineTo(-2.4, -23); ctx.moveTo(2, -28); ctx.lineTo(2.4, -23); ctx.stroke();
      break;
    case 'dress':
      inkP(ctx, blob([[-5, -28.6], [5, -28.6], [0, -24.5]]), '#fffaf3', 1.4);
      inkP(ctx, blob([[-3, -19.5], [3, -19.5], [3, -17], [-3, -17]]), '#fffaf3', 1.2);
      break;
    case 'vest':
      for (const sx of [-1, 1]) { inkP(ctx, blob([[sx * 7.5, -28.4], [sx * 2, -28.4], [sx * 1.4, -10], [sx * 11.5, -11]]), softFill(ctx, color, sx * 10, -28, sx * 2, -10), 1.8); }
      inkP(ctx, blob([[-4.5, -30.5], [0, -28.4], [4.5, -30.5], [4.5, -26.5], [0, -28.4], [-4.5, -26.5]]), '#e0607a', 1.2);
      break;
  }
}

function drawArms(ctx, look, outfit, color, o, t, expr, animal) {
  const sleeveBase = { apron: '#fffaf3', vest: '#fffaf3', overalls: '#fcefb4', beret: '#fffaf3' }[outfit] || color;
  const paw = animal ? look.skin : look.skin || '#fde3cf';
  const swing = o.walking ? Math.sin(t * 12) * 0.5 : Math.sin(t * 2) * 0.06;
  // 주문할 땐 오른손을 번쩍, 대화·반가울 땐 살랑살랑
  const waving = expr === 'order' || (expr === 'talk' && Math.sin(t * 0.8) > 0.3) || expr === 'wave';
  const angles = {
    l: o.sit ? 0.6 : 0.32 + swing,
    r: waving ? -2.5 + Math.sin(t * 10) * 0.35 : expr === 'eat' ? -1.9 + Math.sin(t * 4) * 0.12 : o.sit ? -0.6 : -0.32 + swing,
  };
  for (const side of ['l', 'r']) {
    const sx = side === 'l' ? -1 : 1;
    ctx.save();
    ctx.translate(sx * 9.6, -25.5);
    ctx.rotate(side === 'l' ? angles.l : -angles.r * -1);
    // 소매 (어깨에서 손목으로 가늘어짐)
    inkP(ctx, blob([[-3.2, -1.5], [3.2, -1.5], [3.4, 6], [2.4, 9], [-2.4, 9], [-3.4, 6]]), softFill(ctx, sleeveBase, -3, -1, 3, 9), 2);
    // 앞발 / 손
    ell(ctx, 0, 10.5, 3.3, 3.1); ink(ctx, softFill(ctx, paw, -3, 8, 3, 13), 1.8);
    if (animal) { ctx.fillStyle = shade(paw, -0.18); ell(ctx, 0, 12, 1.6, 0.9); ctx.fill(); }
    ctx.restore();
  }
}

/* ── 머리 (머리 중심 = 0,0) ── */
const HEAD = [[-17.5, -3], [-14.5, -13], [-6, -16.5], [6, -16.5], [14.5, -13], [17.5, -3], [16.5, 7.5], [9.5, 14], [0, 15.5], [-9.5, 14], [-16.5, 7.5]];
function headShape(sp) {
  switch (sp) {
    case 'bear': return [[-18.5, -3], [-15, -14], [-6, -17], [6, -17], [15, -14], [18.5, -3], [18, 8], [10, 15], [0, 16.5], [-10, 15], [-18, 8]];
    case 'squirrel':
    case 'hamster': return [[-17, -5], [-13.5, -14], [-6, -16.5], [6, -16.5], [13.5, -14], [17, -5], [20.5, 5], [13, 14.5], [0, 15.5], [-13, 14.5], [-20.5, 5]];
    case 'fox': return [[-17.5, -4], [-14, -13.5], [-6, -16.5], [6, -16.5], [14, -13.5], [17.5, -4], [17, 5], [8, 13], [0, 16.5], [-8, 13], [-17, 5]];
    case 'deer': return [[-16, -4], [-13, -14], [-6, -16.5], [6, -16.5], [13, -14], [16, -4], [14.5, 7], [8, 15], [0, 16.5], [-8, 15], [-14.5, 7]];
    case 'penguin': return [[-17, -2], [-14, -13.5], [-6, -17], [6, -17], [14, -13.5], [17, -2], [15.5, 9], [8, 14.5], [0, 15.5], [-8, 14.5], [-15.5, 9]];
    default: return HEAD;
  }
}

function drawAnimalHead(ctx, look, o, t, expr) {
  const sp = look.species;
  const fur = look.skin;
  const dark = shade(fur, -0.22);
  const light = shade(fur, 0.5);
  const innerPink = '#f6b3c4';
  const wig = Math.sin(t * 3) * 0.08 + (o.walking ? Math.sin(t * 12) * 0.05 : 0);

  // ── 귀·뿔 (머리 뒤) ──
  const ear = (sx, pts, innerPts, innerColor, rot = 0) => {
    ctx.save();
    ctx.rotate(sx * rot);
    inkP(ctx, blob(pts.map(([x, y]) => [x * sx, y])), softFill(ctx, fur, -10, -40, 10, -8));
    if (innerPts) { inkP(ctx, blob(innerPts.map(([x, y]) => [x * sx, y])), softFill(ctx, innerColor, 0, -38, 0, -10, 0.15, -0.1), 0); }
    ctx.restore();
  };
  switch (sp) {
    case 'rabbit':
      for (const sx of [-1, 1]) {
        ctx.save(); ctx.translate(sx * 6, -12); ctx.rotate(sx * (0.1 + wig));
        // 한쪽 귀 끝은 살짝 접힘
        const tipBend = sx > 0 && look.gender === 'f' ? 3 : 0;
        inkP(ctx, blob([[-4.8, 0], [-5.6, -14], [-4, -26], [0 + tipBend, -30], [4, -26], [5.6, -14], [4.8, 0]]), softFill(ctx, fur, -5, -30, 5, 0));
        inkP(ctx, blob([[-2.2, -2], [-2.8, -14], [-1.6, -24], [1.6, -24], [2.8, -14], [2.2, -2]]), softFill(ctx, innerPink, 0, -24, 0, -2, 0.2, -0.05), 0);
        ctx.restore();
      }
      break;
    case 'cat':
      for (const sx of [-1, 1]) ear(sx, [[16, -6], [17, -25], [5, -15]], [[13.5, -10], [14.5, -21], [8, -14.5]], innerPink, wig * 0.6);
      break;
    case 'fox':
      for (const sx of [-1, 1]) {
        ear(sx, [[17, -6], [18, -31], [4, -15]], [[14, -11], [15, -24], [8.5, -15.5]], '#fffaf3', wig * 0.5);
        ctx.save(); ctx.rotate(sx * wig * 0.5);
        inkP(ctx, blob([[sx * 15.5, -25], [sx * 18, -31], [sx * 12.5, -27]]), '#4a3428', 0);
        ctx.restore();
      }
      break;
    case 'squirrel':
      for (const sx of [-1, 1]) {
        ear(sx, [[14, -9], [13.5, -27], [5, -15]], [[12, -12], [11.8, -22], [7.5, -15]], innerPink, wig * 0.5);
        ctx.strokeStyle = dark; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.moveTo(sx * 13.5, -27); ctx.lineTo(sx * 15, -31); ctx.moveTo(sx * 13.2, -27); ctx.lineTo(sx * 12, -31); ctx.stroke();
      }
      break;
    case 'bear':
    case 'hamster': {
      const r = sp === 'bear' ? 6.5 : 4.8;
      for (const sx of [-1, 1]) {
        ell(ctx, sx * 12.5, -13.5, r, r); ink(ctx, softFill(ctx, fur, sx * 12 - r, -20, sx * 12 + r, -8));
        ell(ctx, sx * 12.5, -13, r * 0.52, r * 0.52); ink(ctx, sp === 'bear' ? dark : innerPink, 0);
      }
      break;
    }
    case 'deer':
      // 뭉툭하고 귀여운 뿔 + 옆으로 뻗은 잎사귀 귀
      for (const sx of [-1, 1]) {
        ctx.strokeStyle = INK; ctx.lineWidth = 5.4;
        const antler = () => { ctx.beginPath(); ctx.moveTo(sx * 6, -14); ctx.quadraticCurveTo(sx * 7, -24, sx * 10, -29); ctx.moveTo(sx * 7.6, -22); ctx.quadraticCurveTo(sx * 12, -23, sx * 14, -26); ctx.stroke(); };
        antler(); ctx.strokeStyle = '#b07a4f'; ctx.lineWidth = 3; antler();
        ctx.save(); ctx.translate(sx * 17, -9); ctx.rotate(sx * (0.5 + wig));
        inkP(ctx, blob([[0, -3.6], [9 * sx, -1.5], [10.5 * sx, 1], [0, 3.6]]), softFill(ctx, fur, 0, -4, 0, 4));
        inkP(ctx, blob([[1 * sx, -1.4], [7 * sx, -0.6], [7 * sx, 0.8], [1 * sx, 1.6]]), innerPink, 0);
        ctx.restore();
      }
      break;
    case 'sheep': {
      // 양털 구름 (머리 뒤)
      ctx.fillStyle = fur; ctx.strokeStyle = INK; ctx.lineWidth = CHAR_LW;
      const puffs = [[-17, -6, 7], [-14, -14, 7.5], [-6, -18, 8], [6, -18, 8], [14, -14, 7.5], [17, -6, 7], [17, 4, 6.5], [-17, 4, 6.5]];
      for (const [px, py, pr] of puffs) { ell(ctx, px, py, pr, pr * 0.9); ctx.fill(); ctx.stroke(); }
      for (const [px, py, pr] of puffs) { ell(ctx, px, py, pr - 1.2, pr * 0.9 - 1.2); ctx.fill(); }
      for (const sx of [-1, 1]) {
        ctx.strokeStyle = INK; ctx.lineWidth = 4.6; ctx.beginPath(); ctx.arc(sx * 17, 1, 4.5, -Math.PI * 0.2, Math.PI * 1.4); ctx.stroke();
        ctx.strokeStyle = '#d9b48a'; ctx.lineWidth = 2.6; ctx.stroke();
      }
      break;
    }
  }

  // ── 얼굴 ──
  const face = sp === 'sheep' ? '#fde3cf' : fur;
  inkP(ctx, blob(headShape(sp)), softFill(ctx, face, -14, -16, 14, 16));
  // 무늬 (얼굴 안에만)
  ctx.save();
  blobPath(ctx, headShape(sp));
  ctx.clip();
  if (sp === 'penguin') {
    inkP(ctx, blob([[0, -9], [-8, -15], [-15.5, -6], [-14, 6], [-7, 13], [0, 15], [7, 13], [14, 6], [15.5, -6], [8, -15]]), softFill(ctx, '#fffaf3', -10, -10, 10, 14), 0);
  }
  if (sp === 'fox') {
    for (const sx of [-1, 1]) { inkP(ctx, blob([[sx * 18, 0], [sx * 4, 4], [0, 16], [sx * 10, 14]]), '#fffaf3', 0); }
  }
  if (sp === 'hamster' || (sp === 'dog' && look.pattern !== 'patch')) {
    inkP(ctx, blob([[-9, 0], [0, -3], [9, 0], [11, 9], [0, 16], [-11, 9]]), light, 0);
  }
  if (look.pattern === 'stripes' && ['cat', 'squirrel', 'fox', 'bear'].includes(sp)) {
    ctx.strokeStyle = dark; ctx.lineWidth = 2.2;
    for (const dx of [-4, 0, 4]) { ctx.beginPath(); ctx.moveTo(dx, -17); ctx.quadraticCurveTo(dx * 1.2, -12, dx * 0.8, -9); ctx.stroke(); }
    for (const sx of [-1, 1]) { ctx.beginPath(); ctx.moveTo(sx * 18, -2); ctx.lineTo(sx * 13.5, -1); ctx.moveTo(sx * 18, 2); ctx.lineTo(sx * 14, 2.5); ctx.stroke(); }
  }
  if (look.pattern === 'patch' && ['dog', 'cat', 'bear', 'rabbit', 'hamster'].includes(sp)) {
    inkP(ctx, blob([[4, -16], [15, -12], [17, -1], [11, 3], [4, -3]]), dark, 0);
  }
  if (look.pattern === 'spots' || sp === 'deer') {
    ctx.fillStyle = sp === 'deer' ? '#fffaf3' : dark;
    for (const [sx2, sy2, sr] of [[-9, -11, 1.6], [-4, -13.5, 1.2], [8, -12, 1.5], [12, -7, 1.1]]) { ell(ctx, sx2, sy2, sr, sr); ctx.fill(); }
  }
  ctx.restore();

  // 주둥이
  if (['dog', 'bear', 'deer', 'cat', 'squirrel', 'fox'].includes(sp)) {
    const big = sp === 'bear' || sp === 'dog' || sp === 'deer';
    inkP(ctx, blob(big ? [[-8, 3], [0, 0.5], [8, 3], [8.5, 9], [0, 12], [-8.5, 9]] : [[-6, 3.5], [0, 1.5], [6, 3.5], [6.5, 8], [0, 10.5], [-6.5, 8]]), softFill(ctx, light, -7, 1, 7, 12, 0.1, -0.06), 0);
  }
  // 통통한 볼 (다람쥐·햄스터)
  if (sp === 'squirrel' || sp === 'hamster') {
    for (const sx of [-1, 1]) { inkP(ctx, blob([[sx * 11, 0], [sx * 19.5, 3], [sx * 17, 11], [sx * 10, 10]]), softFill(ctx, light, sx * 10, 0, sx * 19, 11, 0.1, -0.05), 0); }
  }
  // 볼터치 · 주근깨
  const strongBlush = look.mouth === 'blush' || expr === 'happy' || expr === 'talk';
  blush(ctx, -11.5, 5, strongBlush ? 5.2 : 4.4, strongBlush ? 3.4 : 2.8, strongBlush);
  blush(ctx, 11.5, 5, strongBlush ? 5.2 : 4.4, strongBlush ? 3.4 : 2.8, strongBlush);
  if (look.freckles) { ctx.fillStyle = shade(face, -0.35); for (const sx of [-1, 1]) for (const [fx, fy] of [[9.5, 2.5], [12, 3.6], [10.6, 5.6]]) { ell(ctx, sx * fx, fy, 0.65, 0.65); ctx.fill(); } }

  drawBrows(ctx, look, expr, -8.5, sp === 'sheep' ? '#8a5d3b' : shade(fur, -0.4), 6.5);
  drawEyes(ctx, look, o, t, expr, -1.5, 6.6);

  // 코
  if (sp === 'penguin') {
    inkP(ctx, blob([[-4, 2.5], [4, 2.5], [0, 7.5]]), softFill(ctx, '#f6b14a', 0, 2, 0, 8), 1.8);
