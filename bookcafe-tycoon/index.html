<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>북카페 타이쿤</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
:root {
  --bg: #fdf3ea;
  --paper: #fffaf3;
  --ink: #4a3428;
  --ink-soft: #7d6352;
  --ink-faint: #a8917f;
  --line: #5a3d2b;
  --wood: #c99a6b;
  --wood-d: #8a5d3b;
  --pink: #f9d3dc;
  --pink-d: #e58fa5;
  --mint: #d3efd6;
  --mint-d: #6fb388;
  --lav: #e3daf5;
  --lav-d: #9b87c9;
  --butter: #fcefb4;
  --butter-d: #e0b93f;
  --sky: #d6e9f7;
  --sky-d: #6fa8dc;
  --red: #e0607a;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: var(--bg); color: var(--ink);
  font-family: "Jua", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
button, input, textarea { font-family: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .5; }

/* 레트로 픽셀 느낌: 굵은 테두리 + 아래로 떨어지는 그림자 */
.px { border: 3px solid var(--line); border-radius: 10px; box-shadow: 0 4px 0 var(--line); }
.btn {
  border: 3px solid var(--line); border-radius: 10px; background: var(--butter);
  box-shadow: 0 3px 0 var(--line); padding: 6px 12px; font-weight: 800; font-size: 14px;
  transition: transform .06s;
}
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 0 0 var(--line); }
.btn.pink { background: var(--pink); }
.btn.mint { background: var(--mint); }
.btn.lav { background: var(--lav); }
.btn.sky { background: var(--sky); }
.btn.white { background: #fff; }
.btn.sm { padding: 3px 8px; font-size: 12px; border-width: 2px; box-shadow: 0 2px 0 var(--line); }
.btn.on { background: var(--mint-d); color: #fff; }

#app { position: relative; height: 100%; overflow: hidden; }

/* ── 상단 HUD (매장 위에 떠 있음) — 우드·골드·파스텔·크림 ── */
:root { --wood1: #8a5d3b; --wood2: #5a3d2b; --gold1: #f6d27a; --gold2: #c9901a; --cream: #fff8ea; --stroke: #3e2723; }
.num3d { color: #fff; font-family: "Jua", sans-serif; text-shadow: -1.5px -1.5px 0 var(--stroke), 1.5px -1.5px 0 var(--stroke), -1.5px 1.5px 0 var(--stroke), 1.5px 1.5px 0 var(--stroke), 0 3px 0 var(--stroke); letter-spacing: .3px; }
.lift { box-shadow: 0 4px 0 rgba(62,39,35,.55), 0 8px 14px rgba(62,39,35,.28); }
#hud { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 8px 12px; z-index: 5; pointer-events: none; }
#hud > * { pointer-events: auto; }
.hud-left { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
/* ① */
.party { position: relative; width: 92px; height: 92px; border-radius: 50%; padding: 0; border: 5px solid var(--gold2);
  background: radial-gradient(circle at 50% 38%, #fffbe8 0 38%, #ffd6df 39% 64%, #e8738f 65%);
  box-shadow: 0 0 0 4px var(--wood1), 0 0 0 6px var(--wood2), 0 6px 0 6px rgba(62,39,35,.45), 0 12px 18px rgba(62,39,35,.3); margin: 6px 0 0 6px; }
.party-ico { font-size: 40px; line-height: 1; display: block; margin-top: -4px; filter: drop-shadow(0 3px 0 rgba(62,39,35,.35)); animation: ring 2.4s infinite; }
@keyframes ring { 0%, 70%, 100% { transform: rotate(0); } 75% { transform: rotate(-14deg); } 85% { transform: rotate(12deg); } }
.party-rib { position: absolute; left: -14px; right: -14px; bottom: 10px; background: linear-gradient(#ff8fa8, #e0607a); border: 2px solid var(--stroke); border-radius: 6px; font-size: 12px; color: #fff; text-shadow: 0 1px 0 var(--stroke), 1px 0 0 var(--stroke), -1px 0 0 var(--stroke), 0 -1px 0 var(--stroke); }
.party .timer { position: absolute; left: 50%; bottom: -20px; transform: translateX(-50%); white-space: nowrap; }
.timer { background: linear-gradient(#ff7b6b, #d9473a); color: #fff; border: 2px solid var(--stroke); border-radius: 10px; padding: 0 7px; font-size: 11px; line-height: 17px; box-shadow: 0 2px 0 var(--stroke); }
.timer::before { content: "⏰ "; }
/* ② */
.hud-me { display: flex; align-items: center; gap: 0; cursor: pointer; margin-top: 18px; }
#hudAvatar { position: relative; z-index: 1; width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--gold2); background: radial-gradient(circle at 50% 35%, #fff 0 30%, var(--mint) 70%); box-shadow: 0 0 0 2px var(--wood2), 0 3px 0 2px rgba(62,39,35,.45); }
.me-info { display: flex; flex-direction: column; gap: 3px; margin-left: -8px; padding: 4px 10px 5px 14px; background: linear-gradient(var(--cream), #f6e6cc); border: 2px solid var(--wood2); border-radius: 0 14px 14px 0; box-shadow: 0 3px 0 rgba(62,39,35,.45), 0 6px 10px rgba(62,39,35,.2); }
.lvline { display: flex; align-items: center; gap: 6px; }
.lv { background: linear-gradient(#7fb8f0, #3f7fcf); border: 2px solid var(--stroke); border-radius: 10px; padding: 0 8px; font-size: 14px; line-height: 18px; color: #fff; text-shadow: -1px -1px 0 var(--stroke), 1px -1px 0 var(--stroke), -1px 1px 0 var(--stroke), 1px 1px 0 var(--stroke); box-shadow: 0 2px 0 var(--stroke); }
#hudName { font-size: 13px; color: var(--wood2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; display: flex; align-items: center; gap: 3px; }
.xpbar { position: relative; width: 140px; height: 14px; border: 2px solid var(--stroke); border-radius: 8px; background: #fff; overflow: hidden; }
.xpbar > div { height: 100%; background: linear-gradient(90deg, #ffd1dc, #f3a9bb 45%, #c9b8f0); border-radius: 6px; transition: width .3s; box-shadow: inset 0 3px 0 rgba(255,255,255,.6); }
#hudXpText { position: absolute; inset: 0; display: grid; place-items: center; font-size: 10px; color: var(--wood2); font-variant-numeric: tabular-nums; white-space: nowrap; }
#hudBuffs { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.buff { background: linear-gradient(var(--cream), #f3e2c7); border: 2px solid var(--wood2); border-radius: 10px; padding: 1px 8px; font-size: 11px; color: var(--wood2); white-space: nowrap; box-shadow: 0 2px 0 rgba(62,39,35,.4); }
/* ③④⑤⑥ */
.hud-cur { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: flex-end; padding-top: 4px; }
.cur { position: relative; display: flex; align-items: center; gap: 6px; height: 32px; min-width: 112px; padding: 0 4px 0 30px; margin-left: 12px;
  background: linear-gradient(#7a5136, #4a3022); border: 2px solid #2e1d14; border-radius: 18px; box-shadow: inset 0 2px 0 rgba(255,255,255,.18), 0 3px 0 rgba(62,39,35,.55), 0 6px 12px rgba(62,39,35,.25); font-size: 16px; cursor: default; }
button.cur { cursor: pointer; }
.cur > span { flex: 1; text-align: right; padding-right: 4px; color: #fff; text-shadow: -1.5px -1.5px 0 var(--stroke), 1.5px -1.5px 0 var(--stroke), -1.5px 1.5px 0 var(--stroke), 1.5px 1.5px 0 var(--stroke), 0 2px 0 var(--stroke); font-variant-numeric: tabular-nums; }
.cur .ico, .cur .ico3d { position: absolute; left: -14px; top: 50%; transform: translateY(-50%); }
.ico { display: inline-block; width: 20px; height: 20px; flex-shrink: 0; }
.cur .ico { width: 34px; height: 34px; }
.ico.coin { border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6c8 0 18%, #f8d34f 19% 58%, #d39e1d 59%); border: 2.5px solid var(--stroke); box-shadow: 0 3px 0 rgba(62,39,35,.5); }
.ico.coin::after { content: "C"; display: grid; place-items: center; height: 100%; font-size: 16px; color: #b07a14; }
.ico.gold { background: linear-gradient(180deg, #fff2b0, #f2c230 55%, #c9901a); border: 2.5px solid var(--stroke); clip-path: polygon(14% 18%, 86% 18%, 100% 86%, 0 86%); border-radius: 3px; }
.ico3d { font-style: normal; font-size: 28px; line-height: 1; filter: drop-shadow(0 3px 0 rgba(62,39,35,.45)); }
.ico.friend { border-radius: 50%; background: var(--pink); border: 2px solid var(--line); color: var(--red); font-style: normal; font-size: 12px; display: grid; place-items: center; }
.plus { width: 24px; height: 24px; flex-shrink: 0; border-radius: 50%; border: 2px solid var(--stroke); background: radial-gradient(circle at 35% 30%, #ffd59a, #f39a3c 70%); color: #fff; font-size: 18px; line-height: 1; padding: 0; display: grid; place-items: center; text-shadow: 0 1px 0 var(--stroke); box-shadow: inset 0 -2px 0 rgba(160,80,20,.4); }
.gear { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--wood2); background: var(--cream); padding: 0; font-size: 16px; box-shadow: 0 3px 0 rgba(62,39,35,.45); }
/* ⑨ */
#evcol { position: absolute; right: 12px; top: 70px; display: flex; flex-direction: column; gap: 14px; align-items: center; z-index: 4; }
.ev { position: relative; width: 58px; height: 58px; border-radius: 50%; padding: 0; border: 3px solid var(--gold2); background: radial-gradient(circle at 50% 35%, #fff 0 30%, var(--cream) 70%, #f3e2c7);
  box-shadow: 0 0 0 2px var(--wood2), 0 4px 0 2px rgba(62,39,35,.45), 0 8px 12px rgba(62,39,35,.25); }
.ev .ev-ico { font-size: 28px; line-height: 1; filter: drop-shadow(0 2px 0 rgba(62,39,35,.3)); }
.ev .ev-t { position: absolute; left: 50%; bottom: -12px; transform: translateX(-50%); white-space: nowrap; background: linear-gradient(#ff7b6b, #d9473a); color: #fff; border: 2px solid var(--stroke); border-radius: 10px; padding: 0 6px; font-size: 10.5px; line-height: 16px; font-weight: normal; box-shadow: 0 2px 0 var(--stroke); }
.ev.glow { box-shadow: 0 0 0 2px var(--wood2), 0 0 14px 4px rgba(255,214,90,.9), 0 4px 0 2px rgba(62,39,35,.45); animation: pulse 1.2s infinite; }
.ev[hidden] { display: none; }
#hudParty, #hudDeco { font-family: inherit; }
@keyframes pulse { 50% { transform: scale(1.06); } }

/* ── 매장 ── */
#stage { position: absolute; inset: 0; }
#game { display: block; width: 100%; height: 100%; touch-action: none; }
#toasts { position: absolute; top: 84px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 6; }
.toast { background: var(--paper); border: 3px solid var(--line); border-radius: 14px; padding: 6px 14px; font-weight: 800; font-size: 14px; box-shadow: 0 3px 0 var(--line); animation: rise .25s ease-out; white-space: nowrap; }
.toast.big { background: var(--butter); font-size: 16px; }
@keyframes rise { from { transform: translateY(10px); opacity: 0; } }
#hint { position: absolute; bottom: 64px; left: 50%; transform: translateX(-50%); background: rgba(74,52,40,.72); color: #fff; padding: 4px 12px; border-radius: 12px; font-size: 12px; pointer-events: none; white-space: nowrap; max-width: calc(100% - 560px); overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 1000px) { #hint { display: none; } }
body.editing #hint { display: block; bottom: 140px; max-width: calc(100% - 40px); }
#hands { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; align-items: center; background: var(--paper); border: 3px solid var(--line); border-radius: 12px; padding: 4px 10px; font-size: 13px; font-weight: 800; box-shadow: 0 3px 0 var(--line); }
#hands .slot { width: 34px; height: 34px; border: 2px dashed var(--ink-faint); border-radius: 8px; display: grid; place-items: center; font-size: 20px; }
#hands .slot.full { border: 2px solid var(--line); background: var(--butter); }

/* ── 왼쪽 세로 열: 손님 주문 · 알림 배지 ── */
#sidecol { position: absolute; left: 10px; top: 250px; bottom: 12px; width: 128px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; z-index: 4; pointer-events: none; }
#orders { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; overflow: hidden; width: 100%; padding: 4px 0 0 2px; }
.quest { position: relative; width: 58px; height: 58px; flex-shrink: 0; pointer-events: auto; cursor: default; animation: rise .25s ease-out; }
.quest .ring { position: absolute; inset: 0; border-radius: 50%; padding: 4px; background: conic-gradient(var(--mint-d) calc(var(--p) * 1turn), #efe6dc 0); border: 3px solid var(--line); box-shadow: 0 3px 0 var(--line); }
.quest.urgent .ring { background: conic-gradient(var(--red) calc(var(--p) * 1turn), #efe6dc 0); }
.quest.prep .ring { background: conic-gradient(var(--butter-d) calc(var(--p) * 1turn), #efe6dc 0); }
.quest.ready .ring { background: conic-gradient(#6fb388 calc(var(--p) * 1turn), #efe6dc 0); }
.quest canvas { width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #fff 0 30%, #fdeef2 75%); display: block; }
.quest .mini { position: absolute; left: 46px; top: -6px; min-width: 30px; height: 26px; padding: 0 6px; background: #fff; border: 2px solid var(--line); border-radius: 13px; display: flex; align-items: center; gap: 2px; font-size: 14px; font-weight: 900; white-space: nowrap; box-shadow: 0 2px 0 var(--line); }
.quest .mini::after { content: ""; position: absolute; left: -6px; bottom: 3px; border: 5px solid transparent; border-right-color: var(--line); border-left: 0; }
.quest .mini small { font-size: 10px; color: var(--ink-soft); }
.quest.clickable { cursor: pointer; }
.quest .ring { background: conic-gradient(#b49be0 calc(var(--p, 0) * 1turn), #efe6dc 0); }
.quest.qready .ring { background: conic-gradient(#f2c230 1turn, #f2c230 0); animation: pulse 1s infinite; }
.quest .mini .get { font-size: 11px; color: #c0392b; }
.quest.qhead { width: 58px; height: 58px; margin-bottom: 14px; }
.quest.qhead .mini { display: none; }
.quest.qhead .emo { font-size: 30px; background: radial-gradient(circle at 50% 40%, #fffdf6, #f3e2c7); }
.quest .ring { border-color: var(--wood2); box-shadow: 0 0 0 2px var(--gold2), 0 4px 0 2px rgba(62,39,35,.4); }
.quest .newb { position: absolute; top: -8px; right: -8px; z-index: 2; background: radial-gradient(circle at 35% 30%, #ffb35c, #f07a1c); color: #fff; border: 2px solid var(--stroke); border-radius: 50%; width: 30px; height: 30px; display: grid; place-items: center; font-size: 10px; transform: rotate(-14deg); animation: pulse 1.2s infinite; }
.quest .qlabel { position: absolute; left: 50%; bottom: -14px; transform: translateX(-50%); white-space: nowrap; font-size: 11px; color: #fff; text-shadow: -1px -1px 0 var(--stroke), 1px -1px 0 var(--stroke), -1px 1px 0 var(--stroke), 1px 1px 0 var(--stroke); }
.quest.note .ring { background: var(--butter); }
.quest.note canvas, .quest .emo { display: grid; place-items: center; font-size: 26px; width: 100%; height: 100%; border-radius: 50%; background: #fffaf3; }
.surf { pointer-events: auto; width: 86px; padding: 6px 4px 5px; border: 3px solid var(--wood2); border-radius: 18px; background: linear-gradient(#ffc483, #f39a3c); box-shadow: inset 0 0 0 3px rgba(255,255,255,.4), 0 4px 0 rgba(62,39,35,.55), 0 8px 14px rgba(62,39,35,.28); display: flex; flex-direction: column; align-items: center; gap: 0; position: relative; }
.surf .surf-ico { font-size: 28px; line-height: 1.1; position: relative; }
.surf .surf-ico i { position: absolute; right: -10px; top: -6px; font-size: 14px; font-style: normal; animation: pulse 1.2s infinite; }
.surf b { font-size: 14px; color: #fff; text-shadow: -1px -1px 0 var(--stroke), 1px -1px 0 var(--stroke), -1px 1px 0 var(--stroke), 1px 1px 0 var(--stroke), 0 2px 0 var(--stroke); }

/* ── 오른쪽 아래 독: 꾸미기 · 독서 클럽 · MENU ── */
#dock { position: absolute; right: 12px; bottom: 12px; display: flex; align-items: flex-end; gap: 8px; z-index: 5; }
.dock-btn { position: relative; width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--gold2); background: radial-gradient(circle at 40% 30%, #fff, var(--sky) 75%); box-shadow: 0 0 0 2px var(--wood2), 0 4px 0 2px rgba(62,39,35,.45), 0 8px 12px rgba(62,39,35,.25); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; line-height: 1.1; padding: 0; }
.dock-btn:nth-child(2) { background: radial-gradient(circle at 40% 30%, #fff, var(--lav) 75%); }
.dock-btn span { font-size: 24px; line-height: 1.05; }
.dock-btn.on { background: var(--mint); }
.dock-btn[hidden] { display: none; }
#btnFloor { background: radial-gradient(circle at 40% 30%, #fff, var(--butter) 75%); }
.dock-col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
/* 엔틱 종이 프레임 MENU */
.menu-big { position: relative; width: 92px; height: 104px; border-radius: 10px 10px 14px 14px; border: 3px solid var(--wood2); padding: 0;
  background: radial-gradient(circle at 50% 40%, #fffdf6, #f6ead2 70%, #e9d6b2);
  box-shadow: inset 0 0 0 3px #fffaf0, inset 0 0 0 5px #c9a26b, 0 5px 0 rgba(62,39,35,.55), 0 10px 16px rgba(62,39,35,.3);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; color: var(--wood2); }
.menu-big::before, .menu-big::after { content: "❦"; position: absolute; top: 4px; font-size: 13px; color: #b0844f; }
.menu-big::before { left: 7px; } .menu-big::after { right: 7px; transform: scaleX(-1); }
.menu-big .mb-ico { font-size: 34px; line-height: 1; filter: drop-shadow(0 2px 0 rgba(90,61,43,.3)); }
.menu-big b { font-size: 21px; letter-spacing: 1px; color: var(--wood2); text-shadow: 0 2px 0 #fff; }
.menu-big small { font-size: 9px; color: #a8875a; margin-top: -2px; }
.menu-big .new { position: absolute; top: -12px; left: -12px; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ffb35c, #f07a1c); color: #fff; border: 2px solid var(--stroke); font-size: 11px; font-style: normal; transform: rotate(-16deg);
  text-shadow: 0 1px 0 var(--stroke); box-shadow: 0 3px 0 rgba(62,39,35,.5); animation: pulse 1.2s infinite; }
/* 1F / 2F 복층 이동 배지 (지붕 모양) */
.floor-badge { position: relative; width: 70px; height: 78px; padding: 18px 0 4px; border: 3px solid var(--wood2); border-radius: 0 0 12px 12px;
  background: linear-gradient(#fff8ea, #f3e2c7); box-shadow: 0 4px 0 rgba(62,39,35,.55), 0 8px 12px rgba(62,39,35,.25); display: flex; flex-direction: column; align-items: center; gap: 3px; }
.floor-badge::before { content: ""; position: absolute; left: -9px; right: -9px; top: -20px; height: 26px; background: linear-gradient(#e0815a, #b85a38); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.floor-badge span { width: 48px; border-radius: 8px; font-size: 15px; line-height: 21px; border: 2px solid var(--wood2); background: #e9dcc6; color: #a8917f; }
.floor-badge span.on { background: linear-gradient(#ffb35c, #f07a1c); color: #fff; text-shadow: 0 1px 0 var(--stroke); box-shadow: 0 2px 0 rgba(62,39,35,.5); }
.floor-badge span.lock { font-size: 10px; }
.menu-big .new[hidden] { display: none; }
#menuSheet { position: absolute; right: 118px; bottom: 12px; display: grid; grid-template-columns: repeat(2, 108px); gap: 8px; padding: 10px; background: var(--paper); border: 3px solid var(--line); border-radius: 18px; box-shadow: 0 4px 0 var(--line); z-index: 6; animation: rise .15s; }
#menuSheet[hidden] { display: none; }
#menuSheet button { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; background: #fff; border: 3px solid var(--line); border-radius: 12px; box-shadow: 0 3px 0 var(--line); padding: 6px 4px; font-size: 12px; font-weight: 800; }
#menuSheet button span { font-size: 22px; line-height: 1; }
#menu .dot, #evcol .dot { position: absolute; top: -6px; right: -6px; background: var(--red); color: #fff; border: 2px solid var(--stroke); border-radius: 10px; font-size: 11px; padding: 0 5px; font-style: normal; z-index: 2; }
body.editing #sidecol, body.editing #dock, body.editing #menuSheet, body.editing #hands, body.editing #evcol { display: none; }

/* 인테리어 편집 바 */
#editbar { position: absolute; left: 0; right: 0; bottom: 0; background: var(--paper); border-top: 3px solid var(--line); padding: 8px 10px; display: flex; gap: 10px; align-items: center; z-index: 4; }
#editbar[hidden] { display: none; }
#invList { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
#editTools { display: grid !important; grid-template-columns: 1fr 1fr; }
.inv { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; width: 74px; padding: 4px; background: #fff; border: 2px solid var(--line); border-radius: 10px; font-size: 11px; font-weight: 700; }
.inv.sel { background: var(--mint); }
.inv canvas { width: 54px; height: 44px; }
.inv b { font-size: 10px; color: var(--ink-soft); }
#editTools { display: flex; flex-direction: column; gap: 6px; }

/* ── 모달 ── */
.overlay { position: fixed; inset: 0; background: rgba(74,52,40,.45); display: grid; place-items: center; z-index: 20; padding: 12px; animation: fade .15s; }
@keyframes fade { from { opacity: 0; } }
.modal { background: var(--paper); border: 4px solid var(--line); border-radius: 18px; box-shadow: 0 6px 0 var(--line); width: min(560px, 100%); max-height: calc(100vh - 24px); display: flex; flex-direction: column; animation: rise .2s; }
.modal.wide { width: min(860px, 100%); }
.modal header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--pink); border-bottom: 3px solid var(--line); border-radius: 13px 13px 0 0; }
.modal header h2 { margin: 0; font-size: 17px; flex: 1; }
.modal .x { border: 2px solid var(--line); background: #fff; border-radius: 8px; width: 30px; height: 30px; font-weight: 900; }
.modal .body { padding: 14px; overflow-y: auto; }
.modal .foot { padding: 10px 14px; border-top: 2px dashed var(--ink-faint); display: flex; gap: 8px; justify-content: flex-end; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.tabs button { border: 2px solid var(--line); background: #fff; border-radius: 10px; padding: 4px 10px; font-weight: 800; font-size: 13px; }
.tabs button.on { background: var(--butter); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.card { background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.card.lock { background: #f1ebe4; color: var(--ink-faint); }
.card .t { font-weight: 900; }
.muted { color: var(--ink-soft); font-size: 12px; }
.price { display: inline-flex; align-items: center; gap: 4px; font-weight: 900; }
.price .ico { width: 14px; height: 14px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.input { width: 100%; border: 3px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 15px; background: #fff; -webkit-user-select: text; user-select: text; }
textarea.input { resize: vertical; min-height: 60px; }
.progress { height: 14px; border: 2px solid var(--line); border-radius: 8px; background: #fff; overflow: hidden; }
.progress > div { height: 100%; background: repeating-linear-gradient(45deg, var(--mint-d) 0 8px, #8cc8a0 8px 16px); }
.chip { display: inline-block; padding: 1px 8px; border-radius: 10px; border: 2px solid var(--line); font-size: 11px; font-weight: 800; background: var(--lav); }
.portrait { width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--line); background: var(--mint); flex-shrink: 0; }
.list { display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; gap: 10px; align-items: center; background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 8px; }
.item .grow { flex: 1; min-width: 0; }
.speech { background: #fff; border: 3px solid var(--line); border-radius: 14px; padding: 10px 12px; position: relative; font-size: 15px; line-height: 1.5; }
.speech::before { content: ""; position: absolute; left: -12px; top: 18px; border: 8px solid transparent; border-right-color: var(--line); }
.books { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.book { display: flex; gap: 8px; align-items: center; text-align: left; border: 3px solid var(--line); border-radius: 10px; background: #fff; padding: 8px; font-weight: 800; box-shadow: 0 3px 0 var(--line); }
.book i { width: 26px; height: 36px; border: 2px solid var(--line); border-radius: 3px 6px 6px 3px; flex-shrink: 0; }
.book.gone { opacity: .25; pointer-events: none; }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 6px; }
.opt { border: 2px solid var(--line); background: #fff; border-radius: 10px; padding: 6px 4px; font-size: 12px; font-weight: 800; }
.opt.on { background: var(--mint); box-shadow: inset 0 0 0 2px var(--mint-d); }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(66px, 1fr)); gap: 6px; max-height: 260px; overflow-y: auto; padding: 2px; }
.thumb { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 2px; font-size: 11px; line-height: 1.15; }
.thumb canvas { width: 52px; height: 52px; border-radius: 8px; background: #f6efe2; }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.swatch { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--line); padding: 0; }
.swatch.on { box-shadow: 0 0 0 3px var(--mint-d); }
.center { text-align: center; }
.gift { font-size: 64px; animation: bounce 1s infinite; display: inline-block; }
@keyframes bounce { 50% { transform: translateY(-8px) rotate(-4deg); } }
table.menu { width: 100%; border-collapse: collapse; font-size: 13px; }
table.menu td, table.menu th { padding: 6px 4px; border-bottom: 1px dashed var(--ink-faint); text-align: left; }
table.menu tr.lock { color: var(--ink-faint); }

/* 커피 직접 내리기 미니게임 */
.brew-steps { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.brew-steps span { padding: 3px 10px; border: 2px solid var(--line); border-radius: 12px; font-size: 12px; font-weight: 800; background: #fff; }
.brew-steps span.now { background: var(--butter); }
.brew-help { background: #fff; border: 2px dashed var(--ink-faint); border-radius: 12px; padding: 8px 12px; font-size: 14px; }
.brew-stage { display: flex; flex-direction: column; align-items: center; gap: 12px; position: relative; min-height: 300px; }
.big-icon { font-size: 54px; line-height: 1; }
.readout { font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; }
.gauge { position: relative; width: 100%; max-width: 520px; height: 40px; border: 3px solid var(--line); border-radius: 12px; background: #fff; overflow: hidden; }
.gauge .zone { position: absolute; top: 0; bottom: 0; background: rgba(111,179,136,.35); }
.gauge .pz { background: rgba(229,143,165,.75); }
.gauge .fill { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #8a5d3b, #c99a6b); opacity: .55; }
.gauge .needle { position: absolute; top: 0; bottom: 0; width: 5px; margin-left: -2px; background: var(--line); border-radius: 3px; }
.gauge .tick { position: absolute; top: 2px; font-size: 10px; color: var(--ink-soft); transform: translateX(-50%); }
.btn.big { font-size: 22px; padding: 10px 34px; }
.judge { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 46px; font-weight: 900; -webkit-text-stroke: 2px var(--line); animation: judge .9s ease-out forwards; pointer-events: none; white-space: nowrap; }
@keyframes judge { 0% { transform: translate(-50%, -50%) scale(.3); opacity: 0; } 25% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } 70% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -80%) scale(1); opacity: 0; } }
.tamp-wrap { display: flex; gap: 18px; align-items: stretch; }
.tamp-track { position: relative; width: 110px; height: 230px; border: 3px solid var(--line); border-radius: 14px; background: linear-gradient(#fdf0f2, #fff); touch-action: none; }
.tamp-track .band { position: absolute; left: 0; right: 0; background: rgba(111,179,136,.35); border-top: 2px dashed var(--mint-d); border-bottom: 2px dashed var(--mint-d); }
.tamp-track .pline { position: absolute; left: 0; right: 0; height: 4px; margin-top: -2px; background: var(--pink-d); }
.tamp-handle { position: absolute; left: 50%; transform: translateX(-50%); width: 76px; height: 46px; border: 3px solid var(--line); border-radius: 10px 10px 4px 4px; background: linear-gradient(#e9e4ef, #b9b4c2); cursor: grab; touch-action: none; display: grid; place-items: center; font-size: 12px; font-weight: 900; }
.tamp-handle:active { cursor: grabbing; }
.basket { position: absolute; left: 10px; right: 10px; bottom: 6px; height: 26px; border: 3px solid var(--line); border-top: none; border-radius: 0 0 14px 14px; background: #6b3f22; }
.thermo { position: relative; width: 46px; height: 230px; border: 3px solid var(--line); border-radius: 23px; background: #fff; overflow: hidden; }
.thermo .zone { position: absolute; left: 0; right: 0; background: rgba(111,179,136,.35); }
.thermo .pz { background: rgba(229,143,165,.7); }
.thermo .merc { position: absolute; left: 10px; right: 10px; bottom: 6px; border-radius: 10px; background: linear-gradient(#e0607a, #f08f7a); }
.pour-wrap { display: flex; gap: 22px; align-items: flex-end; }
.pour-cup { position: relative; width: 130px; height: 230px; border: 3px solid var(--line); border-top-width: 2px; border-radius: 6px 6px 22px 22px; background: rgba(214,233,247,.45); overflow: hidden; }
.pour-cup .lay { position: absolute; left: 0; right: 0; }
.pour-cup .line { position: absolute; left: -2px; right: -2px; border-top: 2px dashed var(--line); }
.pour-cup .line i { position: absolute; right: 4px; top: -18px; font-style: normal; font-size: 11px; font-weight: 900; background: #fffaf3; padding: 0 4px; border-radius: 6px; }
.bottles { display: flex; flex-direction: column; gap: 10px; }
.bottle { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border: 3px solid var(--line); border-radius: 12px; background: #fff; box-shadow: 0 3px 0 var(--line); font-weight: 800; font-size: 13px; cursor: grab; touch-action: none; }
.bottle span { font-size: 26px; }
.bottle-ghost { position: fixed; z-index: 60; font-size: 42px; pointer-events: none; transform: translate(-50%, -70%) rotate(-35deg); transition: transform .1s; }
.bottle-ghost.pouring { transform: translate(-50%, -70%) rotate(-120deg); }
.result-row { display: flex; justify-content: space-between; gap: 10px; padding: 6px 12px; background: #fff; border: 2px solid var(--line); border-radius: 10px; font-weight: 800; }

/* 뱃지 */
.medal { --tier: #e3a873; position: relative; width: 56px; height: 56px; flex-shrink: 0; border-radius: 50%; display: grid; place-items: center; font-size: 26px;
  border: 3px solid var(--line); background: radial-gradient(circle at 35% 30%, #fff 0 16%, var(--tier) 62%); box-shadow: inset 0 0 0 4px rgba(255,255,255,.55), 0 3px 0 var(--line); }
.medal.rainbow { background: radial-gradient(circle at 35% 30%, #fff 0 14%, transparent 40%), conic-gradient(#f9a8b8, #fcefb4, #b5e8c1, #b8dcf5, #d5c6f2, #f9a8b8); }
.medal.locked { filter: grayscale(1); opacity: .4; }
.medal.sm { width: 22px; height: 22px; font-size: 12px; border-width: 2px; box-shadow: inset 0 0 0 2px rgba(255,255,255,.55); }
.badge-card { display: flex; gap: 10px; align-items: center; background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 8px; }
.badge-card.on { background: var(--butter); }
.badge-card.locked { background: #f6f1eb; }
.badge-card .grow { flex: 1; min-width: 0; font-size: 12px; }
.tier { font-size: 10px; font-weight: 900; padding: 0 6px; border-radius: 8px; border: 1.5px solid var(--line); }
.hud-me { cursor: pointer; }
#hudName { display: flex; align-items: center; gap: 4px; }

/* 투표: 아바타 3초 미리보기 */
.peeking { animation: peekring 3s linear forwards; }
@keyframes peekring { from { box-shadow: 0 0 0 0 var(--pink-d); } to { box-shadow: 0 0 0 5px var(--pink-d); } }
.peek { position: fixed; z-index: 40; width: 296px; padding: 6px; background: var(--paper); border: 3px solid var(--line); border-radius: 14px; box-shadow: 0 5px 0 var(--line); pointer-events: none; animation: rise .2s; }
.peek-cap { padding: 6px 4px 2px; font-size: 13px; }

/* 레시피 배우기 */
.train { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.scene { position: relative; height: 230px; border: 3px solid var(--line); border-radius: 14px; overflow: hidden;
  background: linear-gradient(180deg, #fdf0f2 0 62%, #c99a6b 62% 64%, #e3c39d 64%); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 26px; }
.scene::before { content: ""; position: absolute; inset: 0 0 38% 0; background: repeating-linear-gradient(90deg, transparent 0 22px, rgba(249,219,227,.8) 22px 34px); }
.vessel { position: relative; width: 96px; height: 120px; border: 3px solid var(--line); border-top-width: 2px; border-radius: 4px 4px 22px 22px;
  background: rgba(255,255,255,.75); display: flex; flex-direction: column-reverse; overflow: hidden; transition: opacity .3s; }
.vessel.cup { width: 84px; height: 140px; border-radius: 4px 4px 14px 14px; background: rgba(214,233,247,.55); }
.vessel.ghost { opacity: .25; border-style: dashed; }
.vessel .layer { width: 100%; transition: height .5s ease-out; border-top: 1px solid rgba(0,0,0,.08); }
.mugwrap { position: relative; }
.mugwrap .handle { position: absolute; right: -26px; top: 26px; width: 26px; height: 46px; border: 3px solid var(--line); border-left: none; border-radius: 0 20px 20px 0; }
.mugwrap .tops { position: absolute; left: 0; right: 0; top: -6px; text-align: center; font-size: 22px; letter-spacing: -4px; }
.plate { position: relative; width: 170px; height: 34px; border: 3px solid var(--line); border-radius: 50%; background: #fff; }
.plate .food { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); font-size: 64px; line-height: 1; }
.plate .tops { position: absolute; left: 0; right: 0; bottom: 70px; text-align: center; font-size: 22px; }
.plate.ghost { opacity: .3; border-style: dashed; }
.fx { position: absolute; top: 18px; left: 50%; font-size: 46px; animation: fxpop .8s ease-out forwards; pointer-events: none; }
@keyframes fxpop { from { transform: translate(-50%, 20px) scale(.6); opacity: 0; } 30% { opacity: 1; transform: translate(-50%, 0) scale(1.15); } to { transform: translate(-50%, -16px) scale(1); opacity: 0; } }
.recipe { list-style: none; margin: 0; padding: 10px; background: #fff; border: 2px solid var(--line); border-radius: 12px; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.recipe li.done { color: var(--ink-faint); text-decoration: line-through; }
.recipe li.now { font-weight: 900; color: var(--pink-d); }
.tools { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; margin-top: 12px; }
.tool { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; border: 3px solid var(--line); border-radius: 12px; background: #fff; box-shadow: 0 3px 0 var(--line); font-size: 12px; font-weight: 800; }
.tool span { font-size: 26px; line-height: 1; }
.tool:active { transform: translateY(3px); box-shadow: none; }
.tool.hint { background: var(--butter); animation: pulse .8s infinite; }
.tool.shake { animation: shake .3s; background: #fbd0d8; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
@media (max-width: 640px) { .train { grid-template-columns: 1fr; } }

@media (max-width: 720px) {
  #hud { padding: 4px 6px; gap: 4px; }
  .party { width: 62px; height: 62px; border-width: 4px; }
  .party-ico { font-size: 26px; }
  .party-rib { font-size: 9px; bottom: 6px; }
  .hud-me { margin-top: 14px; }
  #hudName { display: none; }
  .xpbar { width: 84px; }
  #hudBuffs { display: none; }
  .hud-cur { gap: 4px; max-width: 60%; }
  .cur { min-width: 0; height: 26px; font-size: 13px; padding-left: 22px; margin-left: 8px; }
  .cur .ico { width: 26px; height: 26px; } .ico3d { font-size: 22px; }
  .plus { width: 20px; height: 20px; font-size: 14px; }
  #evcol { top: 120px; gap: 12px; } .ev { width: 46px; height: 46px; } .ev .ev-ico { font-size: 22px; }
  #hint { display: none; }
  #sidecol { top: 200px; }
  .quest { width: 46px; height: 46px; }
  .quest .mini { left: 36px; height: 22px; font-size: 12px; }
  .surf { width: 70px; }
  #dock { right: 6px; bottom: 6px; gap: 5px; }
  .dock-btn { width: 50px; height: 50px; font-size: 9px; }
  .dock-btn span { font-size: 19px; }
  .menu-big .new { width: 30px; height: 30px; font-size: 9px; top: -8px; left: -8px; }
  .menu-big { width: 72px; height: 82px; } .menu-big .mb-ico { font-size: 26px; } .menu-big b { font-size: 16px; }
  .floor-badge { width: 56px; height: 64px; } .floor-badge span { width: 40px; font-size: 12px; line-height: 17px; }
  #menuSheet { right: 6px; bottom: 170px; grid-template-columns: repeat(2, 96px); }
  #hands { left: 8px; transform: none; bottom: 76px; }
}
</style>
</head>
<body>
<div id="app">
  <main id="stage">
    <canvas id="game"></canvas>
    <div id="toasts"></div>
    <div id="hint">손님 주문 → 커피머신/음료 바/쇼케이스 클릭 → 완성품 클릭해서 들기 → 손님 클릭해서 제공 → 빈 접시 치우기</div>
    <div id="hands"><span>손</span><div class="slot" id="hand0"></div><div class="slot" id="hand1"></div></div>
    <div id="editbar" hidden>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px"><div id="decoLine" class="muted" style="font-weight:800"></div><div id="invList"></div></div>
      <div id="editTools">
        <button class="btn sm lav" id="btnExpand">📐 카페 확장</button>
        <button class="btn sm sky" id="btnRotate">↻ 회전 (R)</button>
        <button class="btn sm pink" id="btnStore">📦 수거 (Del)</button>
        <button class="btn sm white" id="btnSell">💰 판매</button>
        <button class="btn sm white" id="btnColors">🎨 벽·바닥 색</button>
        <button class="btn sm mint" id="btnEditDone">✓ 편집 완료</button>
      </div>
    </div>
  </main>

  <!-- 상단 HUD -->
  <header id="hud">
    <div class="hud-left">
      <!-- ① 메인 이벤트 배지 -->
      <button id="hudParty" class="party" title="북스테어 파티 — 주간 인기투표">
        <span class="party-ico">🔔</span><span class="party-rib">BOOK PARTY</span><span id="hudTimer" class="timer">-</span>
      </button>
      <!-- ② 레벨 & 경험치 -->
      <div class="hud-me" title="내 뱃지 보기">
        <canvas id="hudAvatar" width="112" height="112"></canvas>
        <div class="me-info">
          <div class="lvline"><span id="hudLevel" class="lv">Lv.1</span><span id="hudName">점장</span></div>
          <div class="xpbar" title="경험치는 일일 퀘스트로만 쌓여요"><div id="hudXp" style="width:0"></div><span id="hudXpText"></span></div>
        </div>
      </div>
      <div id="hudBuffs"></div>
    </div>
    <!-- ③④⑤⑥ 재화 -->
    <div class="hud-cur">
      <button class="cur" id="hudDeco" title="꾸미기 점수 — 눌러서 효과 보기"><i class="ico3d">🎨</i><span id="hudDecoN">0</span></button>
      <span class="cur" title="우정 포인트 — 친구 돕기·방명록"><i class="ico3d">🎀</i><span id="hudFriend">0</span><button class="plus" data-plus="friend" title="친구 · 방명록">+</button></span>
      <span class="cur" title="코인 — 기본 가구·알바·확장"><i class="ico coin"></i><span id="hudCoins">0</span><button class="plus" data-plus="coin" title="상점">+</button></span>
      <span class="cur" title="금 — 고급·특별 가구"><i class="ico gold"></i><span id="hudGold">0</span><button class="plus" data-plus="gold" title="금 모으는 법">+</button></span>
      <button class="gear" id="btnSettings" title="설정">⚙️</button>
    </div>
  </header>

  <!-- ⑨ 오른쪽 이벤트 열 -->
  <aside id="evcol">
    <button class="ev" id="evQuest" title="일일 퀘스트"><span class="ev-ico">🎁</span><b class="ev-t" id="evQuestT">-</b></button>
    <button class="ev" id="hudEvent" title="주간 인기투표"><span class="ev-ico">🗳️</span><b class="ev-t" id="evVoteT">-</b></button>
    <button class="ev" id="evGuild" title="독서 클럽 주간 목표"><span class="ev-ico">🏰</span><b class="ev-t" id="evGuildT">-</b></button>
    <button class="ev" id="btnBigPlus" title="카페 확장"><span class="ev-ico">📐</span><b class="ev-t" id="evExpT">확장</b></button>
  </aside>

  <nav id="menu">
    <!-- 왼쪽 세로 열: 손님 주문·알림 배지 + 파도타기 -->
    <aside id="sidecol">
      <div id="orders"></div>
      <!-- ⑧ 친구들 -->
      <button class="surf" data-act="friends" title="친구 · 방명록 · 파도타기"><span class="surf-ico">👫<i>💗</i></span><b>친구들</b></button>
    </aside>
    <!-- 오른쪽 아래: 꾸미기 · 독서 클럽 · MENU -->
    <div id="dock">
      <button class="dock-btn" data-act="edit" title="배치 · 확장"><span>🔨</span>꾸미기</button>
      <button class="dock-btn" data-act="guild" title="독서 클럽 아지트"><span>🏰</span>독서 클럽</button>
      <div class="dock-col">
        <!-- 1F / 2F 복층 이동 -->
        <button class="floor-badge" data-act="floor" id="btnFloor" title="층 이동"><span class="f2">2F</span><span class="f1">1F</span></button>
        <button class="menu-big" data-act="menu" title="전체 메뉴"><span class="mb-ico">📖</span><b>MENU</b><small>BookStair</small><i class="new" hidden>NEW</i></button>

function currentSeason(d = new Date()) {
  const m = d.getMonth() + 1;
  return m >= 3 && m <= 5 ? 'spring' : m >= 6 && m <= 8 ? 'summer' : m >= 9 && m <= 11 ? 'autumn' : 'winter';
}

let S = defaultState();

function loadState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    const base = defaultState();
    S = { ...base, ...d };
    for (const k of ['avatar', 'grid', 'stats', 'daily', 'vote', 'surface', 'surfaceColor']) S[k] = { ...base[k], ...(d[k] || {}) };
    if (!Array.isArray(S.layout)) S.layout = base.layout;
    S.layout = S.layout.filter((p) => FURN[p.id]);
    S.avatar = migrateAvatar(S.avatar);
    // 로스터가 생기기 전 세이브: 하나 선물
    if (!d.gotRoaster) { S.gotRoaster = true; if (!S.layout.some((q) => FURN[q.id].kind === 'roaster')) S.inventory.classic_roaster = (S.inventory.classic_roaster || 0) + 1; }
    // 레시피 배우기가 생기기 전 세이브: 이미 열린 메뉴는 배운 것으로
    if (!Array.isArray(d.learned)) S.learned = MENU.filter((m) => m.level <= S.level).map((m) => m.id);
  } catch (e) {
    console.warn('세이브를 읽지 못했어요', e);
    S = defaultState();
  }
}
function saveState() {
  if (LOADED !== (S.floor || 1)) return withFloor(S.floor || 1, saveState);
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(S));
  } catch (e) { /* 저장 공간 부족 등 — 무시 */ }
}

/** 날짜가 바뀌면 하루 제한(일손 돕기·방명록 보상·힌트 요청) 초기화 */
function ensureDaily() {
  const today = dayKey();
  if (S.daily.date !== today) S.daily = { date: today, helps: 0, gbRewarded: [], hints: 0, helped: [] };
}

/* ── 2층 독서 라운지 — Lv.50부터, 6×6에서 시작해 10레벨마다 한 칸씩 넓어진다 ── */
const FLOOR2_LEVEL = 50;
const floor2Size = () => Math.min(11, 6 + Math.floor(Math.max(0, S.level - FLOOR2_LEVEL) / 10));
const onFloor2 = () => LOADED === 2; // 지금 올려 둔 층 (그리기 중엔 = 보고 있는 층)
function floor2Layout() {
  let n = 0;
  const p = (id, x, y, rot = 0) => ({ uid: 'f2u' + ++n, id, x, y, rot });
  return [
    p('provence_shelfWall', 0, 0), p('provence_stand', 2, 0), p('provence_plant', 5, 0),
    p('provence_table', 3, 3), p('provence_chair', 2, 3), p('provence_chair', 4, 3),
    p('provence_pendant', 3, 3), p('deco_rug', 2, 1),
  ];
}
/* 층 동시 운영: 층마다 배치(S)와 영업 상태(W)를 따로 들고, 매 프레임 두 층 모두 돌린다.
 * "올려 둔 층(LOADED)"의 것만 S·W 에 꺼내 두고, 나머지는 S.floors(저장) · FLOOR_RT(실행 중) 에 보관한다. */
const CTX_S = ['layout', 'grid', 'surface', 'surfaceColor'];
const CTX_W = ['customers', 'staff', 'rep', 'repNext', 'dirty', 'stations', 'roast', 'occ', 'seats', 'spawnIn', 'browseIn', 'popups', 'particles'];
const FLOOR_RT = {};
let LOADED = 1;
const freshRuntime = () => ({ customers: [], staff: [], rep: null, repNext: 120, dirty: {}, stations: {}, roast: {}, occ: [], seats: [], spawnIn: 2, browseIn: 4, popups: [], particles: [], fresh: true });
const otherFloor = () => (LOADED === 1 ? 2 : 1);
const hasFloor = (n) => n === LOADED || Boolean(S.floors[n]);
/** 다른 층을 S·W 에 올린다 (화면은 그대로) */
function swapTo(n) {
  if (LOADED === n || !S.floors[n]) return;
  S.floors[LOADED] = Object.fromEntries(CTX_S.map((k) => [k, S[k]]));
  FLOOR_RT[LOADED] = Object.fromEntries(CTX_W.map((k) => [k, W[k]]));
  const sp = S.floors[n];
  delete S.floors[n];
  for (const k of CTX_S) S[k] = sp[k];
  const rt = FLOOR_RT[n] || freshRuntime();
  delete FLOOR_RT[n];
  for (const k of CTX_W) W[k] = rt[k];
  LOADED = n;
  if (rt.fresh) rebuildWorld();
}
/** 잠깐 다른 층을 올려 fn 을 돌리고 되돌린다 (점장은 보고 있는 층에만 있다) */
function withFloor(n, fn) {
  if (LOADED === n) return fn();
  if (!S.floors[n]) return undefined;
  const prev = LOADED, pl = W.player;
  swapTo(n);
  W.player = null;
  try { return fn(); } finally { W.player = pl; swapTo(prev); }
}
/** Lv.50이 되면 2층이 생겨서 바로 영업을 시작한다 */
function ensureFloor2() {
  if (S.level < FLOOR2_LEVEL || hasFloor(2)) return;
  const sz = floor2Size();
  S.floors[2] = { layout: floor2Layout(), grid: { cols: sz, rows: sz }, surface: { wall: 'provence_wallpaper', floor: null }, surfaceColor: { wall: null, floor: null } };
}
/** 보는 층 바꾸기 — 두 층 모두 계속 영업 중 */
function switchFloor(n) {
  if (LOADED === n) return;
  if (n === 2 && S.level < FLOOR2_LEVEL) return toast(`🪜 2층은 Lv.${FLOOR2_LEVEL}부터 열려요`);
  ensureFloor2();
  if (UI.edit) setEdit(false);
  swapTo(n);
  S.floor = n;
  const pl = W.player;
  pl.task = null; pl.path = [];
  placeNearDoor(pl);
  growFloor2(false);
  BG.key = '';
  const waiting = withFloor(otherFloor(), () => W.customers.filter((c) => c.state === 'wait').length) || 0;
  toast(n === 2 ? `🪜 2층 독서 라운지 (${S.grid.cols}×${S.grid.rows}) — 1층은 알바들이 계속 영업 중${waiting ? ` (대기 손님 ${waiting}명)` : ''}` : `🏠 1층 카페 — 2층 라운지도 계속 손님을 받아요`, true);
  saveState();
}
/** 레벨이 오르면 2층이 자동으로 넓어진다 */
function growFloor2(announce = true) {
  ensureFloor2();
  withFloor(2, () => {
    const sz = floor2Size();
    if (S.grid.cols >= sz) return;
    S.grid = { cols: sz, rows: sz };
    rebuildWorld();
    BG.key = '';
    if (announce) toast(`🪜 2층 라운지가 ${sz}×${sz}로 넓어졌어요!`, true);
  });
}
/* 2층 손님: 빈 의자에 앉아 책을 읽고, 일어날 때 이용료를 낸다 */
function spawnLoungeGuest() {
  const seats = freeSeats();
  if (!seats.length) return;
  const d = door();
  for (const seat of shuffle(seats)) {
    const path = findPath(d, (x, y) => x === seat.x && y === seat.y, true);
    if (!path) continue;
    const c = makeActor('customer', lookFromSeed(Math.random() * 1e9), d);
    c.speed = 2;
    c.state = 'lounge';
    c.seatUid = seat.uid;
    c.read = 14 + Math.random() * 10;
    setPath(c, path);
    W.customers.push(c);
    return;
  }
}
function updateLoungeGuest(c, dt) {
  if (c.state === 'lounge') {
    if (moveActor(c, dt)) { const seat = seatOf(c); if (!seat) return leaveCafe(c, false); c.state = 'read'; c.reading = true; c.x = seat.x + 0.5; c.y = seat.y + 0.5; c.facing = seat.table.x >= seat.x ? 1 : -1; }
    return;
  }
  c.read -= dt;
  if (c.read > 0) return;
  c.reading = false;
  const coins = 18 + Math.round(S.level * 0.6) + Math.round(ambience() / 40);
  S.coins += coins;
  S.stats.earned += coins;
  questEvent('coins', coins);
  addPopup(c.x, c.y, `📖 이용료 +${coins}`, '#9b87c9');
  say(c, pick(['좋은 책 잘 읽었어요!', '여기 너무 조용하고 좋아요', '또 읽으러 올게요 ☺']), 2.4);
  leaveCafe(c, false);
}

/* ── 일일 퀘스트 — 레벨업 경험치는 오직 여기서 ──
 * 하루 6개 · 왼쪽 열에 3개씩 · 다 받으면 보너스 상자. 보상 경험치는 그날 아침 레벨 기준.
 */
const QUEST_PER_DAY = 6;
const QUEST_SLOTS = 3;
const hasKind = (k) => S.layout.some((p) => defOf(p).kind === k);
const QUEST_DEFS = {
  serve: { icon: '☕', text: (q) => `손님 ${q.target}명에게 내기`, target: (lv) => 4 + Math.floor(lv / 4) },

  clean: { icon: '🧽', text: (q) => `빈 테이블 ${q.target}번 치우기`, target: (lv) => 3 + Math.floor(lv / 8) },

  roast: { icon: '🫘', text: (q) => `원두 로스팅 ${q.target}번 거두기`, target: () => 2, need: () => hasKind('roaster') },
  book: { icon: '📚', text: (q) => `책 구경 손님에게 책 ${q.target}권 팔기`, target: () => 2, need: () => hasKind('shelf') || hasKind('stand') },
  regular: { icon: '💬', text: () => '단골 후보에게 책 추천 맞히기', target: () => 1, need: () => S.level >= REGULAR_LEVEL },
  guestbook: { icon: '📝', text: () => '친구 카페에 방명록 남기기', target: () => 1 },
  help: { icon: '🧹', text: () => '친구 카페 일손 돕기', target: () => 1, need: () => S.daily.helps < 3 },
  vote: { icon: '🗳️', text: () => '주간 인기투표 참여하기', target: () => 1, need: () => S.vote.used < VOTES_PER_WEEK },
  buy: { icon: '🛍️', text: () => '상점에서 가구·벽지 1개 사기', target: () => 1 },
};
const questIcon = (q) => { const ic = QUEST_DEFS[q.type].icon; return typeof ic === 'function' ? ic(q) : ic; };
const questText = (q) => QUEST_DEFS[q.type].text(q);
const questXp = () => Math.max(6, Math.round(xpToNext(S.level) * 0.35));
const questBonusXp = () => Math.round(xpToNext(S.level) * 0.5);
function ensureQuests() {
  if (!S.onboarded) return;
  const today = dayKey();
  if (S.quests && S.quests.date === today && S.quests.list.length) return;
  const r = rng(hashStr(today + S.nickname));
  const lv = S.level;
  const pool = shuffle(Object.keys(QUEST_DEFS).filter((k) => !['serve', 'coins'].includes(k) && (!QUEST_DEFS[k].need || QUEST_DEFS[k].need())));
  const types = ['serve', 'coins', ...pool].slice(0, QUEST_PER_DAY);
  const xp = questXp();
  const list = types.map((type, i) => {
    const q = { id: `${today}-${i}`, type, prog: 0, xp, coin: 50 + lv * 10, claimed: false, giver: Math.floor(r() * 1e9) };
    if (type === 'menu') q.menu = pick(availableMenu(), r).id;
    q.target = QUEST_DEFS[type].target(lv);
    return q;
  });
  // 빨리 끝나는 것 먼저
  list.sort((a, b) => a.target - b.target);
  S.quests = { date: today, list, bonus: false, bonusXp: questBonusXp() };
}
/** 퀘스트 진행 (손님 대접·청소·투표 등에서 부른다) */
function questEvent(type, n = 1, menu) {
  if (!S.quests || S.quests.date !== dayKey()) return;
  for (const q of S.quests.list) {
    if (q.claimed || q.type !== type || q.prog >= q.target) continue;
    if (type === 'menu' && q.menu !== menu) continue;
    q.prog = Math.min(q.target, q.prog + n);
    if (q.prog >= q.target) toast(`✅ 퀘스트 완료! ${questText(q)} — 왼쪽에서 보상 받기`);
  }
}
function claimQuest(q) {
  if (q.claimed || q.prog < q.target) return;
  q.claimed = true;
  S.coins += q.coin;
  toast(`🎉 퀘스트 보상: 경험치 +${q.xp} · 코인 +${fmt(q.coin)}`, true);
  if (W.player) { burst(W.player.x, W.player.y, ['star', 'heart'], 12); addPopup(W.player.x, W.player.y, `EXP +${q.xp}`, '#9b87c9', 0.5); }
  addXp(q.xp);
  saveState();
}
function claimQuestBonus() {
  const Q = S.quests;
  if (Q.bonus || Q.list.some((q) => !q.claimed)) return;
  Q.bonus = true;
  S.gold += 2;
  toast(`🎁 오늘의 퀘스트 올클리어! 경험치 +${Q.bonusXp} · 금 +2`, true);
  if (W.player) burst(W.player.x, W.player.y, ['star', 'heart'], 20);
  addXp(Q.bonusXp);
  saveState();
}
/** 퀘스트 전체 목록 */
