[project]
name = "business-agent"
version = "0.1.0"
description = "A basic Claude-powered business agent."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
business-agent = "business_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/business_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
